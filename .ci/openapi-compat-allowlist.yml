# Documented temporary exceptions for backward-incompatible OpenAPI changes.
# Each entry must include a ticket, reason, and expiry date (YYYY-MM-DD).
#
# Exception lifecycle (the gate's own design): an entry exists only while
# the change is NOT yet part of a release baseline tag; when the next
# release tag is cut, the baseline regenerates from it, the exception
# turns STALE (the gate fails main until it is removed), and the re-baseline
# PR must delete it — the mechanism that keeps this list temporary.
#
# 2026-10-24 (PR #722, phase 2b): removed the disputes entry — measured
# stale at birth. It documented a 200 -> 201 spec change that never existed
# in the generated contract: springdoc documents the DEFAULT 200 for
# ResponseEntity-returning handlers regardless of the programmatic
# ResponseEntity.status(HttpStatus.CREATED) the controller builds (verified
# against the v0.1.0 tag: its DisputeController.open returned
# ResponseEntity.ok — the spec carried 200 then, and it carries 200 now).
# The entry therefore matched no reported breaking change; the verifier
# only surfaces that on a dirty diff, which is why it survived undetected
# since 2026-09-26. The RUNTIME behavior change (201 on creation) is real
# and stays; the spec-accuracy gap it exposed (creation endpoints whose
# 201 is documented as 200 — fixable per the springdoc README via
# @ResponseStatus declarations) is tracked in its own issue with its own
# gate-exception requirements.
#
# 2026-10-26 (PR #736): the security-alignment wave. The served contract's
# root-level security: [{"bearerAuth": []}] advertised every operation as
# JWT-required while the resource chain deliberately serves a public family
# permitAll — the v0.1.0 baseline's own SecurityConfig (lines 135/136/137/141
# at the tag) opened exactly these four families, so the misdeclaration is
# as old as the baseline itself. PR #736's PublicApiSecurityCustomizer
# documents that enforced reality per operation (security: []), which
# openapi-diff 2.1.7 correctly reports as a SECURITY_REQUIREMENTS_DECREASED
# break per the official model (BackwardIncompatibleProp enabled by default;
# measured on the official JSON report: securityRequirements.missing
# [{"bearerAuth": []}] on exactly the ten baseline-era public operations —
# every operation added since v0.1.0 is a new addition the tool does not
# security-diff, and every authenticated surface keeps the root requirement,
# so the set below is exhaustive). The verifier classifies that break as a
# kind: security-remove entry so it is representable here; scope increases
# on a surviving requirement remain fail-closed ([UNREPRESENTABLE]). All
# ten entries document a spec-vs-reality alignment with zero runtime
# behavior change (SecurityConfig untouched by the byte; the bearerAuth
# scheme itself stays defined and required on every non-public operation).
# Delete all ten in the release re-baseline PR that follows the next tag.
exceptions:
  # GET /api/v1/listings/** — the public catalog browse family
  # (v0.1.0 SecurityConfig line 135: requestMatchers(GET, ...).permitAll())
  - path: GET /api/v1/listings
    kind: security-remove
    ticket: PR #736 (fix/openapi-public-security-alignment-20261026) — TestSprite group-C spec-accuracy gap, 2026-10-26 deep-dive
    reason: Spec-alignment only — the public catalog browse collection has been served permitAll since the v0.1.0 baseline (SecurityConfig line 135 at the tag) while the baseline spec over-declared the root-level bearerAuth with no per-operation override, so every consumer trusting the advertised contract was misled (TestSprite's negative-auth tests expected 401 here and the honest 2xx answer read as a failure); PR #736's PublicApiSecurityCustomizer documents the enforced reality with security: [] — zero runtime behavior change, SecurityConfig untouched by the byte. Remove in the release re-baseline PR that follows the next tag.
    expiry: 2027-01-31

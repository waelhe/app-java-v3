# Documented temporary exceptions for backward-incompatible GraphQL schema
# changes — the GraphQL twin of .ci/openapi-compat-allowlist.yml, consumed
# by .ci/graphql-compat-classifier.py via .ci/check-graphql-compat.sh.
#
# Lifecycle (the OpenAPI gate's own design, verbatim): an entry exists only
# while the change is NOT yet part of a release baseline tag; when the next
# release tag is cut, the baseline regenerates from it, the entry turns
# STALE (the gate fails main until it is removed), and the re-baseline PR
# must delete it — the mechanism that keeps this list temporary.
#
# A `target` names the schema object the exception covers: a type
# ("type X"), a field ("field X.y" — covers its type/nullability/argument
# findings), an enum value ("enum X.v"), or an argument
# ("argument X.y(a)").
exceptions:
  - target: field Query.services
    ticket: GraphQL target design Phase 1 (docs/api/graphql-target-architecture.md §6 "Do not leave an unbounded legacy field indefinitely", PR feat/graphql-p0-bounded-foundation)
    reason: The demo-era unbounded field services: [Service!]! (Pageable.unpaged() under it, no arguments, no page metadata) is REPLACED by the bounded relay connection services(first: Int, after: String): ServiceConnection! — the consumer inventory measured zero contracted consumers (the repository's own tests are the only callers; the Android client is REST-only, grep-measured), which the design plan §6 names as the condition for direct replacement rather than parallel-field migration. No client migration exists to perform.
    expiry: 2027-03-31

# CodeRabbit configuration — permanent gate config + review-round scoping.
# Round 1 of the wave review: SDL + governance docs (40 of the 400-file PR).
# Config is read from the PR head branch (official reference).
language: ar
tone_instructions: >-
  Java 25 + Spring Boot 4.1.x Modulith monorepo. Judge changes against
  official Spring/DGS/Flyway documentation; flag undocumented assumptions,
  module boundary violations, and missing test coverage.
reviews:
  profile: chill
  request_changes_workflow: true
  allow_author_approval: false
  review_status: true
  commit_status: true
  fail_commit_status: true
  high_level_summary: true
  path_filters:
    - "!**/package-lock.json"
    - "!/.coderabbit.yaml"
    - "**/*.graphqls"
    - "docs/governance/**"
  auto_review:
    enabled: true
    drafts: false
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - ".*"
chat:
  auto_reply: true

# Trivy vulnerability ignore policy — honored by .github/workflows/container-scan.yml
# (input: trivyignores: .trivyignore.yaml).
#
# Gate policy (the workflow fails on HIGH/CRITICAL *fixed* findings):
# fixable findings are closed at image build time — the runtime stage of the
# Dockerfile runs `apk upgrade --no-cache` against the v3.24 stable branch
# (the version-bump response the gate prescribes; see the Dockerfile comment
# for the measured evidence: libexpat 2.8.4-r0 for CVE-2026-76956/76957 and
# openssl 3.5.8-r0 for CVE-2026-14456, both confirmed by Alpine's security
# tracker for 3.24-main). An ignore entry is therefore reserved for findings
# with NO fix published for the branch yet — and every such entry MUST carry
# `expired_at` so it stops silencing the gate on a date, and MUST carry
# `statement` with the engineering justification. Enforced live against trivy
# 0.74.0 (2026-09-06): expired_at in the past => the finding returns to the
# report (gate fails again); expired_at in the future => silenced; the classic
# .trivyignore text format does NOT enforce expiry, hence the yaml form (trivy
# docs/guide/configuration/filtering.md). This file is guard-pinned by
# PlatformGovernanceFilesTest (containerScanIgnoresAreBoundedEntries).
#
# History: CVE-2026-14456 (alpine openssl QUIC-server DoS, unreachable via
# JSSE) was carried here 2026-09-06..2026-09-09 while awaiting an
# eclipse-temurin rebuild that had not shipped the fix (tag last pushed
# 2026-08-21). The runtime-stage OS upgrade now delivers 3.5.8-r0 at build
# time, so the entry is removed.
#
# CVE-2026-102554 (Guava deserialization DoS; fixed upstream in Guava 33.7.2).
# GraphQL Java shades and relocates selected Guava packages to
# graphql.com.google.common; its official build.gradle relocates collect.*,
# and its maintainers confirmed MapMakerInternalMap remains in the jar
# (graphql-java/graphql-java#4498, correction 2026-11-03).
# The previous assertion that native deserialization was unreachable from
# the application network is withdrawn: Spring Data Redis defaults RedisCache
# and RedisTemplate to JDK native serialization. The production JVM and the
# Surefire/Failsafe test JVMs now install the same JEP 290 filter:
#   !graphql.com.google.common.collect.**;*
# This rejects the relocated Guava collect namespace before its readObject
# path can execute and allows other classes. The regression test checks the
# actual relocated MapMakerInternalMap class plus an ordinary String.
# This is a targeted compensating control, NOT a claim that Java native
# serialization is generally safe. Typed, allow-listed JSON serialization
# for Redis values remains a separate migration, not silently mixed into
# this change. The exception remains limited to this exact artifact path
# because the scanner cannot infer a JVM runtime serialization filter.
# Boot 4.1.2 manages graphql-java 25.1; we do not bypass its BOM with an
# unsupported runtime override. Upstream's Guava fix is merged to GraphQL
# Java master (#4498) but the managed application artifact still contains
# the relocated collection classes. Remove this entry after the compatible
# Spring Boot-managed GraphQL Java release no longer contains them.

vulnerabilities:
  - id: CVE-2026-102554
    # The trivy Java (jar) analyzer matches `paths` against the finding's
    # filePath/pkgPath with doublestar globbing (measured in trivy 0.74.0,
    # pkg/result/ignore.go: doublestar.Match per pattern; `paths` and
    # `purls` are ANDed when both are present). The image layout is
    # app/lib/<jar> (the gate's own target table, 2026-10-27); the leading
    # `**/` keeps the order-independent of the image's root prefix while
    # still pinning the ONE jar that embeds the vulnerable copy — a finding
    # on any other package stays reportable.
    paths:
      - "**/graphql-java-25.1.jar"
    expired_at: 2026-12-11
    statement: >-
      The graphql-java-25.1 JAR embeds Guava 32.1.2-jre classes shaded and
      relocated to graphql.com.google.common.collect. The upstream GraphQL
      Java maintainer confirmed MapMakerInternalMap remains in the artifact
      (graphql-java/graphql-java#4498, correction 2026-11-03). Because this
      application uses Spring Data Redis JDK native serialization by default,
      the earlier claim that the deserialization path was unreachable from
      the application is withdrawn. The production JVM and Surefire/Failsafe
      test JVMs now install the JEP 290 process-wide filter
      !graphql.com.google.common.collect.**;* which rejects that relocated
      collection namespace before its readObject method runs while allowing
      other classes. JavaSerializationFilterTest loads the actual relocated
      MapMakerInternalMap class and verifies rejection while permitting
      String. This is a targeted compensating control, not a claim that JDK
      native serialization is generally safe; typed JSON serialization with
      explicit type allow-lists remains a separate cache migration. The
      exception remains scoped to this exact JAR because Trivy cannot model
      the runtime JVM filter. Remove it when the Spring Boot-managed
      GraphQL Java artifact no longer contains the affected classes.

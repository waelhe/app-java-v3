spring:
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
      file: ../docker-compose.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false

  cache:
    type: simple

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  modulith:
    events:
      completion-mode: delete

  graphql:
    # The explicit local-development opt-in (GraphQL target design §2.2:
    # "Prefer safe defaults in the base profile and explicit opt-in for
    # local development"): GraphiQL's in-browser IDE and schema
    # introspection are developer tooling, so they ride the dev profile
    # only — the base stays safe-by-default and staging/production stay
    # hardened. GraphiQL rides the DGS property namespace now (the
    # official integration guide's overlapping-properties rule: use
    # dgs.graphql.graphiql.enabled — see the base document's dgs: block);
    # introspection stays on the Spring key the DGS integration itself
    # reads directly.
    schema:
      introspection:
        enabled: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# The local-development GraphiQL opt-in, on the DGS-owned key the official
# integration guide directs for the overlapping setting (use
# dgs.graphql.graphiql.enabled). The base document's explicit false is the
# safe default; this profile re-enables the in-browser IDE for local
# development only. The DGS namespace otherwise inherits the base document
# unchanged — the schema location, the federation-off decision, and no
# WebSocket path.
dgs:
  graphql:
    graphiql:
      enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.marketplace: DEBUG

marketplace:
  cors:
    allowed-origins: http://localhost:3000
  # Incident #682's root fix: the dev channel's sender identity — a local
  # default (GreenMail/MailHog accept any sender) so the dev loop boots
  # unchanged, overridable through MAIL_FROM to preview the real identity.
  mail:
    from: ${MAIL_FROM:Marketplace Dev <dev@marketplace.local>}
  security:
    jwt:
      audience: marketplace-api
      keystore:
        path: ${JWT_KEYSTORE_PATH:./marketplace-app/local/dev-authserver.jks}
        password: ${JWT_KEYSTORE_PASSWORD:}
        alias: ${JWT_KEY_ALIAS:marketplace-auth}
        key-password: ${JWT_KEY_PASSWORD:}

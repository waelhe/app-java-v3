spring:
  application:
    name: marketplace

  threads:
    virtual:
      enabled: true

  docker:
    compose:
      enabled: false

  security:
    # Only standard Spring Security properties go here (oauth2.client.*).
    # max-failed-attempts, lock-duration-minutes, and mfa.issuer are NOT Spring
    # Security properties — they are under marketplace.security.* below.
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: user:email,read:user

  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        session:
          events:
            LOG: off
        default_batch_fetch_size: 100
        query:
          fail_on_pagination_over_collection_fetch: true
        envers:
          store_data_at_delete: true
          audit_table_suffix: _aud

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  modulith:
    events:
      completion-mode: archive

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mvc:
    problemdetails:
      enabled: true

  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /graphql/ws
    schema:
      introspection:
        enabled: true
      inspection:
        enabled: true

  session:
    redis:
      flush-mode: on_save
      namespace: marketplace:session
    timeout: 30m

  http:
    clients:
      connect-timeout: 5s

  websocket:
    messaging:
      preferred-json-mapper: jackson

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        max-page-size: 100
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000
  cache:
    type: ${CACHE_TYPE:redis}
    cache-names: catalog-active,catalog-by-category,catalog-search,pricing-calculations,search-results,availability,bookings,users,userSubjects,conversations,paymentIntents,reviews,providers
    # TTL for all Redis cache entries — prevents stale data from persisting indefinitely
    # if a @CacheEvict is missed (e.g. direct DB update by a DBA).
    # Reference: Spring Boot Reference — IO Caching / Redis:
    # "spring.cache.redis.time-to-live" sets the default time-to-live for cache entries.
    # https://docs.spring.io/spring-boot/reference/io/caching.html#io.caching.provider.redis
    redis:
      time-to-live: 30m
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: marketplaceScheduler
            instanceId: AUTO
          threadPool:
            threadCount: 5


server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      pattern: "%h %l %u %t &quot;%r&quot; %s %b %{ms}T"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    conditions:
      enabled: true
  health:
    readinessstate:
      enabled: true
  observations:
    enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: 1m
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_EXPORT_URL:http://localhost:4318/v1/traces}

logging:
  # Structured format (logstash) is now disabled — logback-spring.xml defines
  # the appenders directly with secret redaction via %replace. If structured
  # JSON logging is needed for log aggregation, a custom StructuredLogFormatter
  # with built-in redaction should be implemented (see logback-spring.xml comments).
  file:
    name: ${LOG_FILE:/var/log/marketplace/application.log}
  pattern:
    correlation: "[${correlationId:-}]"
  level:
    org.springframework.modulith: INFO
    org.hibernate.SQL: WARN

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      paymentProcessing:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      paymentProcessing:
        base-config: default
        max-attempts: 3
      booking:
        base-config: default
        max-attempts: 2
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1m
        timeout-duration: 5s
    instances:
      catalog:
        base-config: default
        limit-for-period: 50
      search:
        base-config: default
        limit-for-period: 30
      auth:
        base-config: default
        limit-for-period: 5

app:
  commission:
    rate: 0.10

marketplace:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://marketplace.com}
  security:
    max-failed-attempts: 5
    lock-duration-minutes: 15
    mfa:
      issuer: Marketplace
    auth-server:
      issuer: ${AUTH_SERVER_ISSUER:http://localhost:8080}

spring:
  application:
    name: marketplace

  threads:
    virtual:
      enabled: true

  docker:
    compose:
      enabled: false

  # spring-ai-starter-typesafe is a community client for TypeSafe AI System One (Jev),
  # not generic Spring AI structured output and not the Google/DeepSeek chat provider.
  # It remains opt-in: activate the 'typesafe' profile only after provisioning the
  # separate TYPESAFE_API_KEY; without that profile, official auto-configuration backs off.
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding:
        text: ${SPRING_AI_MODEL_EMBEDDING_TEXT:google-genai}
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:}
        # Spring AI 2.0.1 creates Google embedding connection details
        # whenever this starter is on the classpath; supply this secret in
        # every runtime, even when the embedding model selector is disabled.
        embedding:
          api-key: ${GOOGLE_GENAI_API_KEY}
          text:
            # Keep the model output dimensions identical to PGVector's schema.
            # 768 is below pgvector's HNSW/IVFFlat indexing limits and is
            # supported by the official Gemini embedding API.
            dimensions: ${SPRING_AI_EMBEDDING_DIMENSIONS:768}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
    vectorstore:
      pgvector:
        dimensions: ${SPRING_AI_EMBEDDING_DIMENSIONS:768}
        # Spring AI's official PGVector auto-configuration requires an EmbeddingModel
        # whenever its starter is on the classpath. Select Google embeddings above
        # and keep schema initialization off by default for local databases that do
        # not ship the pgvector extension. Production enables the official initializer
        # in application-prod.yml; no custom VectorStore implementation is used.
        initialize-schema: ${SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA:false}
    # The official ChatClientAutoConfiguration is enabled by default and
    # requires a ChatModel. Keep the client off when no chat provider is selected;
    # the production profile opts in explicitly.
    chat:
      client:
        enabled: ${SPRING_AI_CHAT_CLIENT_ENABLED:false}
    session:
      # Let the official Session JDBC starter initialize its own documented schema.
      repository:
        jdbc:
          initialize-schema: always
  datasource:
    # ${DB_URL:…} — same placeholder pattern as username/password below. The prod
    # profile (application-prod.yml) requires DB_URL fail-fast; this default keeps
    # localhost for local dev/compose/CI (which run Postgres on localhost) while
    # letting a non-prod container deployment (Railway) point at a real host.
    # Evidence: the cf0a1a9 Railway deploy crash-looped on flywayInitializer
    # "Connection to localhost:5432 refused" because this line was hardcoded.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      # The trigram fallback's operator threshold (pg_trgm.word_similarity_threshold
      # — the GUC the `<%` operator reads per the official pg_trgm docs). The D-06
      # baseline harness (SearchBaselineMeasurementIntegrationTest) measured the
      # framework default 0.6 BLIND to its own one-codepoint typo probe: the
      # seeded Arabic rows ('شقة …') score word_similarity ≈ 0.5 against the
      # query word 'شقه' (ة→ه costs a third of a three-letter word's trigram
      # set) — the fallback returned ZERO rows for exactly the case it exists
      # for. 0.3 is the measurement-backed decision the repository javadoc
      # reserved this slot for; a session-level GUC affects only the trigram
      # operators, no other statement semantics.
      connection-init-sql: SET pg_trgm.word_similarity_threshold = 0.3

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        session:
          events:
            LOG: off
        default_batch_fetch_size: 100
        query:
          fail_on_pagination_over_collection_fetch: true
        envers:
          store_data_at_delete: true
          audit_table_suffix: _aud

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    # The parallel-range reality (the contracts ledger's §2 table): Track B
    # owns V150-V189 and already consumed V150-V152 on its branch while
    # Track A's V110-V149 range is still filling (V110-V117 today). Once a
    # deployment applies V152, Flyway's officially documented behavior with
    # outOfOrder=false IGNORES any newly found lower version — Track A's
    # next V118 would be silently skipped, its tables never created, and
    # the E2E surface broken at the first use of the feature. Flyway's own
    # docs prescribe outOfOrder=true for exactly this shape: "If you
    # already have versions 1 and 3 applied, and now a version 2 is found,
    # it will be applied too instead of being ignored" — the documented
    # multiple-branches setting. The other half of the contract stays
    # guarded by MigrationChecksumGuardTest: applied migrations are never
    # modified (validate-on-migrate keeps checking them at every boot).
    out-of-order: true
    clean-disabled: true
    # V51 (postgis plan §5 D-I1) runs DROP/CREATE INDEX CONCURRENTLY —
    # PostgreSQL statements that cannot execute inside a transaction
    # block. Flyway's default PostgreSQL lock mode is the TRANSACTIONAL
    # advisory lock (pg_try_advisory_xact_lock inside an open
    # transaction on the lock connection); a concurrent index build must
    # wait for pre-existing snapshots, and that open lock transaction
    # predates them — the wait cannot resolve (indefinite hang at boot).
    # The official Flyway setting (flyway.postgresql.transactional.lock)
    # documents this: "If false, session-level locks will be used
    # instead. This should be set to false for statements such as
    # CREATE INDEX CONCURRENTLY." Session-level locks still serialize
    # concurrent migrators (exclusive advisory lock held for the run).
    # Spring Boot maps the setting to spring.flyway.postgresql.*.
    postgresql:
      transactional-lock: false
    # The Qudsayya trial-zone content (R__seed_content_qudsayya.sql) is
    # production/dev data, NOT a test fixture: its whole body sits inside
    # one placeholder-gated DO block. Default true here (prod + dev +
    # the migrator all inherit it); ONLY the test profile binds false
    # (application-test.yml) so the flyway-enabled integration tests keep
    # their pristine-database contracts (absolute counts, page-0
    # composition, full-table cleanups) exactly as before the seed.
    # Where the placeholder is left unresolved (raw psql), the gate
    # evaluates false and the seed stays a no-op — fail-safe.
    placeholders:
      seedContent: "true"

  modulith:
    events:
      completion-mode: archive

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mvc:
    problemdetails:
      enabled: true

  graphql:
    schema:
      # Safe-by-default posture (GraphQL target design Phase 1, verified
      # against the Boot 4.1.1 configuration metadata): introspection's
      # framework default is TRUE, so the base profile disables it
      # explicitly — the JVM-wide kill switch Boot wires into
      # GraphQlAutoConfiguration (Introspection.enabledJvmWide(false)).
      # GraphiQL needs no line: its Boot default is already false, and the
      # local-development opt-in lives in application-dev.yml. Staging and
      # production keep their existing explicit hardening; every profile
      # inherits the safe base.
      introspection:
        enabled: false
      # Startup schema-vs-mappings inspection — the framework's missing-
      # mapping correctness gate, kept on in the base so a dev/test boot
      # fails fast on an unmapped field (staging/prod keep it off as
      # shipped).
      inspection:
        enabled: true
    # The GraphQL WebSocket transport is deliberately NOT configured: its
    # Boot default is "no path, transport off", the schema has no
    # Subscription root, and push delivery is the STOMP channel's contract
    # (design §5.8: do not keep a second unexplained push protocol). The
    # former base-level spring.graphql.websocket.path is removed — removal
    # disables the transport in every profile that inherited it.

  session:
    data:
      redis:
        repository-type: indexed
        flush-mode: on_save
        namespace: marketplace:session
    timeout: 30m

  security:
    oauth2:
      authorizationserver:
        issuer: ${AUTH_SERVER_ISSUER:http://localhost:8080}

  http:
    clients:
      connect-timeout: 5s

  websocket:
    messaging:
      preferred-json-mapper: jackson

  # i18n floor (roadmap B4): the framework's AcceptHeaderLocaleResolver uses
  # spring.web.locale as the default when a request carries no Accept-Language
  # — responses stay byte-identical to the pre-B4 English literals. Arabic
  # resolves via messages_ar.properties on Accept-Language: ar.
  # Property verified against spring-boot-autoconfigure 4.1.1 configuration
  # metadata (WebProperties): "spring.web.locale". Previously this key sat
  # under spring.data.web.locale where no such property exists — it bound
  # nothing (CodeRabbit #241).
  web:
    locale: en
  # i18n determinism (official Spring Boot reference — Internationalization):
  # spring.messages.fallback-to-system-locale defaults to true, so a JVM whose
  # Locale.getDefault() is not en (e.g. an ar_EG OS) still pulls the system
  # locale into ResourceBundle candidate resolution and silently resolves the
  # Arabic bundle even for Locale.ENGLISH requests. The JDK ResourceBundle
  # spec combines the requested locale AND Locale.getDefault() into the
  # candidate chain; pinning the fallback off keeps the byte-identical English
  # floor above authoritative on any machine (CI stays green, this dev box no
  # longer needs -Duser.language=en to reproduce CI).
  messages:
    fallback-to-system-locale: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        max-page-size: 100
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000
  cache:
    type: ${CACHE_TYPE:redis}
    # The four *-v2 names are the ListingSummary serialization-schema
    # namespaces (CodeRabbit #241) — bumped with every ListingSummary record
    # component change so stale pre-change entries are never read. See
    # CatalogService.CATALOG_CACHE_NAMES. geo-tree (L30) is the 15th named
    # cache — the administrative tree is rebuilt-on-read reference data,
    # evicted through the same AFTER_COMMIT relay as the rest. The count is
    # derived and guarded by DocumentationNumbersGuardTest, so this comment
    # cannot drift silently. system-settings (W0, yelp-level plan §4.6) is
    # the 16th named cache — the control-plane read path added with the
    # settings table, keyed by setting key, evicted by SystemSettingsService
    # through the same relay (its absent case is cached too, so a create
    # evicts as well).
    cache-names: catalog-active-v4,catalog-by-category-v4,catalog-search-v4,pricing-calculations,search-results-v6,availability,bookings,users,userSubjects,conversations,paymentIntents,reviews,providers,provider-stats,geo-tree,system-settings
    redis:
      # Entry TTL — the framework's own expiration channel for cache entries.
      # Evidence: spring-configuration-metadata.json of spring-boot-cache
      # 4.1.1 — "spring.cache.redis.time-to-live | Entry expiration. By
      # default the entries never expire." Binding path (bytecode-verified in
      # that jar): CacheProperties$Redis.timeToLive -> RedisCacheConfiguration
      # -> defaultCacheConfig().entryTtl(...) -> every RedisCacheManager
      # entry. Without this key, all 16 named caches hold entries FOREVER:
      # invalidation only happens via CacheInvalidationRelay (AFTER_COMMIT),
      # which fires solely when an entity CHANGES — dead rows never do.
      # Growth is unbounded by construction: catalog-search / search-results
      # key on the raw user query text (every unique search = a new row) and
      # bookings / conversations / paymentIntents key on entity ids (every
      # read-once entity leaves an immortal row after it goes cold). Redis on
      # Railway runs with no maxmemory/eviction (requirepass + RDB only), so
      # unexpired keys accumulate toward the container memory ceiling.
      # TTL semantics: fixed expiry from write (SET .. EX — no sliding
      # renewal), so a hot entry is rebuilt at most once per hour (one
      # indexed DB read), and a dead row disappears within the hour. Value
      # derivation, not taste: all 16 caches are rebuildable repository
      # reads (correctness is governed by the AFTER_COMMIT relay, TTL is
      # garbage collection only), and 1h = 2x the user interaction window
      # (spring.session.timeout: 30m) — covers a working session with at
      # most one rebuild per live entry. The test profile overrides
      # cache.type to 'simple', so this key is inert there.
      time-to-live: 1h
  # Quartz removed (V31, dead machine since V29): zero durable jobs remained,
  # so the starter, its JDBC store tables and this whole block were removed.
  # Scheduling is framework-managed: @Scheduled tasks and the Modulith
  # staleness monitor run on Spring's task scheduler.


# Netflix DGS Framework (GraphQL target architecture Phase 2 — the DGS
# adoption) — the DGS-owned property namespace. The official integration
# guide's overlapping-properties rule (netflix.github.io/dgs, Spring
# GraphQL Integration, "DGS Configuration with Spring for GraphQL")
# directs exactly which properties move to the dgs.* namespace and which
# stay spring.graphql.*:
#   - dgs.graphql.schema-locations replaces spring.graphql.schema.locations
#     (the DGS schema source is authoritative; the SDL stays in the
#     Spring-GraphQL-conventional classpath:graphql/ tree — the same tree
#     Boot's @ConditionalOnGraphQlSchema condition measures).
#   - dgs.graphql.graphiql.enabled replaces spring.graphql.graphiql.enabled
#     — and MUST be set explicitly here: the integration's
#     DgsSpringGraphQLEnvironmentPostProcessor maps it onto
#     spring.graphql.graphiql.enabled with a default of TRUE (a backward-
#     compatibility default), so an unset value would flip the base
#     profile's safe-by-default posture to GraphiQL-ON. The explicit false
#     keeps every environment that does not opt in (dev) safe; staging and
#     production restate it under the same DGS key.
#   - spring.graphql.schema.introspection.enabled STAYS on the Spring
#     property: the DGS integration reads that exact key directly (its
#     disableIntrospectionContextContributor conditional), and the
#     post-processor's conflict guard FAILS STARTUP if both the spring
#     property and dgs.graphql.introspection.enabled are set — so the
#     dgs.* introspection key is deliberately absent from every profile.
#   - dgs.graphql.federation.enabled: false — the design's no-federation
#     decision (§9: one coherent schema for one Spring application, no
#     subgraphs); the DGS default is true, which would add the
#     _service/_entities/_Any federation surface to the runtime schema
#     and drift the GraphQL schema compatibility gate's tagged baseline.
#   - The GraphQL WebSocket transport stays unconfigured on BOTH
#     namespaces (dgs.graphql.websocket.path maps onto
#     spring.graphql.websocket.path only when set): no Subscription
#     contract exists, so the transport stays off in every profile —
#     the same §5.8 posture as before the migration.
dgs:
  graphql:
    schema-locations: classpath*:graphql/**/*.graphql*
    graphiql:
      enabled: false
    federation:
      enabled: false
  # The DGS integration's ExcludeAutoConfigurationsEnvironmentPostProcessor
  # disables Boot's GraphQlObservationAutoConfiguration by default (the
  # framework's own default for the Netflix environment), which would
  # silently drop the graphql.request/graphql.datafetcher observations the
  # GraphQL target design §8 demands as a measured fact — the phase-1
  # observation gate. This re-enable restores Boot's
  # GraphQlObservationInstrumentation bean, which the DGS graphQlSource
  # then collects through the same ObjectProvider<Instrumentation>
  # mechanism the limit instrumentations ride (verified against the
  # dgs-framework v12.1.0 source: instrumentations.orderedStream() in the
  # graphQlSource bean) — one observation chain, composed.
  # The post-processor's twin exclusion (GraphQlWebMvcSecurityAuto-
  # Configuration, whose only bean is SecurityDataFetcherExceptionResolver)
  # deliberately stays disabled: the app's GraphQlExceptionResolver already
  # maps AccessDeniedException to the canonical authz taxonomy (§7) with
  # the machine-readable extensions pair, and the phase-1 security/error
  # tests pass under the DGS wiring.
  springgraphql:
    autoconfiguration:
      graphqlobservation:
        enabled: true

server:
  # PORT is the injected platform variable (Railway: "Railway will inject a PORT
  # environment variable that your application should listen on" — docs.railway.com,
  # reference/healthchecks, copy saved at scripts/prod-design-docs/railway-healthchecks.txt).
  # The placeholder-with-default is the documented externalized-config mechanism —
  # no container-side port mapping needed.
  port: ${PORT:8080}
  shutdown: graceful
  # HTTP response compression (official Spring Boot handle — verified by
  # javap + configuration metadata of spring-boot-web-server 4.1.1 this
  # session, not a tuning guess): ServerProperties(prefix="server") +
  # Compression model. Metadata: server.compression.enabled "Whether
  # response compression is enabled" (default false) wires Tomcat's
  # CompressionConnectorCustomizer (compression=on + 2KB floor + mime list).
  # additional-mime-types (official extension handle — "additional MIME
  # types that should be compressed", default []) EXTENDS the built-in list
  # instead of replacing it (text/*, application/json, ... stay intact —
  # zero drift when Boot changes defaults). application/json covers success
  # bodies; application/problem+json covers our RFC 7807 ProblemDetail error
  # bodies (absent from the built-in list — an enabled-only flag would
  # silently skip exactly the responses a weak-network user sees most:
  # 401/404/503). Base profile, not prod-only: compression has no trust
  # dimension (no secrets in bodies — tokens travel headers/cookies — so no
  # BREACH surface), and dev/test must behave like prod.
  compression:
    enabled: true
    additional-mime-types: application/problem+json
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      pattern: "%h %l %u %t &quot;%r&quot; %s %b %{ms}T"
      # Bound retention — spring-boot-tomcat 4.1.1 spring-configuration-metadata:
      # server.tomcat.accesslog.max-days, "Number of days to retain the access
      # log files before they are removed", DEFAULT -1 (Tomcat AccessLogValve
      # maxDays semantics: <= 0 keeps every rotated file forever). With daily
      # rotation (rotate: true default) the default grows /app/logs unbounded
      # for the lifetime of the container's writable layer — the opposite of
      # self-managing disk hygiene. 30 days matches a monthly investigation
      # window; the files are container-local (lost on redeploy) either way.
      max-days: 30

management:
  health:
    mail:
      # S10 (measured 2026-09-26): the mail health contributor dragged the
      # AGGREGATE /actuator/health to 503 DOWN (~5.9s response = the 5s SMTP
      # connectiontimeout signature; readiness/liveness stayed UP) because the
      # prod SMTP host is unreachable from the Railway runtime — while email
      # is an auxiliary, best-effort channel in this architecture (notifications
      # only; every send is @Observed("email.send") and failures are logged).
      # Official remedy — Spring Boot Reference, Actuator › Endpoints ›
      # "Auto-configured HealthIndicators": selected indicators can be enabled
      # or disabled per key via management.health.<key>.enabled. Auxiliary
      # integrations do not gate platform health; their brokenness is observed
      # through the metrics pipeline (email.send observation + alert rules),
      # not through a synchronous SMTP connect on every health call. The SMTP
      # outage itself is an operational follow-up (MAIL_* vars), declared in
      # the risk register — disabling the indicator does not fix the outage.
      enabled: false
  endpoints:
    web:
      exposure:
        # The official operator surface — the complete documented endpoint
        # set for THIS application (Spring Boot Reference, Actuator ›
        # Endpoints: the endpoint id table; Monitoring and Management Over
        # HTTP: "you should take care to protect HTTP endpoints in the same
        # way you would any other sensitive instance" — every id below rides
        # the chain's hasRole('ADMIN') rule for /actuator/** (the operator
        # role — the same vocabulary every /api/v1/admin surface carries),
        # with only the health probes and info the SecurityConfig
        # permitAlls deliberately for the Railway healthcheck and the
        # watchdog probe contract).
        #
        # The set, id by id, each the reference's own row:
        #   auditevents  — "Exposes audit events information" (activated by
        #                  the JpaActuatorAuditEventRepository bean — the
        #                  official Auditing recipe's production form)
        #   beans        — "Displays a complete list of all the Spring beans"
        #   caches       — "Exposes available caches" (read + the documented
        #                  evict operation for the operator)
        #   conditions   — "Shows the conditions that were evaluated on
        #                  configuration and auto-configuration classes"
        #                  (closes the dead-config gap: the endpoint was
        #                  enabled below but never listed here — unreachable)
        #   configprops  — "Displays a collated list of all
        #                  @ConfigurationProperties. Subject to sanitization"
        #   env          — "Exposes properties from Spring's
        #                  ConfigurableEnvironment. Subject to sanitization"
        #   flyway       — "Shows any Flyway database migrations that have
        #                  been applied" (the migration history the operator
        #                  reconciles a deployment against)
        #   health       — the deployment's own gates (permitAll'd probes)
        #   info         — application info
        #   loggers      — "Shows and modifies the configuration of loggers"
        #                  (the documented RUNTIME control: the operator
        #                  raises a package to DEBUG at incident time and
        #                  lowers it back — no redeploy, no restart)
        #   mappings     — "Displays a collated list of all @RequestMapping
        #                  paths" (the wire's own inventory)
        #   metrics      — "Shows metrics information" (the MeterRegistry
        #                  listing the /console/metrics board reads)
        #   prometheus   — the scraping exposition (the watchdog/alert rules)
        #   modulith     — the Application Module Actuator
        #                  (spring-modulith-actuator, official Modulith
        #                  "Production-ready Features" recipe): GET
        #                  /actuator/modulith returns the live module
        #                  structure (names, displayName, dependency graph)
        #                  so the system reports its own layers.
        #   scheduledtasks — "Displays the scheduled tasks in your
        #                    application" (the automation inventory — the
        #                    operator SEES every automatic job the platform
        #                    runs: cleanups, resubmission, expirations)
        #   threaddump   — "Performs a thread dump" (the incident-time
        #                  diagnostic)
        #
        # Deliberately NOT in the set (each the reference's own guidance):
        #   httpexchanges — "we recommend using InMemoryHttpExchangeRepository
        #                    only for development environments. For production
        #                    environments, we recommend using a production-ready
        #                    tracing or observability solution" — this platform
        #                    runs the OTel/OTLP tracing pipeline (tracing
        #                    sampling below), so the production exchange record
        #                    is the trace, not an in-memory ring.
        #   shutdown      — "Disabled by default" and it stays disabled: the
        #                    platform's stop channel is Railway's, not an
        #                    HTTP POST.
        #   sessions/quartz/liquibase/integrationgraph — no such technology in
        #                    this application (stateless JWT chain, Flyway not
        #                    Liquibase, no Quartz, no spring-integration).
        include: auditevents,beans,caches,conditions,configprops,env,flyway,health,info,loggers,mappings,metrics,prometheus,modulith,scheduledtasks,threaddump
  endpoint:
    conditions:
      enabled: true
    env:
      # The official sanitized-by-default posture, lifted exactly one notch
      # to the reference's own operator option: "when-authorized - values
      # are shown only to authorized users". Belt and suspenders with the
      # chain rule: only the ADMIN role even reaches these endpoints (the
      # CodeRabbit #564 round), and authorized = the authenticated
      # operator; anything else that ever reaches the endpoint still sees
      # fully sanitized values ("by default values are always fully
      # sanitized (replaced with ******)").
      show-values: when-authorized
    configprops:
      show-values: when-authorized
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          # The documented membership (A-15's smoke, the watchdog's probe
          # contract, MultiReplicaReadiness's replica story — all three name
          # the same trio): db, redis, diskSpace. Redis carries the login
          # sessions themselves (spring-session-data-redis, the indexed
          # repository) and the named caches — a Redis outage leaves the
          # login gate down, which is exactly a not-ready state, the same
          # core-vs-auxiliary line S10 drew when mail (notifications only,
          # best-effort) was kept OUT of platform health.
          include: db,redis,diskSpace
        liveness:
          include: ping
  observations:
    enabled: true
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 0.1
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: 1m
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_EXPORT_URL:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash
      file: logstash
  file:
    name: ${LOG_FILE:/var/log/marketplace/application.log}
  logback:
    rollingpolicy:
      # Official Spring Boot keys — reference page cached at scripts/ops-phase-a/boot-logging-official.html
      file-name-pattern: ${LOG_FILE:/var/log/marketplace/application}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 2GB
      clean-history-on-start: true
  pattern:
    correlation: "[${correlationId:-}]"
  level:
    org.springframework.modulith: INFO
    org.hibernate.SQL: WARN

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      paymentProcessing:
        base-config: default
      # D.4 (compliance plan wave D — channel resilience): the three channels
      # that cross the process boundary beyond the PSP. mailSend guards the
      # SMTP crossing (EmailService.send — the async AFTER_COMMIT mail leg);
      # aiChat guards the AI provider crossing (AiChatGateway.chat) and must
      # NEVER open on the OFF state: ServiceUnavailableException (the honest
      # 503 SU-001 "capability is OFF, not broken") is a state, not a channel
      # failure — the official ignore-exceptions mechanism keeps the circuit
      # honest about the provider's real health only. mediaStorage guards the
      # S3-compatible object storage's four network operations (HeadObject
      # verify, GetObject/PutObject thumbnail pipeline, DeleteObject) via the
      # programmatic decorator in S3MediaStorage — yml configures it exactly
      # like the annotation instances.
      mailSend:
        base-config: default
      aiChat:
        base-config: default
        ignore-exceptions:
          - com.marketplace.shared.api.ServiceUnavailableException
      mediaStorage:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      paymentProcessing:
        base-config: default
        max-attempts: 3
      booking:
        base-config: default
        max-attempts: 2
      # D.4: transient-blip absorption for the annotation-style channel
      # (the programmatic mediaStorage breaker needs no retry wrapper — the
      # S3 SDK's own retry policy owns transport-level blips; the breaker
      # here owns the outage decision).
      # Union note 2026-10-09: the aiChat retry instance RETIRED — the
      # conversational gateway writes the user turn into the Spring AI
      # Session history through the advisor on every invocation, so a retried
      # call would duplicate the turn in the conversation history (measured
      # non-idempotence on this design; the single-turn design the instance
      # was measured for retired with Track A's gateway). The outage-isolation half survives on the chat
      # crossing's @CircuitBreaker — its circuitbreaker instance above keeps
      # the OFF-state ignore-list.
      mailSend:
        base-config: default
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1m
        timeout-duration: 5s
    instances:
      catalog:
        base-config: default
        limit-for-period: 50
      search:
        base-config: default
        limit-for-period: 30
      # LLM calls incur provider cost; reject bursts instead of queuing them.
      aiChat:
        base-config: default
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 0
      # L29 (feature-expansion roadmap §5, Week 4): coverage for the
      # high-impact PUBLIC WRITE endpoints — booking creation, review
      # creation, media upload requests. Official Resilience4j Spring Boot
      # model (docs cached scripts/week4-docs/spring-boot-integration.md):
      # named instances bound here, consumed via @RateLimiter annotations.
      # timeout-duration 0 = fail fast with RequestNotPermitted -> 429
      # ProblemDetail (RL-001) instead of queueing write calls behind the
      # 5s default wait — writes must not silently serialize.
      # G8 calibration: every value below is env-tunable (relaxed binding,
      # RESILIENCE4J_RATELIMITER_INSTANCES_<NAME>_LIMIT_FOR_PERIOD etc.)
      # and intentionally conservative until real traffic exists (debt D2).
      # Per-instance state is in-memory: at N replicas the effective limit
      # is N x the value below (documented multi-replica behavior).
      bookingCreate:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      reviewCreate:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      mediaUpload:
        base-config: default
        limit-for-period: 30
        timeout-duration: 0
      # L30 (realestate systems plan): the public geo autocomplete endpoint —
      # a distinct named instance so prefix spam cannot exhaust the shared
      # catalog/search read budget (same L29 model: fail fast, 429 RL-001).
      geoSuggest:
        base-config: default
        limit-for-period: 30
        timeout-duration: 0
      # L34 (realestate systems plan §5): the public lead submission —
      # the fourth high-impact public write endpoint (same L29 model:
      # fail fast, 429 RL-001). Conservative until real traffic (G-R6
      # calibration gate); behind it the per-sender daily cap lives in
      # the service (marketplace.messaging.leads.daily-cap-per-sender).
      leadCreate:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      # L35 (realestate systems plan §5 — saved searches): the fifth
      # high-impact write endpoint (same L29 model: fail fast, 429 RL-001).
      # Conservative until real traffic. The stored SET is bounded by the
      # per-user cap (marketplace.search.saved-searches.max-per-user,
      # default 20 — the scan's page size bounds memory, this window
      # bounds frequency).
      savedSearchCreate:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      # GraphQL target design Phase 1 (docs/api/graphql-target-architecture.md
      # §5.6/§6 — "rate-limit the surface"): the two named instances of the
      # GraphQL catalog surface, the same L29 fail-fast model (429 RL-001 on
      # the GraphQL side via the resolver's RequestNotPermitted mapping).
      # graphqlServiceQuery sits at the catalog REST read budget (50/min —
      # the `catalog` instance's own number): the services connection reads
      # the same listing store the catalog endpoints read. graphqlCreateService
      # sits at the bookingCreate/reviewCreate/leadCreate write budget
      # (10/min): it delegates to the same catalog use case those writes
      # share. Instance-wide windows per the house model; per-subject caps
      # are the later G-R6 calibration decision, never a silent default.
      graphqlServiceQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      graphqlCreateService:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      # C1 dashboard product lifecycle GraphQL surface: bounded reads and
      # fail-fast writes use explicit names, matching the existing catalog limits.
      graphqlStoreProductQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      graphqlStoreProductMutation:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      # Agent-2 packet (the canonical Saleor plan §5-P2/P3 — the Saleor
      # category/productType/voucher/attribute/attributeValue MUTATION
      # roots): the five named WRITE instances at the platform's own
      # write budget (10/min, fail-fast — the
      # graphqlStoreProductMutation precedent's own number). Dedicated
      # instances because the earlier binding reused the READ buckets
      # (graphqlCategoryQuery/graphqlVoucherQuery at 50/min): mutation
      # traffic consuming read permits answers RATE_LIMIT when read
      # traffic exhausts the shared bucket — the CodeRabbit finding on
      # the product-type mutations, closed for the whole mutation-
      # fetcher family (category, productType, voucher, attribute,
      # attributeValue). Additive keys only (the isolation rule's
      # shared-file addition, recorded in
      # docs/agent-handoffs/agent-2-completion.md).
      graphqlCategoryMutation:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      graphqlProductTypeMutation:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      graphqlVoucherMutation:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      graphqlAttributeMutation:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      graphqlAttributeValueMutation:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      # Agent-2 follow-on (the canonical Saleor plan §5-P2 — the Saleor
      # productVariant MUTATION roots): the variant write instance at
      # the same platform write budget (10/min, fail-fast). Additive
      # key only (the isolation rule's shared-file addition, recorded
      # in docs/agent-handoffs/agent-2-completion.md).
      graphqlProductVariantMutation:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      # Agent-2 L-slice (the canonical Saleor plan §5-P2 — the Saleor
      # collection family): the collection write instance at the same
      # platform write budget (10/min, fail-fast). Additive key only
      # (the isolation rule's shared-file addition, recorded in
      # docs/agent-handoffs/agent-2-completion.md).
      graphqlCollectionMutation:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      # P1 (the canonical Saleor plan §5-P1 — the Saleor Users read roots):
      # me/user/staffUsers share one named read instance at the catalog
      # read budget (50/min) — bounded identity reads behind the same
      # fail-fast model; the ADMIN-enforced legs delegate to the identity
      # owner's use cases.
      graphqlUserQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Campaign packet campaign-b1-a1 (A1 identity agent request, applied by
      # A0): the permission-group read roots' named instance at the same
      # identity read budget as graphqlUserQuery (50/min, fail-fast).
      graphqlPermissionGroupQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Campaign packet campaign-b2-a2 (A2 catalog read roots, applied by
      # A0): the product-type read roots' named instance at the shared
      # catalog read budget (50/min, fail-fast — the catalog limiter
      # precedent's own budget).
      graphqlCatalogRead:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Campaign packet campaign-b3-a1b (A1 identity agent request, applied
      # by A0): the customers read root's named instance at the same
      # identity read budget as graphqlUserQuery (50/min, fail-fast).
      graphqlCustomerQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Campaign packet campaign-b3-a2b (A2 catalog agent request, applied
      # by A0): the attribute read roots' named instance at the shared
      # catalog read budget (50/min, fail-fast).
      graphqlCatalogAttributeQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Campaign packet campaign-b4-a (A2 catalog read roots, applied
      # in-branch by A0 — the sequential single-writer flow): the
      # category read roots' named instance at the shared catalog
      # read budget (50/min, fail-fast — the catalog limiter
      # precedent's own budget).
      graphqlCategoryQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Agent-2 L-slice (the canonical Saleor plan §5-P2 — the Saleor
      # collection read roots and the Collection.products field): the
      # collection read instance at the shared catalog read budget
      # (50/min, fail-fast). Additive key only (the isolation rule's
      # shared-file addition, recorded in
      # docs/agent-handoffs/agent-2-completion.md).
      graphqlCollectionQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Campaign packet campaign-b4-c (A2 catalog read roots, applied
      # in-branch by A0 — the sequential single-writer flow): the
      # product read roots' named instance at the shared catalog
      # read budget (50/min, fail-fast).
      graphqlProductQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Campaign packet campaign-b5-a (A2 catalog read roots, applied
      # in-branch by A0 — the sequential single-writer flow): the
      # product-variant read roots' named instance at the shared catalog
      # read budget (50/min, fail-fast — the catalog limiter
      # precedent's own budget).
      graphqlProductVariantQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Campaign packet campaign-b5-b (P4 order read roots, applied
      # in-branch by A0 — the sequential single-writer flow): the order
      # read roots' named instance at the shared management read budget
      # (50/min, fail-fast — the catalog limiter precedent's own budget).
      graphqlOrderQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Campaign packet campaign-b3-a3 (A3 pricing agent request, applied
      # by A0): the promotion read roots' named instance at the shared
      # read budget (50/min, fail-fast).
      graphqlPromotionQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Campaign packet campaign-b3-a3 (A3 pricing agent request, applied
      # by A0): the voucher read roots' named instance at the shared
      # read budget (50/min, fail-fast).
      graphqlVoucherQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Phase 6 (the GraphQL plan §11-Phase-6 — the first composite
      # journey, the inventory #599 §7 stage 4): the two home reads'
      # named instances, the same L29 fail-fast model. graphqlDiscovery-
      # Query sits at the catalog read budget (50/min — the discovery
      # home read assembles six bounded rails through the shared ports,
      # a heavier read than one listing page); graphqlNeighborhoodFeed-
      # Query at the same 50/min — the bounded feed page the REST feed
      # serves. Conservative until measured traffic (G-R6 calibration
      # gate); env-tunable per the house relaxed-binding rule.
      graphqlDiscoveryQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      graphqlNeighborhoodFeedQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # Phase 7 (the GraphQL plan §11-Phase-7 — the second composite
      # journey, the inventory #599 §5 item 3 / the readiness doc's
      # P0-1 closure): the post-detail journey's two reads' named
      # instances, the same L29 fail-fast model and the same 50/min
      # read budget the home reads sit at — the detail leg is one
      # bounded single-post read (the grouped aggregates over one id),
      # the comments leg one bounded comment page. Conservative until
      # measured traffic (G-R6 calibration gate); env-tunable per the
      # house relaxed-binding rule.
      graphqlPostQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      graphqlPostCommentsQuery:
        base-config: default
        limit-for-period: 50
        timeout-duration: 0
      # L42 (neighborhood community plan §5 — the posts/feed/comments
      # layer): the community writes — two distinct named instances
      # (the plan's own words: "نمطلتان مسماتان مستقلتان") so a comment
      # burst cannot exhaust the post window (same L29 model: fail fast,
      # 429 RL-001, conservative until real traffic; G8 env-tunable via
      # RESILIENCE4J_RATELIMITER_INSTANCES_POSTCREATE_LIMIT_FOR_PERIOD
      # etc.). postCreate sits at the bookingCreate/reviewCreate write
      # budget; postComment at the lighter mediaUpload budget — a comment
      # is one bounded text field, a post is the feed's unit.
      postCreate:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      postComment:
        base-config: default
        limit-for-period: 30
        timeout-duration: 0
      # L47 (the Nextdoor-2026 completeness wave — gap #1, the reactions
      # layer): the community's lightest write — a thank is one id pair
      # with no authored text at all, so it rides the postComment budget
      # (30/min — conservative until real traffic; same L29 model: fail
      # fast, 429 RL-001, env-tunable via
      # RESILIENCE4J_RATELIMITER_INSTANCES_POSTREACT_LIMIT_FOR_PERIOD).
      # One named instance for BOTH the thank and the un-thank: they are
      # one toggle's two directions — a thank/un-thank burst is one
      # member's one behavior, not two.
      postReact:
        base-config: default
        limit-for-period: 30
        timeout-duration: 0
      # L49 (the Nextdoor-2026 completeness wave — gap #4, the events
      # layer): the board's two writes. eventCreate sits at the
      # postCreate/reviewCreate write budget — an event is the board's
      # unit, a full authored record like a post; eventRsvp rides the
      # postReact/postComment budget — a seat is one id pair with no
      # authored text at all (the postReact model verbatim: one named
      # instance for BOTH the RSVP and the un-RSVP — they are one
      # toggle's two directions). Same L29 model: fail fast, 429 RL-001,
      # conservative until real traffic; env-tunable via
      # RESILIENCE4J_RATELIMITER_INSTANCES_EVENTCREATE_LIMIT_FOR_PERIOD
      # / ..._EVENTRSVP_LIMIT_FOR_PERIOD.
      eventCreate:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      eventRsvp:
        base-config: default
        limit-for-period: 30
        timeout-duration: 0
      # L50 (the Nextdoor-2026 completeness wave — gap #5, the market
      # board): the board's ONE write. marketCreate sits at the
      # postCreate/eventCreate/reviewCreate write budget — a market
      # item is the board's unit, a full authored record like a post.
      # The withdraw rides no limiter of its own (the postDelete/
      # eventDelete stance verbatim: an author managing their own rows
      # is not an abuse surface worth a budget). Same L29 model: fail
      # fast, 429 RL-001, conservative until real traffic; env-tunable
      # via RESILIENCE4J_RATELIMITER_INSTANCES_MARKETCREATE_LIMIT_FOR_PERIOD.
      marketCreate:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      # L51 (the Nextdoor-2026 completeness wave — gap #6, the neighbors
      # groups): the board's ONE write pair. A membership is one id pair
      # with no authored text at all (the postReact/eventRsvp model
      # verbatim: one named instance for BOTH the join and the leave —
      # they are one toggle's two directions, a join/leave burst is one
      # member's one behavior, not two), so it rides the
      # postReact/postComment/eventRsvp budget. Same L29 model: fail
      # fast, 429 RL-001, conservative until real traffic; env-tunable
      # via RESILIENCE4J_RATELIMITER_INSTANCES_GROUPMEMBERSHIP_LIMIT_FOR_PERIOD.
      groupMembership:
        base-config: default
        limit-for-period: 30
        timeout-duration: 0
      # L52 (the Nextdoor-2026 completeness wave — gap #7, the polls):
      # the board's write pair. pollCreate sits at the postCreate/
      # eventCreate/marketCreate write budget — a poll is the board's
      # unit, a full authored record like a post (its 2–5 options ride
      # the same transaction); pollVote rides the postReact/eventRsvp/
      # groupMembership budget — a vote is the lightest id-pair write
      # the platform owns (no authored text at all, the postReact model
      # verbatim). The withdraw (DELETE) rides no limiter of its own
      # (the postDelete/eventDelete/marketDelete stance verbatim: a
      # member managing their own rows is not an abuse surface worth a
      # budget) — this instance bounds the vote burst only. Same L29
      # model: fail fast, 429 RL-001, conservative until real traffic;
      # env-tunable via
      # RESILIENCE4J_RATELIMITER_INSTANCES_POLLCREATE_LIMIT_FOR_PERIOD
      # / ..._POLLVOTE_LIMIT_FOR_PERIOD.
      pollCreate:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      pollVote:
        base-config: default
        limit-for-period: 30
        timeout-duration: 0
      # L44 (neighborhood community plan §5 — direct neighbor messages):
      # the direct conversation open — a distinct named instance (the plan's
      # own "حدود معدل conversationCreate مسماة محافظة", pre-declared in the
      # L45 report controller's javadoc) so a conversation-open burst cannot
      # exhaust the community writes above (same L29 model: fail fast, 429
      # RL-001, conservative until real traffic; env-tunable via
      # RESILIENCE4J_RATELIMITER_INSTANCES_CONVERSATIONCREATE_LIMIT_FOR_PERIOD).
      # The booking conversation's own POST /conversations deliberately keeps
      # its historic unlimited shape (booking-gated already — a CANCELLED
      # booking cannot open one); this instance bounds the NEW gate whose
      # only pre-write gates are existence and non-self. The pair's
      # uniqueness is V67's backstop, not a per-caller cap — this window
      # bounds frequency, not identity.
      conversationCreate:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0
      # L39 (realestate systems plan §5): the public sitemap crawl
      # surface — a distinct named instance so a crawler's burst cannot
      # exhaust the shared catalog/search read budget (the geoSuggest
      # model: fail fast, 429 RL-001). robots.txt is deliberately NOT
      # limited: it is a pure configuration emission with no data path,
      # and crawlers refetch it by design before every session —
      # throttling it would break the protocol's own etiquette.
      seo:
        base-config: default
        limit-for-period: 30
        timeout-duration: 0
      # W4 (yelp-level plan §5 — G21, provider follows): the follow write —
      # the lightest id-pair write the platform owns (the postReact/
      # eventRsvp model verbatim: one named instance, no authored text at
      # all, so it rides the 30/min light-write budget — conservative
      # until real traffic; same L29 model: fail fast, 429 RL-001,
      # env-tunable via
      # RESILIENCE4J_RATELIMITER_INSTANCES_PROVIDERFOLLOWCREATE_LIMIT_FOR_PERIOD).
      # The unfollow deliberately keeps the SavedSearch/delete shape
      # (unlimited): a withdraw is a read-bounded owner DELETE, and the
      # pair's uniqueness is V93's partial index backstop — this window
      # bounds the growth of the fan-out the activation bridge walks.
      providerFollowCreate:
        base-config: default
        limit-for-period: 30
        timeout-duration: 0

app:
  commission:
    rate: 0.10

marketplace:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://marketplace.com}
  # Incident #682's root fix — the base-profile default: profile-less boot
  # contexts (the CI compatibility gates boot the plain jar with no profile;
  # spring.mail.host's empty default still registers a dormant sender) get a
  # syntactically valid local sender so the channel's identity validation
  # never blocks a context that cannot send anyway. The DEPLOYED profiles
  # override with the binding ${MAIL_FROM} and NO default — production and
  # staging still fail fast without the real identity (Boot's documented
  # precedence: profile-specific files win for the keys they carry).
  mail:
    from: ${MAIL_FROM:Marketplace <no-reply@marketplace.local>}
  # L33 (realestate systems plan): the classifieds lifecycle policy. 90
  # days is the global classifieds convention range (Dubizzle ~60, market
  # standard 60-90); env-tunable (MARKETPLACE_CATALOG_EXPIRY_EXPIRY_DAYS).
  # Unset means activations without an explicit date answer 409 — the
  # "no silently-immortal listing" rule; the cooldown bounds renewal
  # recycling (one renewal per day by default).
  catalog:
    expiry:
      expiry-days: ${MARKETPLACE_CATALOG_EXPIRY_DAYS:90}
      renewal-cooldown-days: ${MARKETPLACE_CATALOG_RENEWAL_COOLDOWN_DAYS:1}
    # L39 (realestate systems plan §5 — SEO): the public-site contract.
    # Blank base URL by design — the same gate model as PSP/MAIL: the
    # sitemap describes the PUBLIC SITE's pages and that origin belongs
    # to the frontend deployment (client-hosting plan, gates B/C), so
    # until it exists the sitemap capability stays OFF (503 SU-001, not
    # broken), the JSON-LD block omits url, and robots.txt omits the
    # Sitemap line — never a fabricated URL. One env variable turns it
    # all on when the public origin exists.
    seo:
      public-site-base-url: ${MARKETPLACE_CATALOG_SEO_PUBLIC_SITE_BASE_URL:}
      listing-path: ${MARKETPLACE_CATALOG_SEO_LISTING_PATH:/listings/{id}}
      robots-disallow-paths: ${MARKETPLACE_CATALOG_SEO_ROBOTS_DISALLOW_PATHS:}
  # Currency exchange channel (roadmap B4 / gap G-PROD-4) — provider-optional
  # exactly like the PSP/MEDIA_S3/MAIL gates: when no rate is bound, no
  # exchange beans are created (StaticRatesConfiguredCondition) and
  # GET /api/v1/pricing/convert answers 503 SU-001 instead of
  # half-working. Rate semantics: units of the base currency per 1 unit of
  # the CODE (e.g. USD: 3.75 with base SAR = 1 USD = 3.75 SAR). Bind one
  # rate per supported currency — a live FX rates provider is a deployment
  # decision for a later binding, not a code decision.
  pricing:
    currency:
      exchange:
        base-currency: ${EXCHANGE_BASE_CURRENCY:SAR}
        # Bind rates to wake the channel (dormant until then):
        #   YAML:   rates:
        #             USD: 3.75
        #   env:     MARKETPLACE_PRICING_CURRENCY_EXCHANGE_RATES_USD=3.75
        # (one key per ISO 4217 code; relaxed binding flattens the env form
        #  to the same rates.<CODE> property names)
  # Real payment channel (roadmap B3 / gap G-PROD-3) — provider-optional
  # exactly like the MAIL / MEDIA_S3 gates: when either Stripe credential is
  # blank, no channel beans are created (StripeChannelConfiguredCondition)
  # and processIntent keeps the existing internal-intent behavior; the
  # /api/v1/payments/webhooks/stripe endpoint answers 503 SU-001 instead of
  # half-verifying. Official credential shape (docs cached at
  # scripts/psp-doc-verify/): sk_test_.../sk_live_... API key selects the
  # official sandbox/live mode; whsec_... is the webhook endpoint secret.
  payments:
    psp:
      stripe:
        api-key: ${PAYMENTS_STRIPE_API_KEY:}
        webhook-secret: ${PAYMENTS_STRIPE_WEBHOOK_SECRET:}
  # Listing media (roadmap B1 / G-PROD-1). S3-compatible presigned channel —
  # provider-optional exactly like the MAIL placeholders: when the four
  # MEDIA_S3_* credentials are blank, no storage beans are created
  # (MediaStorageConfiguredCondition) and every /api/v1/media endpoint
  # answers 503 SU-001 instead of half-working. Official credential shape
  # (Cloudflare R2 doc, cached at scripts/media-doc-verify/):
  #   endpoint = https://<ACCOUNT_ID>.r2.cloudflarestorage.com
  #   region   = auto ("Required by SDK but not used by R2")
  # Any S3-compatible endpoint (incl. AWS S3) works — the provider choice is
  # a deployment decision, not a code decision.
  media:
    storage:
      endpoint: ${MEDIA_S3_ENDPOINT:}
      region: ${MEDIA_S3_REGION:auto}
      bucket: ${MEDIA_S3_BUCKET:}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
    limits:
      max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:10485760}
      allowed-content-types: ${MEDIA_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/gif}
      # Presigned URL lifetime (upload + download). Official bounds: 1s to 7d
      # (R2 doc + S3Presigner javadoc).
      presign-ttl: ${MEDIA_PRESIGN_TTL:15m}
  security:
    jwt:
      audience: ${JWT_AUDIENCE:marketplace-api}
      keystore:
        # Two source channels resolved by SecurityConfig.jwkSource (b64 wins when
        # both are present; credentials are required whenever either is set):
        #   b64  — base64 JKS bytes, the write-only-variable channel (JWT_KEYSTORE_B64)
        #   path — file:/classpath: location per keys/README.md
        b64: ${JWT_KEYSTORE_B64:}
        path: ${JWT_KEYSTORE_PATH:}
        password: ${JWT_KEYSTORE_PASSWORD:}
        alias: ${JWT_KEY_ALIAS:}
        key-password: ${JWT_KEY_PASSWORD:}
    session:
      max-sessions: ${SESSION_MAX_SESSIONS:2}
      # A.4 (official-compliance plan §6 wave A) — the multi-device overflow
      # policy, the second documented half of the concurrency pair: false =
      # the documented Spring Security default (the least-recent session is
      # expired so the newest login always succeeds); true = the new login is
      # rejected at the form-login failure URL instead. The env channel gives
      # the platform owner the policy word, exactly like SESSION_MAX_SESSIONS
      # above it.
      max-sessions-prevents-login: ${SESSION_MAX_SESSIONS_PREVENTS_LOGIN:false}
    # N1 (admin-seed hardening): the break-glass administrator's password —
    # env-only channel in production, exactly like OAUTH_CLIENT_SECRET. The
    # fixed bcrypt hash that previously shipped in R__seed_oauth2_client.sql
    # (a credential burned into the repo and the jar for every environment)
    # is gone; AdminUserInitializer converges the admin row from this value
    # through the official JdbcUserDetailsManager API at every boot.
    # The DEV default below is the documented development-only credential
    # (admin/admin-dev for local docker-compose login) — prod binds the
    # mandatory ADMIN_SEED_PASSWORD with NO default (fail-fast, two layers).
    # Test contexts override to blank in application-test.yml: they run
    # JPA-only create-drop schemas (Flyway disabled) with no auth_* tables.
    admin-seed:
      password: ${ADMIN_SEED_PASSWORD:admin-dev}
    # I7 (account-pseudonymization-plan §5-أ, gate b-2(b)) — the HMAC secret
    # for account-subject pseudonymization: the "additional information" GDPR
    # Art. 4(5) requires to be kept separately. Optional until bound exactly
    # like the PSP/MAIL gates: blank = the administrative pseudonymize
    # surface answers 503 SU-001 (capability OFF, not broken) and the
    # re-registration probe in syncFromOidc stays inert (no tombstone can
    # exist while the key never existed). Env channel per secrets-policy §1
    # (env-only, never in Git, never logged).
    pseudonymization:
      subject-hmac-key: ${PSEUDONYMIZATION_HMAC_KEY:}
      # I7 §9 (rotation row — resolved option 1, the keyring): the retired
      # keys, comma-separated, in the env-only channel (secrets-policy §1 +
      # §3 "dual key / overlap window" — the retention shape Spring
      # Security's own JWKS rotation applies: one active key writes,
      # retained keys keep verifying). The re-registration probe derives
      # under the active key AND every key listed here, so tombstones
      # written before a rotation keep blocking re-provisioning.
      # Operational rule: never drop a key from this list while tombstones
      # derived under it can still exist in users.subject. Rotation
      # procedure: set the new key in PSEUDONYMIZATION_HMAC_KEY, append the
      # old key here, redeploy — new tombstones derive under the new key
      # from that moment. Keys are opaque UTF-8 strings like the active key;
      # a key containing a comma cannot be expressed in this channel
      # (base64/hex secrets never do).
      subject-hmac-previous-keys: ${PSEUDONYMIZATION_HMAC_PREVIOUS_KEYS:}

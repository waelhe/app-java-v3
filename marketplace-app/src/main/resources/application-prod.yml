spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN:5}

  jpa:
    show-sql: false

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  flyway:
    clean-disabled: true

  graphql:
    graphiql:
      enabled: false
    schema:
      introspection:
        enabled: false
      inspection:
        enabled: false

  quartz:
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          jobStore:
            isClustered: true

  cache:
    type: redis

  modulith:
    events:
      completion-mode: archive
      staleness:
        publication-threshold: 6h
        processing-threshold: 1h
      republish-outstanding-events-on-restart: true


  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000

server:
  shutdown: graceful
  # Spring Boot Reference — Running Behind a Forwarded-Header Proxy.
  # Required for HTTPS issuer + HSTS to work behind TLS-terminating proxy
  # (Railway/nginx/Traefik). Reference:
  # https://docs.spring.io/spring-boot/reference/web/servlet.html#web.servlet.spring-mvc.forwarded-headers
  forward-headers-strategy: framework
  # OWASP Session Management Cheat Sheet — Cookies.
  # All session cookies must be HttpOnly (no JS access), Secure (HTTPS only),
  # and SameSite=Strict (no cross-site submission).
  # Reference: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html#cookies
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict
        max-age: 3600
        name: SESSION

logging:
  # Log redaction is now handled by logback-spring.xml (applies to BOTH console
  # AND file sinks). The prior logging.pattern.console only worked for the default
  # non-structured pattern — it was silently ignored when structured format was
  # enabled. logback-spring.xml fixes this by defining redaction at the appender level.
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    com.marketplace: INFO

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: db,redis,diskSpace
        liveness:
          include: ping
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  observations:
    enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING:0.1}
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_EXPORT_URL}
        step: ${OTEL_METRICS_EXPORT_STEP:1m}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: ${OTEL_SERVICE_VERSION:0.1.0}
      deployment.environment: production
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_EXPORT_URL}

  security:
    # Only standard Spring Security properties go here (oauth2.client.*).
    # max-failed-attempts and lock-duration-minutes are under marketplace.security.* below.
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: user:email,read:user


marketplace:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    max-failed-attempts: 5
    lock-duration-minutes: 15
    auth-server:
      issuer: ${AUTH_SERVER_ISSUER}
    jwt:
      audience: ${JWT_AUDIENCE:marketplace-api}
      keystore:
        path: ${JWT_KEYSTORE_PATH}
        password: ${JWT_KEYSTORE_PASSWORD}
        alias: ${JWT_KEY_ALIAS}
        key-password: ${JWT_KEY_PASSWORD}

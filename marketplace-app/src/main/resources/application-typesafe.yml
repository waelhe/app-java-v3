# Optional TypeSafe AI System One (Jev) integration.
# Enable the "typesafe" profile only after provisioning the separate TYPESAFE_API_KEY secret.
spring:
  ai:
    typesafe:
      api-key: ${TYPESAFE_API_KEY}

# Enable the community Jev document screening stage in the official Spring AI RAG pipeline.
# Each request screens the retrieved top-5 passages before they reach the answer model.
# This is deliberately opt-in because it adds TypeSafe calls and requires TYPESAFE_API_KEY.
marketplace:
  ai:
    typesafe:
      guardrails:
        # The official Jev guardrail screens input and final answer. Since the advisor rejects
        # stream calls, the gateway buffers guarded calls and emits verified SSE output only after
        # screening; token-by-token streaming remains enabled when guardrails are off.
        enabled: true
      rag:
        enabled: true
      # Jev chooses a model tier through the official TypeSafe Choice API.
      # The router only selects model IDs for the active Spring AI provider.
      model-routing:
        enabled: true
        minimum-confidence: ${TYPESAFE_ROUTING_MIN_CONFIDENCE:0.65}
        google:
          fast-model: ${SPRING_AI_ROUTING_GOOGLE_FAST_MODEL:gemini-3.5-flash-lite}
          capable-model: ${SPRING_AI_ROUTING_GOOGLE_CAPABLE_MODEL:gemini-3.6-flash}
        deepseek:
          fast-model: ${SPRING_AI_ROUTING_DEEPSEEK_FAST_MODEL:deepseek-flash}
          capable-model: ${SPRING_AI_ROUTING_DEEPSEEK_CAPABLE_MODEL:deepseek-v4-pro}

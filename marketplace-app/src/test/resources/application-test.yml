spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
  cache:
    type: simple
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    test-connection: false
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080

app:
  commission:
    rate: 0.10

marketplace:
  cors:
    allowed-origins: http://localhost:3000
  security:
    jwt:
      audience: marketplace-api
  payments:
    webhook:
      shared-secret: test-sig

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false

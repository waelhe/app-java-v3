spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
  cache:
    type: simple
  quartz:
    job-store-type: memory
    auto-startup: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    test-connection: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: test
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          google:
            authorization-uri: http://localhost/oauth2/authorize
            token-uri: http://localhost/oauth2/token
            user-info-uri: http://localhost/oauth2/userinfo
            user-name-attribute: sub
            jwk-set-uri: http://localhost/oauth2/jwks

marketplace:
  cors:
    allowed-origins: http://localhost:3000
  security:
    auth-server:
      issuer: http://localhost:8080
    jwt:
      audience: marketplace-api

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false

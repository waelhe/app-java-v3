spring:
  # AI foundation: tests do not call a live provider. The official
  # spring.ai.model.chat=none selector leaves ChatClientAutoConfiguration
  # enabled by default, so the shared base profile explicitly sets
  # spring.ai.chat.client.enabled=false when no ChatModel is selected.
  # Provider-selection tests opt the official chat builder back in with the
  # selected chat provider. PGVector's official auto-configuration requires an
  # EmbeddingModel when its starter is present, so tests use the official Google
  # embedding model with a test-only key and never make live provider requests.
  ai:
    model:
      chat: none
      embedding:
        text: google-genai
    google:
      genai:
        # Non-secret test-only credential for official embedding auto-configuration.
        # Tests validate bean wiring only; no live Google request is issued.
        embedding:
          api-key: test-key
    vectorstore:
      pgvector:
        # PostGIS CI image does not bundle pgvector binaries; test bean wiring
        # must not attempt to create the extension or vector table.
        initialize-schema: false
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
    hikari:
      # CI connection budget (measured on main 2026-09-05, 14c9aaf Integration
      # run): the workflow's shared PostgreSQL service container defaults to
      # max_connections=100, while the module-test slice contexts (one per
      # @ApplicationModuleTest class) accumulate in the TestContext cache and
      # each holds a default 20/5 Hikari pool against that same instance — the
      # run crossed the limit and a NEIGHBORING class failed to boot with
      # FATAL "sorry, too many clients already" (marginal: the same code was
      # green 30 minutes earlier). No test needs 20 connections; 10/1 keeps
      # every cached context light so the shared budget holds with margin.
      # Production pools are untouched (application.yml).
      maximum-pool-size: 10
      minimum-idle: 1
  cache:
    type: simple
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
    placeholders:
      # The Qudsayya content seed must stay OUT of every test database:
      # the flyway-enabled integration tests (inline flyway.enabled=true
      # overrides the enabled flag above, but THIS binding still applies)
      # hold pristine-database contracts — absolute row counts, page-0
      # composition, full-table DELETE cleanups — that predate the seed
      # and must not depend on production trial-zone content. Base
      # application.yml defaults the placeholder to true; prod/dev and
      # the migrator are untouched by this override.
      seedContent: "false"
  mail:
    host: localhost
    port: 3025
    test-connection: false
    # The test posture against GreenMail's plain SMTP server (the JUnit 5
    # extension on port 3025). The MAIN profile's production posture —
    # mail.smtp.auth: true + starttls — MUST NOT leak into the test
    # profile (Boot's documented precedence: profile-specific files win,
    # but only for keys they themselves carry): with the inherited auth
    # flag and the main profile's empty-string credentials the sender
    # issues SMTP AUTH, GreenMail rejects it (MailAuthenticationException
    # — the measured 19-hour red streak's single root), and the failure
    # cascades far beyond the mail journeys: every notification listener
    # that reaches an email leg throws inside its AFTER_COMMIT
    # transaction, rolling back the in-app notification row saved in the
    # same unit — "LEAD_RECEIVED never landed" was this same auth root
    # one transaction away. Both flags off: no AUTH attempt, no STARTTLS
    # negotiation on a server that never advertises it.
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080

app:
  commission:
    rate: 0.10

marketplace:
  cors:
    allowed-origins: http://localhost:3000
  # Incident #682's root fix: the test channel's sender identity. The test
  # profile activates the mail channel (spring.mail.host=localhost:3025,
  # GreenMail), so the sender is as mandatory here as anywhere — a fixed
  # local value keeps every test context booting while MailChannelProperties
  # proves its binding-time validation in its own slice.
  mail:
    from: Marketplace Test <no-reply@marketplace.test>
  # L33: the test policy — a short window keeps the expiry tests fast; the
  # unset-policy case is covered by property-override tests (409).
  catalog:
    expiry:
      expiry-days: 90
      renewal-cooldown-days: 1
    # L40 (realestate systems plan §5): the view visitor-fingerprint HMAC
    # key for the test profile — same discipline as the L34 leads key
    # below (explicit test-only value; prod fails startup on a blank key
    # via CatalogConfig instead). The dedup window stays at the 24h
    # default here; the TTL-expiry acceptance criterion overrides it to
    # milliseconds on the test that needs it.
    views:
      ip-hash-key: test-profile-fingerprint-key
  security:
    jwt:
      audience: marketplace-api
    # N1 (admin-seed hardening): this profile boots JPA-only create-drop
    # schemas (Flyway disabled above) — the auth_users/auth_authorities
    # tables are Flyway-owned and intentionally DO NOT exist here. The
    # break-glass admin initializer's blank-password contract is a designed
    # no-op (the client initializer's own pattern), so it must never touch
    # the missing schema. Development convenience comes from the base
    # application.yml default (admin-dev); production binds the mandatory
    # ADMIN_SEED_PASSWORD.
    admin-seed:
      password: ""
  payments:
    webhook:
      shared-secret: test-sig
  # L34 (realestate systems plan §5): the sender fingerprint HMAC key for
  # the test profile — SecretKeySpec rejects an empty key, so every test
  # context carries this explicit (test-only) value. Prod fails startup
  # on a blank key instead (MessagingConfig — the JwkSourceProdHardening
  # pattern); this value never leaves the test classpath.
  messaging:
    leads:
      ip-hash-key: test-profile-fingerprint-key

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false

# The post-merge integration round of PR #696 (the follow-up PR's measured
# CI blocker): the GraphQL rate-limiter instances carry the production
# budgets (mostly 10 permits per 60-second window), and the full-stack
# GraphQL integration suites execute a whole test class's worth of
# mutations inside one window — the budget is a PRODUCTION calibration,
# not a contract under test. The test profile shortens ONLY the GraphQL
# instances' refresh windows here (the production permit counts stay on
# the wire, but a window closes every second — no honest test class can
# exhaust 10+ permits per second). Scoped to the GraphQL instances BY
# DESIGN: the deliberate RL-001/429 contract tests ride the REST-side
# instances (bookingCreate, reviewCreate, leadCreate, conversationCreate,
# postCreate/postComment) or re-register their own tiny instances
# (NeighborhoodPostRateLimit/EventRateLimitIntegrationTest's
# registry.remove + TINY pattern) — their 60-second windows and pinned
# tiny limits stay untouched, so those contracts keep measuring the real
# refusal behavior. The three GraphQL instances the campaign fetchers
# declare WITHOUT a base-profile entry (graphqlAccountMutation,
# graphqlCmsMutation, graphqlCmsQuery) get their test window here too —
# they otherwise ride the shared default's full 60 seconds.
resilience4j:
  ratelimiter:
    instances:
      graphqlAccountMutation:
        limit-refresh-period: 1s
      graphqlAttributeMutation:
        limit-refresh-period: 1s
      graphqlAttributeValueMutation:
        limit-refresh-period: 1s
      graphqlCatalogAttributeQuery:
        limit-refresh-period: 1s
      graphqlCatalogRead:
        limit-refresh-period: 1s
      graphqlCategoryMutation:
        limit-refresh-period: 1s
      graphqlCategoryQuery:
        limit-refresh-period: 1s
      graphqlCmsMutation:
        limit-refresh-period: 1s
      graphqlCmsQuery:
        limit-refresh-period: 1s
      graphqlCollectionMutation:
        limit-refresh-period: 1s
      graphqlCollectionQuery:
        limit-refresh-period: 1s
      graphqlCreateService:
        limit-refresh-period: 1s
      graphqlCustomerQuery:
        limit-refresh-period: 1s
      graphqlDiscoveryQuery:
        limit-refresh-period: 1s
      graphqlNeighborhoodFeedQuery:
        limit-refresh-period: 1s
      graphqlOrderQuery:
        limit-refresh-period: 1s
      graphqlPermissionGroupQuery:
        limit-refresh-period: 1s
      graphqlPostCommentsQuery:
        limit-refresh-period: 1s
      graphqlPostQuery:
        limit-refresh-period: 1s
      graphqlProductMediaMutation:
        limit-refresh-period: 1s
      graphqlProductQuery:
        limit-refresh-period: 1s
      graphqlProductTypeMutation:
        limit-refresh-period: 1s
      graphqlProductVariantMutation:
        limit-refresh-period: 1s
      graphqlProductVariantQuery:
        limit-refresh-period: 1s
      graphqlPromotionQuery:
        limit-refresh-period: 1s
      graphqlServiceQuery:
        limit-refresh-period: 1s
      graphqlStoreProductMutation:
        limit-refresh-period: 1s
      graphqlStoreProductQuery:
        limit-refresh-period: 1s
      graphqlTokenMutation:
        limit-refresh-period: 1s
      graphqlUserQuery:
        limit-refresh-period: 1s
      graphqlVoucherMutation:
        limit-refresh-period: 1s
      graphqlVoucherQuery:
        limit-refresh-period: 1s

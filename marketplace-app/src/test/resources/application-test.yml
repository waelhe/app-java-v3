spring:
  main:
    # TODO [DEBT]: allow-bean-definition-overriding is needed because multiple
    # test configs (ModuleTestConfig, JpaConfig, @EnableConfigurationProperties)
    # register beans with the same name. Each conflict should be resolved in a
    # separate focused PR by renaming beans or removing duplicate @Enable* annotations.
    # Tracked conflicts:
    #   - jpaAuditingHandler (ModuleTestConfig @EnableJpaAuditing vs JpaConfig)
    #   - marketplaceProperties (ModuleTestConfig @Bean vs @EnableConfigurationProperties)
    #   - beans in Provider/Payments/Messaging module tests (TBD)
    # See: https://docs.spring.io/spring-boot/reference/features/external-config.html
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
  cache:
    type: simple
  quartz:
    job-store-type: memory
    auto-startup: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    test-connection: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: test
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          google:
            authorization-uri: http://localhost/oauth2/authorize
            token-uri: http://localhost/oauth2/token
            user-info-uri: http://localhost/oauth2/userinfo
            user-name-attribute: sub
            jwk-set-uri: http://localhost/oauth2/jwks

app:
  commission:
    rate: 0.10

marketplace:
  cors:
    allowed-origins: http://localhost:3000
  security:
    auth-server:
      issuer: http://localhost:8080
    jwt:
      audience: marketplace-api
  payments:
    webhook:
      shared-secret: test-sig

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false

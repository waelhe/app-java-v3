spring:
  # AI foundation: the test profile never binds a provider (no network in
  # tests) — spring.ai.model.chat=none disables every chat
  # auto-configuration, so the context boots with the capability OFF and
  # AiChatGateway reports unavailable.
  ai:
    model:
      chat: none
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
    hikari:
      # CI connection budget (measured on main 2026-09-05, 14c9aaf Integration
      # run): the workflow's shared PostgreSQL service container defaults to
      # max_connections=100, while the module-test slice contexts (one per
      # @ApplicationModuleTest class) accumulate in the TestContext cache and
      # each holds a default 20/5 Hikari pool against that same instance — the
      # run crossed the limit and a NEIGHBORING class failed to boot with
      # FATAL "sorry, too many clients already" (marginal: the same code was
      # green 30 minutes earlier). No test needs 20 connections; 10/1 keeps
      # every cached context light so the shared budget holds with margin.
      # Production pools are untouched (application.yml).
      maximum-pool-size: 10
      minimum-idle: 1
  cache:
    type: simple
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    test-connection: false
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080

app:
  commission:
    rate: 0.10

marketplace:
  cors:
    allowed-origins: http://localhost:3000
  # L33: the test policy — a short window keeps the expiry tests fast; the
  # unset-policy case is covered by property-override tests (409).
  catalog:
    expiry:
      expiry-days: 90
      renewal-cooldown-days: 1
    # L40 (realestate systems plan §5): the view visitor-fingerprint HMAC
    # key for the test profile — same discipline as the L34 leads key
    # below (explicit test-only value; prod fails startup on a blank key
    # via CatalogConfig instead). The dedup window stays at the 24h
    # default here; the TTL-expiry acceptance criterion overrides it to
    # milliseconds on the test that needs it.
    views:
      ip-hash-key: test-profile-fingerprint-key
  security:
    jwt:
      audience: marketplace-api
  payments:
    webhook:
      shared-secret: test-sig
  # L34 (realestate systems plan §5): the sender fingerprint HMAC key for
  # the test profile — SecretKeySpec rejects an empty key, so every test
  # context carries this explicit (test-only) value. Prod fails startup
  # on a blank key instead (MessagingConfig — the JwkSourceProdHardening
  # pattern); this value never leaves the test classpath.
  messaging:
    leads:
      ip-hash-key: test-profile-fingerprint-key

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false

# Plan item 4.3 (comprehensive-reverification-repair-plan-2026-09-26, PR #400):
# parallel test execution — the JUnit 6 official pattern "to execute top-level
# classes in parallel but methods in same thread", quoted verbatim from the
# JUnit User Guide (6.0.3 — the version Boot 4.1.1 manages; archived at
# scripts/doc-verify/junit6-parallel-execution.html):
#
#   junit.jupiter.execution.parallel.enabled = true
#   junit.jupiter.execution.parallel.mode.default = same_thread
#   junit.jupiter.execution.parallel.mode.classes.default = concurrent
#
# Why exactly this combination (each decision official-doc-backed):
# - enabled=true alone changes NOTHING ("If enabled, test classes and methods
#   will still be executed sequentially by default" — the guide's own warning
#   that the flag is only the first step; the execution MODE decides).
# - mode.classes.default=concurrent: different top-level test classes run on
#   different worker threads. This is the granularity the #382 isolation was
#   built for — every integration test OWNS its PostgreSQL, so no two classes
#   share a database; Spring's TestContext framework supports concurrent
#   access to the shared context cache.
# - mode.default=same_thread: methods within one class stay on the class's
#   single thread — every method-scoped thread-local contract in the suite
#   (@WithMockUser's SecurityContext, Mockito's inline static mocks,
#   MockMvc request-scoped expectations) keeps its existing semantics.
# - config.strategy=dynamic (the platform default, factor 1): parallelism =
#   available cores — no hardcoded thread counts to drift from the runner.
#
# Scope note (measured locally, JDK 25.0.4): the full app-module surefire
# suite (529 tests) runs green under this configuration with the wall clock
# measured in the PR body; the failsafe integration tests inherit the same
# file — their per-class isolation is the #382 design, and the CI run of this
# PR is the Docker-gated measurement the local sandbox cannot produce.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic

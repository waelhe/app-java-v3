# ISO-639 default (English) message bundle for the REST problem-detail
# layer (roadmap B4 / gap G-PROD-4 — Spring MessageSource, the framework's
# own i18n channel). Keys are per error-code (ApiErrorTaxonomy):
#   error.<CODE>.title  -> ProblemDetail title
#   error.<CODE>.detail -> the handler's fixed detail sentence
#   error.<CODE>.user   -> userMessage property (human-facing text)
# English literals are byte-identical to the pre-B4 hardcoded strings —
# the default locale is pinned to English (spring.web.locale), so existing
# clients see exactly the previous responses.

error.VAL-001.title=Bad Request
error.VAL-001.detail=Validation failed
error.VAL-001.constraint-violation-detail=Constraint violation
error.VAL-001.user=The request is not valid. Please check the submitted fields.
error.AUTHZ-001.title=Forbidden
error.AUTHZ-001.detail=Access denied
error.AUTHZ-001.user=You are not allowed to perform this action.
error.AUTHN-001.title=Unauthorized
error.AUTHN-001.detail=Authentication required
error.AUTHN-001.user=Please sign in to continue.
error.NF-001.title=Not Found
error.NF-001.detail=Resource not found
error.NF-001.user=The requested resource does not exist.
error.CONFLICT-001.title=Conflict
error.CONFLICT-001.detail=Resource was modified by another transaction. Please retry.
error.CONFLICT-001.user=The resource changed while you were working on it. Please try again.
error.RL-001.title=Too Many Requests
error.RL-001.detail=Rate limit exceeded. Please try again later.
error.RL-001.user=Too many requests. Please wait a moment and try again.
error.SU-001.title=Service Unavailable
error.SU-001.detail=Service temporarily unavailable. Please try again later.
error.SU-001.user=The service is temporarily unavailable. Please try again later.
error.INT-001.title=Internal Server Error
error.INT-001.detail=An unexpected error occurred
error.INT-001.user=Something went wrong on our side. Please try again later.

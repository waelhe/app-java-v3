# Railway build config — DOCKERFILE builder (deployment fix, 2026-09-04).
#
# Why not NIXPACKS (evidence-based):
#   The official Nixpacks Java provider docs (docs/pages/docs/providers/java.md,
#   repo railwayapp/nixpacks, copy saved at scripts/prod-design-docs/nixpacks-java-provider.md)
#   list the available JDKs as 8/11/17 (default)/19/20/21 — JDK 25 is NOT available
#   (overridable only via NIXPACKS_JDK_VERSION among those versions). This project
#   compiles with java.version=25 (pom.xml) + --release 25 + enforcer requires [21,),
#   so a Nixpacks build fails at the compile phase: "release version 25 not supported".
#   The two failed Railway deployments of c52cef8 ("optimistic-rebirth",
#   "dependable-vision" commit statuses: "Deployment failed") match this.
#
# Why the Dockerfile is the correct official path (strategy plan §6, closed):
#   - eclipse-temurin:25-jdk-alpine build stage / 25-jre-alpine runtime (official
#     Adoptium images) — exact JDK the project requires.
#   - Layered image via jarmode=tools per Spring Boot 4.1 reference
#     (packaging/container-images/dockerfiles.html) — the documented official recipe.
#   - ENTRYPOINT already maps Railway's injected $PORT to SERVER_PORT.
#   - Non-root user + Generational ZGC + container-aware heap (production JVM opts).
#
# The custom Nixpacks build command is removed: with builder = "DOCKERFILE" the
# image's own build stage runs `./mvnw clean package -DskipTests -B -pl marketplace-app -am`
# (identical command, inside temurin 25).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/actuator/health/liveness"
healthcheckTimeout = 300

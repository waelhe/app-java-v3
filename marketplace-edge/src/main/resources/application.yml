server:
  port: ${PORT:8081}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      # Spring Cloud Gateway Server MVC reference, TokenRelay filter.
      server:
        webmvc:
          routes:
            - id: backend-api
              # The exact env-style name resolves from BOTH the real environment
              # and the tests' DynamicPropertySource; the typed
              # EdgeBackendProperties record binds the same value through
              # relaxed binding (EDGE_BACKEND_URL -> edge.backend.url) and
              # enforces the transport gate at boot.
              uri: ${EDGE_BACKEND_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
              filters:
                - TokenRelay=
  # Datasource (the JdbcOAuth2AuthorizedClientService store) — the app's own
  # placeholder pattern (marketplace-app application.yml): the prod profile
  # requires SPRING_DATASOURCE_* fail-fast (application-prod.yml); this
  # localhost default keeps the Dockerfile AOT-trainer boot green — the
  # trainer stage runs with NO environment, and the JDBC classpath (added
  # with the authorized-client store in #518) otherwise fails the lazy
  # context refresh with "Failed to configure a DataSource: 'url' attribute
  # is not specified" (measured live on the first v4 edge build,
  # deployment 4108b12f, 2026-10-09).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edge}
    username: ${SPRING_DATASOURCE_USERNAME:edge}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          edge:
            client-id: ${EDGE_CLIENT_ID:edge-local}
            client-secret: ${EDGE_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/edge"
            scope: openid,profile
            client-authentication-method: client_secret_basic
        provider:
          edge:
            issuer-uri: ${AUTH_SERVER_ISSUER:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

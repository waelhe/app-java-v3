server:
  port: ${PORT:8081}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      # Spring Cloud Gateway Server MVC reference, TokenRelay filter.
      server:
        webmvc:
          routes:
            - id: backend-api
              # The exact env-style name resolves from BOTH the real environment
              # and the tests' DynamicPropertySource; the typed
              # EdgeBackendProperties record binds the same value through
              # relaxed binding (EDGE_BACKEND_URL -> edge.backend.url) and
              # enforces the transport gate at boot.
              uri: ${EDGE_BACKEND_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
              filters:
                - TokenRelay=
  # Datasource (authorized clients) and Redis credentials bind from the standard
  # Spring Boot properties/environment variables (SPRING_DATASOURCE_*, SPRING_DATA_REDIS_*).
  security:
    oauth2:
      client:
        registration:
          edge:
            client-id: ${EDGE_CLIENT_ID:edge-local}
            client-secret: ${EDGE_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/edge"
            scope: openid,profile
            client-authentication-method: client_secret_basic
        provider:
          edge:
            issuer-uri: ${AUTH_SERVER_ISSUER:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# The community domain's stored vocabulary (ContentModeratedEvent /
# ContentReportResolvedEvent targetType) — the English floor is
# byte-identical to the pre-B-11 targetType.toLowerCase() rendering
# (B-17 restores the REVIEW entry the B-11 bundle missed, closing that
# measured drift); unknown names ride through raw.
targettype.POST=post
targettype.COMMENT=comment
targettype.REVIEW=review

# B-17 (compliance plan C.9): the community domain's stored report
# OUTCOME vocabulary (ContentReportResolvedEvent outcome —
# RESOLVED/DISMISSED) — the English floor is the stored name's lowercase
# form (the targettype discipline); unknown outcomes ride through raw.
reportoutcome.RESOLVED=resolved
reportoutcome.DISMISSED=dismissed

# The payments domain's state vocabulary (the PaymentStateChangedEvent
# state — INITIATED/COMPLETED/FAILED literals plus the
# PaymentIntentStatus names) — unknown states ride through raw.
payment.state.INITIATED=INITIATED
payment.state.PENDING=PENDING
payment.state.PROCESSING=PROCESSING
payment.state.COMPLETED=COMPLETED
payment.state.SUCCEEDED=SUCCEEDED
payment.state.FAILED=FAILED
payment.state.REFUNDED=REFUNDED
payment.state.PARTIALLY_REFUNDED=PARTIALLY_REFUNDED

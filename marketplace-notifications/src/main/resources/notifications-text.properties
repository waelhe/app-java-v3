# B-11 (compliance plan B.6 — i18n for notifications and emails): the
# DEFAULT (English) bundle for the notifications module's own text channel.
# The module-local ResourceBundleMessageSource (NotificationTextSource) is
# deliberately NOT the app-level auto-configured MessageSource: the app
# bundle lives in marketplace-app resources (off this module's classpath)
# and its basename is registered in application.yml — Track A's hot garden.
#
# English literals are byte-identical to the pre-B-11 hardcoded strings —
# resolution at any non-Arabic locale returns exactly the previous behavior
# (the GlobalExceptionHandlerI18nTest floor discipline).
# Arabic renders via notifications-text_ar.properties (the platform's
# user-facing standard — composition rides PLATFORM_LOCALE).


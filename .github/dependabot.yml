# Dependabot — Spring BOM governors plus the pinned CycloneDX SBOM build tool.
#
# Runtime version governance stays with the Spring Boot parent BOM and the
# Spring Modulith BOM (the two approved runtime BOM governors). CycloneDX is
# separately allowlisted because CI now publishes its aggregate SBOM; its
# updates receive a distinct PR group and still require the normal CI/review.
# Other manually audited runtime overrides remain excluded: automatic bumps
# can violate the project's dependencyConvergence/requireUpperBoundDeps gates.
version: 2
updates:
  # Maven: the two BOM governors, batched into one PR per cadence.
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "org.springframework.boot*"
      - dependency-name: "org.springframework.modulith*"
      - dependency-name: "org.cyclonedx:cyclonedx-maven-plugin"
    groups:
      spring-bom-governors:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework.modulith*"
      cyclonedx-sbom-tooling:
        patterns:
          - "org.cyclonedx:cyclonedx-maven-plugin"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions versions (checkout@v7, setup-java@v6, gitleaks-action@v3,
  # upload-artifact@v7, codeql-action@v3) — not part of the Maven dependency
  # tree; keeping them current is safe and automated.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

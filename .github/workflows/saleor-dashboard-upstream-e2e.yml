name: Saleor Dashboard 3.23.39 upstream E2E

on:
  push:
    branches:
      - feat/catalog-typed-product-types
    paths:
      - ".github/workflows/saleor-dashboard-upstream-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saleor-dashboard-upstream-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upstream-dashboard-e2e:
    name: Pinned Dashboard vs disposable Saleor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the immutable Dashboard 3.23.39 release commit
        uses: actions/checkout@v4
        with:
          repository: saleor/saleor-dashboard
          ref: bc75e988da0fa4fbc3d47378a888d859d070746f
          path: saleor-dashboard
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up the pinned pnpm version
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - name: Configure the pnpm store
        working-directory: saleor-dashboard
        env:
          PNPM_STORE_PATH: ${{ runner.temp }}/pnpm-store
        run: pnpm config set store-dir "$PNPM_STORE_PATH"

      - name: Cache the locked pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ runner.os }}-pnpm-3.23.39-${{ hashFiles('saleor-dashboard/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-3.23.39-

      - name: Install the locked Dashboard dependencies
        working-directory: saleor-dashboard
        run: pnpm install --frozen-lockfile

      - name: Install the Chromium browser and system dependencies
        working-directory: saleor-dashboard
        run: pnpm exec playwright install --with-deps chromium

      - name: Record the pinned Dashboard and disposable Saleor target
        working-directory: saleor-dashboard
        run: |
          node -p "'Dashboard=' + require('./package.json').version"
          git rev-parse HEAD
          docker pull ghcr.io/saleor/saleor:3.23
          docker image inspect --format='SaleorImageId={{.Id}}' ghcr.io/saleor/saleor:3.23
          docker image inspect --format='SaleorRepoDigest={{index .RepoDigests 0}}' ghcr.io/saleor/saleor:3.23

      - name: Run Saleor Dashboard's original stable-target Playwright E2E suite
        working-directory: saleor-dashboard
        env:
          CI: "true"
          E2E_WORKERS: "2"
        run: pnpm e2e

      - name: Capture disposable stack logs on failure
        if: failure()
        working-directory: saleor-dashboard
        run: |
          SALEOR_IMAGE=ghcr.io/saleor/saleor:3.23 \
          SALEOR_API_PORT=8200 \
          DASHBOARD_PORT=9200 \
          DASHBOARD_BUILD_DIR="$GITHUB_WORKSPACE/saleor-dashboard/build-e2e-stable/dashboard" \
          DASHBOARD_NGINX_CONF="$GITHUB_WORKSPACE/saleor-dashboard/nginx/default.conf" \
          docker compose --project-name dashboard-e2e-stable -f e2e/compose.yml logs --no-color > "$GITHUB_WORKSPACE/saleor-dashboard-e2e-docker.log" || true

      - name: Upload Playwright reports and stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saleor-dashboard-3.23.39-upstream-e2e
          if-no-files-found: warn
          retention-days: 7
          path: |
            saleor-dashboard/playwright-report/
            saleor-dashboard/test-results/
            saleor-dashboard-e2e-docker.log

      - name: Tear down the disposable Saleor stack
        if: always()
        working-directory: saleor-dashboard
        run: pnpm e2e:down

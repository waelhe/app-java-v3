name: Defect Knowledge Receipt Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: defect-knowledge-receipt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate candidate receipt from trusted base code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch PR candidate as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"

      - name: Validate receipt without executing candidate code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse "refs/remotes/origin/pr-${PR_NUMBER}")" = "$PR_HEAD_SHA"
          python3 .ci/check_defect_knowledge.py validate \
            --pr-number "$PR_NUMBER" \
            --created-at "$PR_CREATED_AT" \
            --base-sha "$PR_BASE_SHA" \
            --head-sha "$PR_HEAD_SHA"

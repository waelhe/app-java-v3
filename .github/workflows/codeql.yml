# CodeQL static security analysis — Java (JDK 25).
#
# JDK 25 support evidence (official): CodeQL CLI 2.23.1 release notes
# (2025-09-23) — "The Java extractor and QL libraries now support Java 25",
# including Java 25 compact source files (JEP 512); announced at
# github.blog/changelog/2025-09-26. The action resolves a current CLI
# (2.26.x line as of 2026-09), comfortably beyond 2.23.1.
#
# build-mode: manual — we run the Maven build ourselves between init and
# analyze ("building the source code using a manually specified build
# command" per codeql-action v3.37.9 action.yml). This compiles the full
# 16-module reactor INCLUDING MapStruct-generated mapper sources, which
# buildless extraction (build-mode: none) would miss. Guard-pinned by
# PlatformGovernanceFilesTest.
name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    # Parallel plan §4.1: the four gates run on pull_request for the wave's
    # integrative PRs. The official GitHub docs are explicit that the
    # pull_request branches filter matches the PR's BASE branch ("only run on
    # pull requests that target specific branches" — Events that trigger
    # workflows), so each part's stacked base was listed here to gate its
    # pushes during the flow. Both stacked waves have since merged — #510
    # the foundation, #517 track-b part 1 — so both entries retired with
    # their waves (the inertness the comment itself documents). Additive
    # only: PRs targeting main and push events are unaffected; the
    # remaining open PRs target main directly and gate through the
    # pull_request event.
    # The #540 review split's stacked base rode the same §4.1 mechanism
    # (#541 slice 1 -> main, #540 slice 2 -> discovery/wave-part1 — the
    # CodeRabbit free-plan 100-file review limit's documented remedy). Both
    # slices have since merged, so the entry retired with its wave (the
    # same inertness the precedent documents above).
    # The #544/#545/#543 stacked wave rode the same §4.1 mechanism:
    # the stacked bases were listed while the wave was in flight and
    # retired with it in the post-merge truth-sync (the documented
    # #540/#541 precedent's own inertness rule). #545 merged (2026-10-12)
    # and #543 re-targeted main directly, so the phase-7 entry retired
    # with its wave here: no open PR carries that branch as its base any
    # longer, and PRs targeting main gate through the pull_request event
    # exactly as before (the filter entry is inert weight otherwise —
    # the same inertness the precedents above document).
    branches: [ main ]
  schedule:
    - cron: '27 5 * * 1'


# One test round per ref: a newer push supersedes the older round and
# cancels it in place (GitHub's documented concurrency discipline — the
# 2026-10-11 measured flood: an iterating sibling branch's pushes parked
# ~75 superseded runs in the queue while the account's 20-runner ceiling
# starved every live gate). The merge ruleset reads the LATEST head's
# check-runs, so only superseded rounds are ever cancelled — never the
# round a gate is waiting on.
concurrency:
  # CodeRabbit's final round on the #544 slice: the event TYPE rides the
  # group key — a workflow_dispatch run and a push run on the same ref are
  # DIFFERENT gates (the deploy gate reads push results; a manual dispatch
  # must never cancel an in-flight push check, and a scheduled sweep must
  # never cancel either). Cancellation stays exactly where it belongs:
  # between older and newer runs of the SAME event type on the same ref.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analyze (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual

      # Extraction happens during this build. Tests are skipped: this job
      # needs compilation (all 16 modules + generated sources), not test
      # execution — main-branch commits already ran the full suite in the
      # required CI checks. No services needed: the app does not boot here.
      - name: Build for extraction (compile only)
        run: ./mvnw --batch-mode -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

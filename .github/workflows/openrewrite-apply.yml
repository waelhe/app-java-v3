      - name: Verify patch content and exact planned paths before publication
        shell: bash
        run: |
          set -Eeuo pipefail
          publication_dir="target/openrewrite/publication"
          plan="${publication_dir}/batches.json"
          # The approved baseline recipe only removes unused import statements. The write-enabled
          # job revalidates the artifact independently and will refuse arbitrary Java edits.
          python3 scripts/openrewrite/validate-patches.py "${publication_dir}"
          git switch --detach "${TARGET_SHA}"
          for idx in $(seq 1 "${BATCH_COUNT}"); do
            patch_file="${publication_dir}/patches/batch-${idx}.patch"
            paths_file="${RUNNER_TEMP}/openrewrite-validated-batch-${idx}.paths"
            jq -r ".[${idx}-1].paths[]" "${plan}" | sort > "${paths_file}"
            git reset --hard "${TARGET_SHA}"
            git apply --check "${patch_file}"
            git apply "${patch_file}"
            mapfile -t actual_paths < <(git diff --name-only "${TARGET_SHA}" | sort)
            diff -u "${paths_file}" <(printf '%s\n' "${actual_paths[@]}")
          done
          # Validate the full patch used by changed-modules mode against the exact planned path set.
          git reset --hard "${TARGET_SHA}"
          mapfile -t expected_all < <(jq -r '.[].paths[]' "${plan}" | sort -u)
          git apply --check "${publication_dir}/automatic-rewrite.patch"
          git apply "${publication_dir}/automatic-rewrite.patch"
          mapfile -t actual_all < <(git diff --name-only "${TARGET_SHA}" | sort)
          diff -u <(printf '%s\n' "${expected_all[@]}") <(printf '%s\n' "${actual_all[@]}")
          git reset --hard "${TARGET_SHA}"

      - name: Publish generated transformations without running Maven
        shell: bash
        run: |
          set -Eeuo pipefail
          pub="target/openrewrite/publication"; plan="${pub}/batches.json"
          git switch --detach "${TARGET_SHA}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${WRITE_MODE}" == "direct-branch-update" ]]; then
            git apply "${pub}/automatic-rewrite.patch"
            mapfile -t changed_paths < <(git diff --name-only "${TARGET_SHA}" | sort)
            (( ${#changed_paths[@]} > 0 )) || { echo "::error::Patch contains no changes."; exit 1; }
            for path in "${changed_paths[@]}"; do [[ "${path}" == *.java ]] || { echo "::error::Unexpected non-Java diff: ${path}"; exit 1; }; done
            git add -- "${changed_paths[@]}"; git diff --cached --check
            git commit -m "chore(openrewrite): apply approved recipes to changed modules"; git push origin "HEAD:${TARGET_REF}"
            CHECK_SHA="$(git rev-parse HEAD)"
            PR_NUMBER="$(gh pr list --state open --json number,headRefName | jq -r --arg head "${TARGET_REF}" '.[] | select(.headRefName == $head) | .number' | head -n 1)"
            echo "BATCH_COUNT=1" >> "$GITHUB_ENV"; echo "CHECK_REF_1=${TARGET_REF}" >> "$GITHUB_ENV"; echo "CHECK_SHA_1=${CHECK_SHA}" >> "$GITHUB_ENV"; echo "PR_NUMBER_1=${PR_NUMBER}" >> "$GITHUB_ENV"
          else
            for idx in $(seq 1 "${BATCH_COUNT}"); do
              paths_file="${RUNNER_TEMP}/openrewrite-batch-${idx}.paths"; patch_file="${pub}/patches/batch-${idx}.patch"
              jq -r ".[${idx}-1].paths[]" "${plan}" > "${paths_file}"; mapfile -t batch_paths < "${paths_file}"
              module_names="$(jq -r ".[${idx}-1].modules | join(\",\")" "${plan}")"; batch_reason="$(jq -r ".[${idx}-1].reason // empty" "${plan}")"
              git switch --detach "${TARGET_SHA}"; batch_branch="automation/openrewrite-${OPENREWRITE_SCOPE}-${TARGET_SHA:0:12}-batch-${idx}"; git switch -C "${batch_branch}"
              git apply "${patch_file}"; git add -- "${batch_paths[@]}"; git diff --cached --check
              mapfile -t staged_paths < <(git diff --cached --name-only | sort); mapfile -t expected_paths < <(printf '%s\n' "${batch_paths[@]}" | sort)
              diff -u <(printf '%s\n' "${expected_paths[@]}") <(printf '%s\n' "${staged_paths[@]}")
              git commit -m "chore(openrewrite): ${OPENREWRITE_SCOPE} batch ${idx}/${BATCH_COUNT}"
              remote_sha="$(git ls-remote origin "refs/heads/${batch_branch}" | awk '{print $1}')"; git push --force-with-lease="refs/heads/${batch_branch}:${remote_sha}" origin "HEAD:${batch_branch}"
              CHECK_SHA="$(git rev-parse HEAD)"; PR_NUMBER="$(gh pr list --state open --base "${TARGET_REF}" --json number,headRefName | jq -r --arg head "${batch_branch}" '.[] | select(.headRefName == $head) | .number' | head -n 1)"
              PR_TITLE="chore(openrewrite): ${OPENREWRITE_SCOPE} batch ${idx}/${BATCH_COUNT}"
              PR_BODY="OpenRewrite-generated Java changes. Scope=${OPENREWRITE_SCOPE}; batch ${idx}/${BATCH_COUNT}; files=${#batch_paths[@]}/95; Maven modules=${module_names}. All changed files are visible; none are excluded."
              if [[ -n "${batch_reason}" ]]; then PR_BODY+=$'\n\nPartition rationale: '"${batch_reason}"; fi
              if [[ -z "${PR_NUMBER}" ]]; then gh pr create --base "${TARGET_REF}" --head "${batch_branch}" --title "${PR_TITLE}" --body "${PR_BODY}"; PR_NUMBER="$(gh pr list --state open --base "${TARGET_REF}" --json number,headRefName | jq -r --arg head "${batch_branch}" '.[] | select(.headRefName == $head) | .number' | head -n 1)"; else gh pr edit "${PR_NUMBER}" --title "${PR_TITLE}" --body "${PR_BODY}"; fi
              [[ -n "${PR_NUMBER}" ]] || { echo "::error::Could not identify generated PR for ${batch_branch}."; exit 1; }
              echo "CHECK_REF_${idx}=${batch_branch}" >> "$GITHUB_ENV"; echo "CHECK_SHA_${idx}=${CHECK_SHA}" >> "$GITHUB_ENV"; echo "PR_NUMBER_${idx}=${PR_NUMBER}" >> "$GITHUB_ENV"
              echo "Published batch ${idx}/${BATCH_COUNT}: PR #${PR_NUMBER}, files=${#batch_paths[@]}, sha=${CHECK_SHA}"
            done
          fi

      - name: Dispatch validation workflows for each generated batch
        if: needs.apply.outputs.apply_required == 'true' && needs.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          workflows=(ci.yml integration-test.yml container-scan.yml codeql.yml openrewrite-catalog.yml)
          for idx in $(seq 1 "${BATCH_COUNT}"); do
            ref_var="CHECK_REF_${idx}"; sha_var="CHECK_SHA_${idx}"; check_ref="${!ref_var}"; check_sha="${!sha_var}"
            for workflow in "${workflows[@]}"; do echo "Dispatching ${workflow} for batch ${idx}/${BATCH_COUNT} (${check_sha})"; gh workflow run ".github/workflows/${workflow}" --ref "${check_ref}"; done
          done

      - name: Wait for validation workflows on every generated batch
        if: needs.apply.outputs.apply_required == 'true' && needs.apply.outputs.changed == 'true'
        shell: bash
        timeout-minutes: 65
        run: |
          set -Eeuo pipefail
          expected=(".github/workflows/ci.yml" ".github/workflows/integration-test.yml" ".github/workflows/container-scan.yml" ".github/workflows/codeql.yml" ".github/workflows/openrewrite-catalog.yml")
          for attempt in $(seq 1 180); do
            pending=0; failed=0
            for idx in $(seq 1 "${BATCH_COUNT}"); do
              sha_var="CHECK_SHA_${idx}"; check_sha="${!sha_var}"
              response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${check_sha}&per_page=100")"
              for workflow_path in "${expected[@]}"; do
                state="$(jq -r --arg sha "${check_sha}" --arg path "${workflow_path}" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch" and .path == $path)] | sort_by(.created_at) | last | if . == null then "missing" elif .status != "completed" then "pending" elif .conclusion == "success" then "success" else "failure:" + (.conclusion // "unknown") end' <<< "${response}")"
                printf 'Batch %s %s: %s\n' "${idx}" "${workflow_path}" "${state}"
                case "${state}" in success) ;; pending|missing) pending=1 ;; failure:*) failed=1 ;; esac
              done
            done
            if (( failed == 1 )); then echo "::error::At least one validation workflow failed for a generated batch."; exit 1; fi
            if (( pending == 0 )); then echo "All five validation workflows succeeded for every generated batch."; exit 0; fi
            sleep 20
          done
          echo "::error::Timed out waiting for validation workflows on generated batches."; exit 1


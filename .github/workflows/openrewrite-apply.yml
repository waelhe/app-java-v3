          patterns={"TARGET_SHA":r"[0-9a-f]{40}","OPENREWRITE_SCOPE":r"[a-z0-9-]+","WRITE_MODE":r"(direct-branch-update|pull-request)","BATCH_COUNT":r"[0-9]+"}
          values={"TARGET_REF":meta["target_ref"],"TARGET_SHA":meta["target_sha"],"OPENREWRITE_SCOPE":meta["scope"],"WRITE_MODE":meta["write_mode"],"BATCH_COUNT":str(len(batches))}

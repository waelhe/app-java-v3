          # The expected equality above already pins the four context values; the
          # checks below make the no-line-break property explicit for anything
          # that reaches the file. The unused expected_remote_sha transfer is
          # REMOVED (nothing downstream consumed it — its only role was carrying
          # an unvalidated artifact string into the privileged environment).
          # CodeRabbit CHANGES_REQUESTED 2026-10-26 (CWE-20/74): TARGET_REF is a

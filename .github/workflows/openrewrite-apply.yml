              # the sequential value admits an entry — the same canonical rule
              # the import-only validator enforces on its own read.
              number=b.get("number") if isinstance(b,dict) else None
              if isinstance(number,bool) or type(number) is not int or number!=n or not b.get("paths"): raise SystemExit("Malformed batch plan.")
              if meta["write_mode"]=="pull-request" and len(b["paths"])>int(meta["max_files_per_pr"]): raise SystemExit(f"Batch {n} exceeds review cap.")
              for path in b["paths"]:
                  if not path.endswith(".java") or path.startswith("/") or ".." in Path(path).parts: raise SystemExit(f"Unsafe publication path: {path}")

name: CodeRabbit Gate

# The hard merge gate for CodeRabbit on this repository (<10 stars: CodeRabbit
# never auto-reviews; its commit status reports "success | Review skipped:
# manual review required" — a silent pass that let PR #712 (+77,739/-317,
# 409 files) merge with ZERO CodeRabbit reviews on 2026-10-23).
#
# Trusted-definition policy (CodeRabbit review on PR #713, adopted findings):
# - pull_request_target: the gate definition ALWAYS comes from main's copy,
#   never from the pull request's own version (a PR author must not be able
#   to weaken this gate from inside their PR).
# - pull_request_review is deliberately ABSENT: empirically proven (run
#   40033600763) that it executes the pull request's copy of this file.
# - Re-evaluation after a review completes (head unchanged): re-run the
#   gate RUN itself (Actions → Re-run). The re-run replays the original
#   pull_request_target event context (original GITHUB_SHA/GITHUB_REF),
#   while the script reads the PR's CURRENT head and its reviews at
#   execution time for the VERDICT — but the emitted check-run binds to
#   the run's ORIGINAL event head, not the moved head (measured 2026-10-27
#   on #742: re-run attempt 2 at 08:13Z read the moved head 09dba78a and
#   its fresh APPROVED review, yet check-run landed on a90e8e68 — the
#   original event head; the #728 measurement held only because the head
#   was unchanged between the event and its re-run). A moved head closes
#   ONLY through a fresh synchronize: any new push fires a new gate run
#   whose head_sha IS the current head. workflow_dispatch stays available
#   for ad-hoc evaluation from main, but its verdict lands on main's head,
#   not the PR head (measured on #727/#726). workflow_dispatch stays available for ad-hoc
#   evaluation from main, but its verdict lands on main's head, not the
#   PR head (measured on #727/#726).
#
# Verdict model (human-authored PRs): the LATEST completed coderabbitai[bot]
# review whose commit_id equals the PR's current head decides; error/rate-
# limited review statuses fail first; CHANGES_REQUESTED and DISMISSED fail;
# APPROVED and COMMENTED pass. Review fetches are fully paginated.
#
# Bot-exemption path (official CodeRabbit seat model, per
# docs.coderabbit.ai/management/seat-assignment): accounts the Git provider
# identifies as bots (GitHub Apps, e.g. dependabot[bot]) NEVER get a paid
# review seat automatically and are never reviewed without one. This
# repository runs on the no-subscription open-source tier where no seats
# exist at all, so a CodeRabbit review can never land on a bot-authored PR
# (measured on #726: 11 manual activation attempts 2026-10-24/25, none
# produced a review; the bot's first response names the cause: "authored by
# a bot without an assigned CodeRabbit review seat"). For bot-authored PRs
# the gate therefore verifies instead that EVERY other check on the head is
# green — the full test matrix, Build & Test, Full Integration Test, CodeQL
# Analyze, Container Image Scan, Dependency Review (GitHub's official
# security gate for dependency changes — exactly what a dependabot PR
# changes), Trivy, Snyk and the OpenAPI/GraphQL contract gates — all of
# which stay merge-required by the branch ruleset for every PR. Bot identity
# comes from the Git provider (pull.user.type == "Bot" / login ending
# "[bot]"), the same identification CodeRabbit itself uses for seat
# assignment; a human author cannot obtain it. Human-authored PRs remain
# 100% gated by the CodeRabbit review requirement below — unchanged.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to gate-check"
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: read
  checks: read

concurrency:
  group: coderabbit-gate-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    name: CodeRabbit Gate
    runs-on: ubuntu-latest
    # 75-minute job ceiling (gap closure 2026-10-25): the bot-exemption path
    # polls up to 60 minutes so a fresh PR's full CI matrix (~25-30 min
    # measured) completes INSIDE one gate run — future Dependabot PRs go
    # green with zero manual re-runs. Public repository: Actions minutes are
    # free. The human path's decision deadline stays 720s — this only raises
    # the roof, not its logic.
    timeout-minutes: 75
    steps:
      - name: Gate - CodeRabbit review (human PRs) or all-checks-green (bot PRs)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.request

          repo = os.environ["REPO"]
          pr = int(os.environ["PR"])
          api = f"https://api.github.com/repos/{repo}"
          token = os.environ["GH_TOKEN"]

          def call(path):
              req = urllib.request.Request(api + path, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "coderabbit-gate",
              })
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def all_reviews(pr):
              # Full pagination — the REST default is 30 reviews per page
              # and the CodeRabbit review can sit on a later page.
              out, page = [], 1
              while True:
                  batch = call(f"/pulls/{pr}/reviews?per_page=100&page={page}")
                  out.extend(batch)
                  if len(batch) < 100:
                      return out
                  page += 1

          def all_check_runs(head):
              # Full pagination over the Checks API.
              out, page = [], 1
              while True:
                  batch = call(f"/commits/{head}/check-runs?per_page=100&page={page}")["check_runs"]
                  out.extend(batch)
                  if len(batch) < 100:
                      return out
                  page += 1

          def all_statuses(head):
              # Full pagination over the combined commit-status endpoint
              # (review note 4370030611): its `statuses` array is ONE page —
              # total_count tells how many entries exist, so a verdict must
              # never be issued from a partial status list.
              out, page = [], 1
              while True:
                  batch = call(f"/commits/{head}/status?per_page=100&page={page}")
                  page_statuses = batch.get("statuses", [])
                  out.extend(page_statuses)
                  if not page_statuses or len(out) >= batch.get("total_count", len(out)):
                      return out
                  page += 1

          pull = call(f"/pulls/{pr}")
          head = pull["head"]["sha"]
          base = pull["base"]["ref"]
          author = pull["user"]["login"]
          author_type = pull["user"].get("type", "")
          if base != "main":
              print(f"Gate scoped to PRs targeting main; this PR targets '{base}' — passing without enforcement.")
              sys.exit(0)

          print(f"CodeRabbit Gate: PR #{pr} head={head[:10]} base={base} author={author} (type={author_type})")

          # ---------- Bot-exemption path (official CodeRabbit seat model) ----------
          # docs.coderabbit.ai/management/seat-assignment: Git-provider-identified
          # bots never get a paid review seat and are never reviewed without one.
          # On this repository's no-subscription OSS tier no seats exist at all,
          # so the bot path is gated by every other check being green instead.
          if author_type == "Bot" or author.endswith("[bot]"):
              # The CI-defining checks must REGISTER before this path may pass
              # (review note 4370030613): this gate starts on pull_request_target
              # while CI starts on pull_request, so an early read can see an
              # empty check list. ci.yml and integration-test.yml run on
              # pull_request to main with no path filters, so both checks
              # register for every PR to main (Dependabot included). Waiting for
              # their COMPLETION stays the job of the pending conditions below.
              expected_checks = {
                  "Build & Test (JDK 25)",
                  "Full Integration Test (JDK 25)",
              }
              # 60-minute window (gap closure 2026-10-25): the CI matrix
              # takes ~25-30 min (measured on #727: 07:39→08:04), so the
              # previous 12-minute window would time out before CI finishes
              # and leave every future bot PR red until manually re-run.
              # Poll load: ~3 API calls per 60s cycle ≈ 180/hour, well under
              # the GITHUB_TOKEN limit of 1,000/hour per repository
              # (docs.github.com/en/rest/rate-limit).
              deadline = time.time() + 3600
              seen = set()
              while True:
                  checks = [c for c in all_check_runs(head)
                            if c["name"] != "CodeRabbit Gate"]
                  missing_expected = expected_checks - {c["name"] for c in checks}
                  pending = [c for c in checks if c["status"] != "completed"]
                  failed = [c for c in checks if c["status"] == "completed"
                            and c.get("conclusion") not in ("success", "skipped", "neutral")]
                  try:
                      # All pages of the combined status list (note 4370030611) —
                      # the first page alone can hide later entries; the verdict
                      # must consider every status ever posted on the head.
                      st_list = all_statuses(head)
                      # Exclude the CodeRabbit status context: on bot PRs it is the
                      # silent-pass artifact this gate exists to replace — it can
                      # report pending or a rate-limit failure while every real
                      # check is green, so it must not influence this verdict. Keep
                      # the LATEST status per remaining context (the API can return
                      # several entries per context); an empty list is success.
                      latest_by_ctx = {}
                      for s in st_list:
                          if s.get("context") == "CodeRabbit":
                              continue
                          prev = latest_by_ctx.get(s["context"])
                          if prev is None or (s.get("updated_at") or "") >= (prev.get("updated_at") or ""):
                              latest_by_ctx[s["context"]] = s
                      others = list(latest_by_ctx.values())
                      bad_statuses = [f'{s["context"]} ({s["state"]})'
                                      for s in others if s["state"] in ("failure", "error")]
                      pending_statuses = [s["context"] for s in others if s["state"] == "pending"]
                  except Exception as e:
                      others, bad_statuses, pending_statuses = [], [f"(status lookup failed: {e})"], []
                  if failed or bad_statuses:
                      for c in failed:
                          print(f"FAIL — bot-exemption path: check '{c['name']}' concluded '{c.get('conclusion')}'.")
                      for s in bad_statuses:
                          print(f"FAIL — bot-exemption path: commit status not green: {s}")
                      print("Bot-authored PRs are gated by every other check instead of a CodeRabbit review (official seat model: docs.coderabbit.ai/management/seat-assignment). Fix the failing checks, then re-run this gate run itself (Actions → Re-run).")
                      sys.exit(1)
                  if not pending and not pending_statuses and not missing_expected:
                      names = sorted({c["name"] for c in checks})
                      print(f"PASS — bot-exemption path: author {author} is a Git-provider bot "
                            f"(type={author_type}); CodeRabbit never reviews bot PRs without a seat "
                            f"(docs.coderabbit.ai/management/seat-assignment) and this repository has "
                            f"no paid seats. Verified instead: ALL {len(names)} other checks green on "
                            f"head {head[:10]} + every other commit status success (CodeRabbit's own "
                            f"status context excluded per the seat model). Human-authored PRs remain "
                            f"fully gated by a completed CodeRabbit review.")
                      sys.exit(0)
                  note = f"Bot-exemption path: waiting for the other checks on head {head[:10]} — {len(pending)} check-runs pending, {len(pending_statuses)} statuses pending, {len(missing_expected)} expected CI checks not yet registered"
                  if note not in seen:
                      print(note)
                      seen.add(note)
                  if time.time() > deadline:
                      print("FAIL — bot-exemption path: the other checks did not complete within the 60-minute window. Re-run this gate run itself (Actions → Re-run) once they finish — the re-run re-evaluates the PR's current head and issues a fresh check-run on this PR head (measured on #728).")
                      sys.exit(1)
                  time.sleep(60)

          # ---------- Human path: a completed CodeRabbit review decides (unchanged) ----------
          BAD_STATUS = re.compile(r"rate limit|error|fail", re.I)
          deadline = time.time() + 720  # poll up to 12 minutes; re-run the gate run afterwards if it expires
          last_note = ""
          while True:
              reviews = [r for r in all_reviews(pr)
                         if r["user"]["login"] == "coderabbitai[bot]"
                         and r.get("commit_id") == head
                         and r.get("state") != "PENDING"]
              latest = max(reviews, key=lambda r: r["submitted_at"]) if reviews else None
              status_desc = ""
              try:
                  st = call(f"/commits/{head}/status")
                  for s in st.get("statuses", []):
                      if s["context"] == "CodeRabbit":
                          status_desc = f'{s["state"]}: {s.get("description", "")}'
              except Exception as e:
                  status_desc = f"(status lookup failed: {e})"

              # 1) Review errors (including rate limits) fail first — no silent pass.
              if status_desc and BAD_STATUS.search(status_desc):
                  print(f"FAIL — the CodeRabbit review status reports an error: '{status_desc}'. Re-trigger the review (comment '@coderabbitai review') and re-run this gate.")
                  sys.exit(1)
              # 2) The LATEST completed CodeRabbit review on this head decides.
              if latest is not None:
                  state = latest["state"]
                  if state == "CHANGES_REQUESTED":
                      print(f"FAIL — the latest CodeRabbit review on head {head[:10]} requests changes. Resolve the findings; with request_changes_workflow the bot re-approves once comments are resolved, the latest commit is reviewed, and checks pass.")
                      sys.exit(1)
                  if state in ("APPROVED", "COMMENTED"):
                      print(f"PASS — latest CodeRabbit review on head {head[:10]} is {state} (submitted {latest['submitted_at']}); status: {status_desc}")
                      sys.exit(0)
                  if state == "DISMISSED":
                      print(f"FAIL — the CodeRabbit review on head {head[:10]} was dismissed; a fresh review is required (comment '@coderabbitai review') and re-run this gate.")
                      sys.exit(1)
              note = f"Waiting for a completed CodeRabbit review on head {head[:10]}… (latest review state: {latest['state'] if latest else 'none'}; CodeRabbit status: {status_desc or 'not posted yet'})"
              if note != last_note:
                  print(note)
                  last_note = note
              if time.time() > deadline:
                  print("FAIL — no completed CodeRabbit review on the current head within the poll window. This repository gets no automatic reviews (fewer than 10 stars): comment '@coderabbitai review' on the PR, then re-run this gate run itself (Actions → Re-run — the re-run re-evaluates the PR's current head and issues a fresh check-run on this PR head, measured on #728).")
                  sys.exit(1)
              time.sleep(30)
          PY
      - name: Resolve target PR head for coverage verification
        id: coverage-pr
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(number) || number < 1) {
              core.setFailed('A valid PR number is required for review coverage verification.');
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number,
            });
            core.setOutput('base_ref', pull.base.ref);
            core.setOutput('base_sha', pull.base.sha);
            core.setOutput('head_sha', pull.head.sha);
            core.setOutput('author_login', pull.user.login);
            core.setOutput('author_type', pull.user.type || '');

      - name: Checkout trusted review coverage verifier
        if: steps.coverage-pr.outputs.base_ref == 'main'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.coverage-pr.outputs.base_sha }}
          path: trusted
          persist-credentials: false

      # Fetch the candidate manifest through the read-only GitHub API in the
      # trusted verifier. No code or checkout from the candidate/fork is used.
      # Bot-authored PRs retain the existing CodeRabbit seat exemption: the
      # earlier job already gates them on every other required check.
      - name: Verify exact CodeRabbit file coverage (maximum 100 per review)
        if: ${{ steps.coverage-pr.outputs.base_ref == 'main' &&
          steps.coverage-pr.outputs.author_type != 'Bot' &&
          !endsWith(steps.coverage-pr.outputs.author_login, '[bot]') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          TRUSTED_BASE_SHA: ${{ steps.coverage-pr.outputs.base_sha }}
        run: >-
          python3 trusted/.ci/check_coderabbit_review_coverage.py
          --repository "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER"
          --manifest-path docs/governance/campaign/release/coderabbit-review-coverage.json
          --alternative-config trusted/.ci/coderabbit-review-alternative-checks.json
          --trusted-base-sha "$TRUSTED_BASE_SHA"
          --max-files-per-review 100

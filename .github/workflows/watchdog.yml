name: Production Watchdog

# Layer 7 — production-watchdog: synthetic uptime monitoring of the live
# deployment channel. This closes the alerting half of gap G-OPS-1
# (airbnb-level-gap-analysis §3, "G-OPS-1: المراقبة العملية") with the
# framework's own free channels — GitHub Actions schedules + issues — while
# the OTEL/MAIL vendor decision stays exactly where the plan put it: a
# user-owned gate (SYSTEM.md §14.2). Zero application code, zero runtime
# surface: the app is never touched, and no redeploy is needed (the workflow
# runs from this repository's main, not from the deployment fork).
#
# Official evidence (cached in the session workspace, scripts/doc-verify/):
#   actions-schedule-events.html —
#     "Scheduled workflows will only run on the default branch."
#     "The shortest interval you can run scheduled workflows is once every
#      5 minutes."
#     "The schedule event can be delayed during periods of high loads of
#      GitHub Actions workflow runs. High load times include the start of
#      every hour. To decrease the chance of delay, schedule your workflow
#      to run at a different time of the hour."  -> cron below is offset
#     to 7/22/37/52, never on an hour or quarter boundary.
#     "In a public repository, scheduled workflows are automatically disabled
#      when no repository activity has occurred in 60 days."  -> Dependabot
#     and merges keep this repository active; re-enable from the Actions tab
#     if it ever trips.
#   actions-workflow-syntax.html —
#     "issues: write permits an action to add a comment to an issue."
#   runner-ubuntu2404-readme.md (actions/runner-images) —
#     "GitHub CLI 2.98.0" is preinstalled on ubuntu-latest.
#
# Probe contract (measured live 2026-09-05, SYSTEM.md §15; sixth probe added
# by plan item 3.2 — merge AFTER the S10 fix that takes mail out of platform
# health, or this probe false-pages on the documented SMTP outage):
#   /actuator/health/liveness    -> 200  (process alive)
#   /actuator/health/readiness   -> 200  (traffic-ready)
#   /oauth2/jwks                 -> 200  (auth keys served)
#   /.well-known/openid-configuration -> 200 (OIDC discovery)
#   /actuator/modulith           -> 401  (boundary check: the endpoint is
#        intentionally protected — 404 would mean the exposure list drifted,
#        200 would mean the security boundary is gone; both are incidents)
#   /actuator/health             -> 200  (the aggregate verdict — "the point
#        that revealed the sickness": probe the point itself, not only what
#        sits above it. With mail out of platform health, DOWN here means a
#        core contributor (db/redis/diskSpace/ping/modulithEventBus) is
#        failing — an incident worth paging on)
#   TLS is verified by curl's default behaviour: an expired or broken
#   certificate fails the probe (code 000) and pages like any outage.
#
# The full /actuator/health probe replaces the former deliberate exclusion:
# pre-S10-fix it 503'd on the documented MAIL_* provider placeholder (a
# user-owned gate, not an outage) and would have been a permanent false
# alarm. mail no longer gates the aggregate (management.health.mail.enabled:
# false — the S10 fix); the SMTP outage itself remains a declared operational
# debt in the risk register until the provider is chosen — it just cannot
# blind or sink the aggregate verdict anymore.
#
# Alerting home (layer 15, measured 2026-09-06): this workflow manages
# incidents ONLY where issues exist — upstream (waelhe). The retired
# deployment fork (waelhe88-coder — frozen at its last fast-forward when the
# fork-sync workflow was disabled with the old account, 2026-09-19) still
# carries this file's guard and scheduled workflows still run there, but the
# fork has issues DISABLED (measured has_issues=false): every healthy fork
# run died in "Close resolved incident" with "the repository has disabled
# issues". The job guard below confines incident management to its home; the
# fork's runs become skipped (green) instead of failing.
#
# Deployment-channel freshness probe (layer 15, redesigned 2026-09-19 for the
# v3 account migration; domain redirected 2026-09-30 for the v4 trial-account
# cycle — runbook docs/operating/trial-renewal-and-provider-migration-
# runbook.md §10): the v4 account (project "successful-simplicity", service
# 221b33de, public domain app-java-v3-production-59bf.up.railway.app) took
# over production on 2026-09-29 and the old v3 domain now answers the edge
# fallback ("Application not found", x-railway-fallback — measured
# 2026-09-30T16:34Z), which had every scheduled run failing on all endpoint
# probes since 13:57Z on 2026-09-29 (runs #186-#191, incident #469) while the
# live service was healthy the whole time (smoke station ALL PASS on -59bf:
# readiness/liveness/jwks kid=marketplace-jwt-r3/OIDC/modulith 401/api-docs
# 111 paths, measured 2026-09-30T16:35Z).
#
# Freshness-channel state on v4 (measured 2026-09-30, to be restored per the
# runbook's §10.5 owner-gated sequence): the deploy channel is the v4 fork
# (waelhe88-coder/app-java-v3@main, parked at bab774c1 = #468) while recent
# production deployments were carried by manual serviceInstanceDeployV2 API
# calls (the #472-era deployment, 2026-09-30T01:31Z); the Railway commit-
# status context is silent on BOTH repositories' heads (0 contexts measured
# on upstream main and on the fork's main). The freshness leg below therefore
# reads THE FORK — the actual v4 deployment source — and fails closed:
# absence of successful-deployment evidence beyond the in-flight bound
# (MAX_LAG_MINUTES) is a failure, never an age-pass (CodeRabbit round on
# #479: a probe that reads upstream main stays green while the fork, and
# production behind it, drifts arbitrarily far behind). During the documented
# transitional state (fork parked, §10.5 restoration pending) this leg is
# honestly RED and incident #469 stays open — an old-source-HEAD-with-no-
# deploy is the designed dead-channel signal, not a false positive to be
# silenced; the leg greens when the owner restores the channel (fork sync +
# project token + status context re-check per §10.5 steps 2-4).
#
# Historical (v3 era, kept for the record): production deployed directly from
# this repository's main via Railway's GitHub App — the old channel (deployment
# fork + scheduled fork-sync.yml) is decommissioned and a fork-vs-upstream
# compare would measure a frozen repository, failing forever. The App reported
# each deployment as a commit status on the exact commit it built, context
# "<project> - <service>" (measured on that account: success on bb6da39 →
# "Success - app-java-v3-production.up.railway.app"; failure on 7371afbb and
# 16117d8 → "Deployment failed" — the BUILD_IMAGE cache-id validation that
# PR #347 closes). The probe reads that status on main HEAD: success =
# fresh; failure = production is serving stale code (incident, immediately —
# a failed build never self-heals); pending/missing is bounded by the commit's
# age, because a push-triggered channel reports within minutes of the push —
# an old HEAD without a success means the trigger is gone (dead channel).
# Threshold continuity: the old 240m limit was derived for a 30m-cron sync
# channel (observed worst spacing 2h53m + ~15m build + margin); the new
# channel is push-triggered, so 240m stays a conservative bound covering a
# full build (~16m measured on ab6929f7) plus retries and margin.
# Known edge (documented, accepted): a manual redeploy of an older commit
# posts its own success on THAT commit, so main HEAD's status can
# over-report freshness during deliberate operator pinning; the endpoint
# probes still catch a broken deployment.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force_incident:
        description: "Self-test: open an incident issue even when all probes pass (the next healthy run closes it automatically)"
        type: boolean
        default: false

concurrency:
  group: production-watchdog
  cancel-in-progress: false

permissions:
  # issues: write is the alerting action (official syntax doc: "issues:
  # write permits an action to add a comment to an issue").
  # contents: read is explicit for the freshness probe's gh api reads of
  # main's branch state and its commit statuses (least privilege: read only).
  issues: write
  contents: read

jobs:
  probe:
    name: Probe public production endpoints
    # Alerting home: only upstream runs this job (issues enabled there).
    # Measured on the fork: gh issue list fails with "the repository has
    # disabled issues" on every healthy run — the incident steps must not
    # execute there. See the header comment for the full evidence.
    if: github.repository == 'waelhe/app-java-v3'
    runs-on: ubuntu-latest
    steps:
      - name: Probe public production endpoints
        id: probe
        env:
          BASE_URL: https://app-java-v3-production-59bf.up.railway.app
        run: |
          set -u
          declare -A want=(
            ["/actuator/health/liveness"]="200"
            ["/actuator/health/readiness"]="200"
            ["/oauth2/jwks"]="200"
            ["/.well-known/openid-configuration"]="200"
            ["/actuator/modulith"]="401"
            ["/actuator/health"]="200"
          )
          overall=0
          : > probe-results.txt
          for path in "${!want[@]}"; do
            pass=0
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL$path" 2>/dev/null || echo 000)
              if [ "$code" = "${want[$path]}" ]; then
                pass=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
            done
            if [ "$pass" = 1 ]; then
              echo "OK    $path -> $code" | tee -a probe-results.txt
            else
              echo "FAIL  $path -> $code (want ${want[$path]}) after 3 attempts" | tee -a probe-results.txt
              overall=1
            fi
          done
          cat probe-results.txt
          if [ "$overall" -ne 0 ]; then
            exit 1
          fi

      - name: Probe deployment channel freshness
        env:
          GH_TOKEN: ${{ github.token }}
          # The v4 deployment source (SYSTEM.md §15 + runbook §10.5, measured
          # 2026-09-30): the Railway service in the v4 trial account builds
          # from the FORK waelhe88-coder/app-java-v3 — NOT from this upstream
          # repository. The probe must read the source production actually
          # deploys from: reading upstream main would stay green while the
          # fork (and production behind it) drifts arbitrarily far behind —
          # the exact silent lie this check exists to catch (CodeRabbit round
          # on #479). Public repo, so the upstream-scoped token reads it.
          DEPLOY_SOURCE: waelhe88-coder/app-java-v3
          RAILWAY_STATUS_CONTEXT: "app-java-v3 - app-java-v3"
          # Fail-closed bound: a non-success state is tolerated ONLY while a
          # deploy is plausibly still in flight; beyond it, the absence of
          # successful-deployment evidence FAILS the check — commit age
          # alone never greens a dead channel.
          MAX_LAG_MINUTES: 60
        run: |
          set -u
          if ! src_sha=$(gh api "repos/$DEPLOY_SOURCE/branches/main" --jq .commit.sha 2>/dev/null); then
            echo "FAIL  deployment channel: cannot read the deployment source ($DEPLOY_SOURCE main)" | tee -a probe-results.txt
            exit 1
          fi
          if ! status_json=$(gh api "repos/$DEPLOY_SOURCE/commits/$src_sha/status" 2>/dev/null); then
            echo "FAIL  deployment channel: cannot read commit statuses for the deployment source HEAD" | tee -a probe-results.txt
            exit 1
          fi
          rw_state=$(echo "$status_json" | jq -r --arg ctx "$RAILWAY_STATUS_CONTEXT" \
            '[.statuses[] | select(.context == $ctx)][0].state // ""')
          rw_desc=$(echo "$status_json" | jq -r --arg ctx "$RAILWAY_STATUS_CONTEXT" \
            '[.statuses[] | select(.context == $ctx)][0].description // ""')
          if [ "$rw_state" = "success" ]; then
            echo "OK    deployment channel fresh: $DEPLOY_SOURCE HEAD ($(
              echo "$src_sha" | cut -c1-12)) deployed — $rw_desc" | tee -a probe-results.txt
            exit 0
          fi
          if [ "$rw_state" = "failure" ]; then
            echo "FAIL  deployment channel: Railway reports a failed deployment from $DEPLOY_SOURCE HEAD ($(
              echo "$src_sha" | cut -c1-12)) — production is serving stale code ($rw_desc)" | tee -a probe-results.txt
            exit 1
          fi
          # pending, or no status reported yet: tolerated ONLY while a build
          # is plausibly still in flight (MAX_LAG_MINUTES); beyond that the
          # absence of successful-deployment evidence FAILS the check — a
          # dead channel must be loud, never green on commit age alone.
          if ! head_date=$(gh api "repos/$DEPLOY_SOURCE/commits/$src_sha" --jq .commit.committer.date 2>/dev/null); then
            echo "FAIL  deployment channel: cannot read the deployment source HEAD commit date" | tee -a probe-results.txt
            exit 1
          fi
          age_minutes=$(( ( $(date -u +%s) - $(date -u -d "$head_date" +%s) ) / 60 ))
          if [ "$age_minutes" -gt "$MAX_LAG_MINUTES" ]; then
            echo "FAIL  deployment channel stale: $DEPLOY_SOURCE HEAD is ${age_minutes}m old with no successful deploy (state=${rw_state:-none}, bound ${MAX_LAG_MINUTES}m) — the channel is down or the status context drifted; runbook §10.5 (owner-gated restoration) owns the fix" | tee -a probe-results.txt
            exit 1
          fi
          echo "OK    deployment channel within the in-flight bound: $DEPLOY_SOURCE HEAD ${age_minutes}m old, deploy state=${rw_state:-not reported yet} (bound ${MAX_LAG_MINUTES}m)" | tee -a probe-results.txt

      - name: Open incident issue (deduplicated)
        if: failure() || inputs.force_incident == true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FORCE: ${{ inputs.force_incident }}
        run: |
          gh label create -R "$REPO" uptime-watchdog --color d73a4a \
            --description "Production watchdog incident (opened by the Production Watchdog workflow)" || true
          existing=$(gh issue list -R "$REPO" --label uptime-watchdog --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An open watchdog incident already exists - skipping issue creation (dedup)."
            exit 0
          fi
          {
            echo "## Production unhealthy (endpoints or deployment channel)"
            echo
            echo "Detected by run $RUN_URL at $(date -u '+%Y-%m-%d %H:%M:%S UTC')."
            echo
            echo '```'
            cat probe-results.txt
            echo '```'
            echo
            if [ "$FORCE" = "true" ]; then
              echo "_Self-test run (force_incident=true): all probes are healthy; this issue exists to prove the alerting channel end-to-end. The next healthy run will close it automatically._"
            fi
          } > incident-body.md
          gh issue create -R "$REPO" \
            --title "[watchdog] Production endpoints unhealthy - $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body-file incident-body.md \
            --label uptime-watchdog \
            --assignee "$OWNER"

      - name: Close resolved incident
        if: success() && inputs.force_incident != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          numbers=$(gh issue list -R "$REPO" --label uptime-watchdog --state open --json number --jq '.[].number')
          if [ -z "$numbers" ]; then
            echo "No open watchdog incident - nothing to close."
            exit 0
          fi
          for n in $numbers; do
            gh issue close "$n" -R "$REPO" \
              --comment "All probes healthy again (run $RUN_URL, $(date -u '+%Y-%m-%d %H:%M:%S UTC')). Closing as resolved."
          done

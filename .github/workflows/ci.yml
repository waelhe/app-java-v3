name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    # Parallel plan §4.1: the four gates run on pull_request for the wave's
    # integrative PRs. The official GitHub docs are explicit that the
    # pull_request branches filter matches the PR's BASE branch ("only run on
    # pull requests that target specific branches" — Events that trigger
    # workflows), so each part's stacked base was listed here to gate its
    # pushes during the flow. Both stacked waves have since merged — #510
    # the foundation, #517 track-b part 1 — so both entries retired with
    # their waves (the inertness the comment itself documents). Additive
    # only: PRs targeting main and push events are unaffected; the
    # remaining open PRs target main directly and gate through the
    # pull_request event.
    # The #540 review split's stacked base rides the same §4.1 mechanism:
    # #541 (discovery/wave-part1 -> main) is slice 1, #540 (the full D1-D4
    # head -> discovery/wave-part1) is slice 2 — the CodeRabbit free-plan
    # 100-file review limit's documented remedy (split or change base). The
    # entry retires with the wave (the precedent's own inertness rule).
    branches: [ main, discovery/wave-part1 ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 25 ]
      fail-fast: false

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Gitleaks secret scan (high/critical policy)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_NOTIFY_USER_LIST: ''
          GITLEAKS_FAIL_LEVEL: high

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Fetch git tags for OpenAPI baseline
        run: git fetch --force --tags

      - name: OpenAPI backward compatibility gate
        env:
          # The gate boots the built jar (default profile, no
          # SPRING_PROFILES_ACTIVE) to fetch /v3/api-docs. The base
          # application.yml defaults to localhost:5432 with user
          # "marketplace" — the CI postgres service runs as test/test, so
          # without these overrides the boot fails with a connection/auth
          # error the first time a baseline tag exists. (The tag path had
          # never executed before 2026-09-05: zero tags existed, so the
          # script always skipped itself.) The last three flags mirror the
          # proven "Start Application" env of integration-test.yml.
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          # Spring AI's Google embedding connection details require a credential
          # even when the embedding model selector is `none`. This harmless
          # placeholder satisfies configuration binding only; the gate never calls Google.
          GOOGLE_GENAI_API_KEY: test-key
          MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: false
          MANAGEMENT_HEALTH_MAIL_ENABLED: false
          MANAGEMENT_TRACING_ENABLED: false
        run: ./.ci/check-openapi-compat.sh

      # The gate boots two app instances (current + baseline tag) whose
      # stdout goes to runner-local logs; on failure those logs were
      # invisible. This upload found the 2026-09-29 baseline-boot root
      # cause (stale target/ resources ghosting into the tag jar) in a
      # single run — keep the visibility permanent.
      - name: Upload OpenAPI gate boot logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-gate-logs-java-${{ matrix.java }}
          path: .ci/openapi-compat/
          retention-days: 7
          if-no-files-found: ignore

      - name: Run Maven verify (unit + integration tests)
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: ./mvnw verify --batch-mode

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

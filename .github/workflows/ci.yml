name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, feat/product-variants ]
  pull_request:
    # Parallel plan §4.1: the four gates run on pull_request for the wave's
    # integrative PRs. The official GitHub docs are explicit that the
    # pull_request branches filter matches the PR's BASE branch ("only run on
    # pull requests that target specific branches" — Events that trigger
    # workflows), so each part's stacked base was listed here to gate its
    # pushes during the flow. Both stacked waves have since merged — #510
    # the foundation, #517 track-b part 1 — so both entries retired with
    # their waves (the inertness the comment itself documents). Additive
    # only: PRs targeting main and push events are unaffected; the
    # remaining open PRs target main directly and gate through the
    # pull_request event.
    # GraphQL DGS wave (2026-10-16): #585/#584/#586 all merged and
    # published; the stacked bases (docs/graphql-target-architecture,
    # feat/graphql-p0-bounded-foundation) are deleted branches, so both
    # entries retired with the wave in the post-merge truth-sync exactly
    # as their own comments prescribed — inert weight otherwise. PRs
    # targeting main gate through the pull_request event as before.
    branches: [ main ]


# One test round per ref: a newer push supersedes the older round and
# cancels it in place (GitHub's documented concurrency discipline — the
# 2026-10-11 measured flood: an iterating sibling branch's pushes parked
# ~75 superseded runs in the queue while the account's 20-runner ceiling
# starved every live gate). The merge ruleset reads the LATEST head's
# check-runs, so only superseded rounds are ever cancelled — never the
# round a gate is waiting on.
concurrency:
  # CodeRabbit's final round on the #544 slice: the event TYPE rides the
  # group key — a workflow_dispatch run and a push run on the same ref are
  # DIFFERENT gates (the deploy gate reads push results; a manual dispatch
  # must never cancel an in-flight push check, and a scheduled sweep must
  # never cancel either). Cancellation stays exactly where it belongs:
  # between older and newer runs of the SAME event type on the same ref.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read

# The 2026-10-14 measured redesign. The suite's own artifact parsed:
# 160.4 test-minutes per round, of which marketplace-app's failsafe phase
# alone is 156.5 (97.5%) — 227 classes (*IT / *IntegrationTest, the root
# pom's failsafe includes) averaging ~40s each, evenly spread (top-10
# classes = 10.7% of the time). The old single "Build & Test" job
# serialized everything on ONE runner: 70.6min at 09-28, 166.0min at
# 10-13. The new shape uses only the official building blocks:
#   1. Jobs run in parallel by default
#      (docs.github.com/actions/using-jobs-in-a-workflow).
#   2. The matrix fans marketplace-app's suite out 8-way
#      (docs.github.com/actions/using-jobs-in-a-workflow/using-a-matrix-for-your-jobs).
#   3. Install once, test many: `build` installs the whole reactor to the
#      local repository, every test job then runs `verify -pl <modules>`
#      and resolves the sibling modules from ~/.m2 — Maven's documented
#      multi-module model (maven.apache.org, Guide to Working with
#      Multiple Modules: installed modules are resolved from the local
#      repository). The installed tree travels between jobs as an artifact
#      (github.com/actions/upload-artifact, github.com/actions/
#      download-artifact — the official actions).
#   4. Shard membership is computed ON THE RUNNER from the live tree,
#      mirroring the root pom's failsafe <includes> exactly — every
#      discovered class lands in exactly ONE bucket, so a newly added
#      test class can never be silently missed (no stale pattern lists).
#   5. The required check name "Build & Test (JDK 25)" — one of the four
#      contexts the merge ruleset demands — is preserved by the final
#      `build-test` aggregate job over `needs.*.result`, the documented
#      pattern for a matrix-dependent summary check. Every new gate (the
#      8 shards, the modules suite, the OpenAPI gate, the coverage gate)
#      is enforced THROUGH it: nothing that failed silently before can
#      pass now.
#   6. JaCoCo: shards neutralize only the threshold (a CLI -D property
#      override — Maven's documented property precedence) and export
#      their partial execution data; the `coverage` job merges the 9
#      partial .exec files (8 IT shards + the unit pass) with the jacoco
#      merge mojo (the plugin's own documented fileSets mechanism) and
#      re-enforces the SAME 0.70 INSTRUCTION gate on the merged bundle.
#      The check's documented skip-on-missing-data behavior is why
#      `install -DskipTests` has always passed clean (no data file, no
#      check) — the same behavior keeps the build job green.
jobs:
  build:
    name: Build (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan (high/critical policy)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_NOTIFY_USER_LIST: ''
          GITLEAKS_FAIL_LEVEL: high

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # Compile the 29-module reactor ONCE per round. -DskipTests keeps the
      # test COMPILATION (a broken test source still fails here, exactly as
      # the old single job's first phase did) while skipping execution —
      # the documented surefire/failsafe skipTests semantics.
      - name: Install reactor (compile once, tests skipped)
        run: ./mvnw install -DskipTests --batch-mode

      - name: Upload installed module artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maven-artifacts
          path: /home/runner/.m2/repository/com/marketplace
          retention-days: 1
          if-no-files-found: error

  test-app:
    name: Tests — app shard ${{ matrix.shard }}/8 (JDK 25)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6, 7, 8 ]
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Restore installed module artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-artifacts
          path: /home/runner/.m2/repository/com/marketplace

      # Round-robin over the sorted class list: with the measured uniform
      # ~40s spread, NR % 8 buckets are near-identical in size. The find
      # patterns mirror the root pom's failsafe <includes> EXACTLY
      # (**/*IT.java + **/*IntegrationTest.java) — anything the plugin
      # would run is discovered here, and anything discovered runs in
      # exactly one shard. An empty bucket (a future tree shrink) uses the
      # sentinel class name: matches nothing, and
      # failsafe.failIfNoSpecifiedTests=false lets the shard pass instead
      # of widening into "run everything".
      - name: Discover shard bucket (round-robin over failsafe classes)
        run: |
          set -euo pipefail
          TOTAL=8
          SHARD=${{ matrix.shard }}
          mapfile -t CLASSES < <(find marketplace-app/src/test/java \
            \( -name '*IT.java' -o -name '*IntegrationTest.java' \) -type f \
            | sed -e 's|^marketplace-app/src/test/java/||' -e 's|\.java$||' -e 's|/|.|g' \
            | sort)
          echo "Discovered ${#CLASSES[@]} integration test classes in marketplace-app"
          COUNT=0
          BUCKET=""
          IDX=0
          for c in "${CLASSES[@]}"; do
            if [ $(( IDX % TOTAL )) -eq $(( SHARD - 1 )) ]; then
              BUCKET="${BUCKET}${BUCKET:+,}$c"
              COUNT=$(( COUNT + 1 ))
            fi
            IDX=$(( IDX + 1 ))
          done
          echo "Shard ${SHARD}/${TOTAL}: ${COUNT} classes"
          BUCKET="${BUCKET:-NoneMatchThisIT}"
          echo "BUCKET=${BUCKET}" >> "$GITHUB_ENV"

      # it.test is failsafe's documented selector (the failsafe counterpart
      # of surefire's `test` parameter); `test` here pins surefire to a
      # matching-nothing sentinel so the unit phase (3.1 measured minutes)
      # runs ONCE in test-modules instead of eight times. The JaCoCo
      # threshold override rides Maven's documented CLI-property precedence:
      # the agent still records the shard's execution data; only the
      # per-shard bundle check is neutralized (a shard sees ~1/8 of the
      # coverage by construction). The merged-data gate lives in the
      # `coverage` job.
      - name: Run app integration shard
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: |
          ./mvnw verify -pl marketplace-app --batch-mode \
            -Dtest=NoneMatchThisUnitTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test="$BUCKET" \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -Djacoco.coverage.threshold=0.00

      - name: Stage execution data for the coverage merge
        if: always()
        run: |
          set -euo pipefail
          cp marketplace-app/target/jacoco.exec \
            "$RUNNER_TEMP/app-exec-${{ matrix.shard }}.exec" || \
            { echo "::warning::no jacoco.exec produced by this shard"; touch "$RUNNER_TEMP/app-exec-${{ matrix.shard }}.exec"; }

      - name: Upload shard execution data
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-exec-${{ matrix.shard }}
          path: ${{ runner.temp }}/app-exec-${{ matrix.shard }}.exec
          retention-days: 1
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-app-shard-${{ matrix.shard }}
          path: |
            marketplace-app/target/surefire-reports/
            marketplace-app/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  test-modules:
    name: Tests — modules (JDK 25)
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Restore installed module artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-artifacts
          path: /home/runner/.m2/repository/com/marketplace

      # Every module except marketplace-app — a measured 3.9 test-minutes
      # combined (the app module IS the suite). Their JaCoCo 0.70 gates
      # run here unchanged: each module's own tests produce its own
      # complete execution data, so no merge is needed below them.
      - name: Run every non-app module's suite (unit + integration)
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: |
          ./mvnw verify --batch-mode \
            -pl marketplace-shared,marketplace-platform-infra,marketplace-identity,marketplace-catalog,marketplace-booking,marketplace-payments,marketplace-pricing,marketplace-reviews,marketplace-messaging,marketplace-search,marketplace-provider,marketplace-availability,marketplace-notifications,marketplace-ledger,marketplace-disputes,marketplace-media,marketplace-geo,marketplace-realestate,marketplace-community,marketplace-institutions,marketplace-jobs,marketplace-knowledge,marketplace-console,marketplace-ai,marketplace-discovery,marketplace-orders,marketplace-lending,marketplace-edge

      # The app module's UNIT tests (3.1 measured minutes) run exactly once,
      # here: the `test` phase stops before verify, so the JaCoCo check
      # (verify-bound) never fires — the agent still records the unit-pass
      # execution data for the coverage merge.
      - name: Run the app module's unit tests
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: ./mvnw test -pl marketplace-app --batch-mode

      - name: Stage execution data for the coverage merge
        if: always()
        run: |
          set -euo pipefail
          cp marketplace-app/target/jacoco.exec \
            "$RUNNER_TEMP/app-exec-unit.exec" || \
            { echo "::warning::no jacoco.exec produced by the unit pass"; touch "$RUNNER_TEMP/app-exec-unit.exec"; }

      - name: Upload unit-pass execution data
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-exec-unit
          path: ${{ runner.temp }}/app-exec-unit.exec
          retention-days: 1
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-modules
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  # The gate's script is untouched (its `clean` and its boot order are
  # measured load-bearing — see its own comments). It needs the full tag
  # history and its own service containers; it runs its own
  # `-pl marketplace-app -am clean package -DskipTests`, so it neither
  # needs nor waits for the maven-artifacts upload — it starts in parallel
  # with `build`.
  openapi-gate:
    name: OpenAPI Compatibility Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Fetch git tags for OpenAPI baseline
        run: git fetch --force --tags

      - name: OpenAPI backward compatibility gate
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          GOOGLE_GENAI_API_KEY: test-key
          MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: false
          MANAGEMENT_HEALTH_MAIL_ENABLED: false
          MANAGEMENT_TRACING_ENABLED: false
        run: ./.ci/check-openapi-compat.sh

      - name: Upload OpenAPI gate boot logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openapi-gate-logs
          path: .ci/openapi-compat/
          retention-days: 7
          if-no-files-found: ignore

  # The GraphQL schema compatibility gate (the GraphQL target design §9 /
  # Phase 1 item 7 — the OpenAPI gate's exact shape for the SDL contract):
  # baseline-first on the release tag's own runtime schema, current second
  # on the fresh database, breaking changes (type/field/enum-value removal,
  # nullability tightening, argument removal/requirement) fail unless
  # documented in .ci/graphql-compat-allowlist.yml with ticket, reason and
  # expiry — the same temporary-exception lifecycle as the OpenAPI file.
  # Runs in parallel with `build` for the same reason the OpenAPI gate does:
  # it builds its own trees and needs no maven-artifacts upload.
  graphql-schema-gate:
    name: GraphQL Schema Compatibility Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Fetch git tags for GraphQL schema baseline
        run: git fetch --force --tags

      - name: GraphQL schema backward compatibility gate
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          GOOGLE_GENAI_API_KEY: test-key
          MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: false
          MANAGEMENT_HEALTH_MAIL_ENABLED: false
          MANAGEMENT_TRACING_ENABLED: false
        run: ./.ci/check-graphql-compat.sh

      - name: Upload GraphQL gate logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: graphql-schema-gate-logs
          path: .ci/graphql-compat/
          retention-days: 7
          if-no-files-found: ignore

      # Phase 5 (docs/api/graphql-target-architecture.md §11-Phase-5 items 3
      # and 5): the current tree's runtime SDL — already produced by the gate
      # above as its compared artifact — is published as a run artifact so
      # the android-graphql job can validate Apollo Kotlin codegen against
      # the SAME dump of the SAME run, and so the graphql-contract workflow
      # publishes to the `graphql-contract` distribution branch exactly what
      # CI booted and gated (never the production server, never a hand copy).
      - name: Upload the current runtime schema
        uses: actions/upload-artifact@v7.0.2
        with:
          name: graphql-runtime-schema
          path: .ci/graphql-compat/current-schema.graphqls
          retention-days: 7
          if-no-files-found: error

  # The app bundle's coverage gate, reconstituted on MERGED data: the 9
  # partial .exec files (8 IT shards + the unit pass) combine through the
  # jacoco merge mojo (the root pom's ci-coverage-merge profile — the
  # plugin's own documented fileSets mechanism), then the DEFAULT report +
  # check executions re-run against the merged target/jacoco.exec with the
  # unchanged 0.70 root property. Same gate, same threshold, same bundle —
  # sharding cannot dilute it.
  coverage:
    name: Coverage Gate (JDK 25)
    needs: [ build, test-app, test-modules ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Restore installed module artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-artifacts
          path: /home/runner/.m2/repository/com/marketplace

      - name: Collect the sharded execution data
        uses: actions/download-artifact@v8
        with:
          pattern: app-exec-*
          path: marketplace-app/target/shards
          merge-multiple: true

      - name: Merge execution data and enforce the 0.70 app-bundle gate
        run: ./mvnw verify -pl marketplace-app -P ci-coverage-merge -DskipTests --batch-mode

      - name: Upload merged coverage report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report-app
          path: marketplace-app/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  # Phase 5 item 4/5 (docs/api/graphql-target-architecture.md §11-Phase-5):
  # the Android side of the GraphQL contract. Apollo Kotlin codegen consumes
  # the SAME runtime SDL dump the graphql-schema-gate produced in THIS run —
  # one schema publication, both codegens (the DGS server types are generated
  # from the same SDL inside the Maven build this very run executes) — and
  # the generated models must compile. A stale Android operation (a field the
  # PR's schema no longer carries) or an incompatible server schema change
  # fails HERE, and build-test propagates it to the required
  # "Build & Test (JDK 25)" check: the Phase-5 acceptance criterion
  # "an incompatible server schema change or stale Android operation fails a
  # required build/check before release". Maven and Gradle keep their own
  # independent lifecycles (JDK 25 reactor vs JDK 17 Android toolchain); only
  # the schema publication is shared. JVM-only by design: no emulator, so
  # this required-path gate never inherits the instrumentation flakiness the
  # android-client workflow handles separately.
  android-graphql:
    name: Android GraphQL Contract Gate
    needs: [ graphql-schema-gate ]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # CodeRabbit round 1 (adopted 2026-10-17): the gate only reads the
    # repository and consumes a same-run artifact — no Git authentication,
    # no write scopes, no credential persistence (zizmor artipacked).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up stable Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Fetch this run's runtime schema dump
        uses: actions/download-artifact@v8
        with:
          name: graphql-runtime-schema
          path: .ci/graphql-contract-in

      # The published-contract staging contract: the exact path Apollo's
      # schemaFiles.from() pins (android/app/build.gradle.kts). CI stages the
      # file; the file is gitignored; hand-copied SDL is the anti-pattern.
      - name: Stage the run's SDL for Apollo codegen
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/graphql
          cp .ci/graphql-contract-in/current-schema.graphqls android/app/src/main/graphql/schema.graphqls
          echo "Staged this run's runtime SDL ($(wc -c < android/app/src/main/graphql/schema.graphqls) bytes) for Apollo Kotlin codegen"

      - name: Apollo Kotlin codegen against the run's schema publication
        working-directory: android
        run: ./gradlew :app:generateApolloSources

      - name: Compile the app with the generated Apollo models
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin

  # The required-check contract: the merge ruleset demands the context
  # "Build & Test (JDK 25)" — the documented matrix-summary pattern (a
  # final job over needs.*.result) keeps that exact check name while the
  # work fans out. It is green ONLY when build, all 8 shards, the modules
  # suite, the OpenAPI gate, the GraphQL schema gate, the Android GraphQL
  # contract gate, AND the coverage gate are green — strictly more
  # enforcement than the old single job (which could not even distinguish a
  # shard failure from a flake retry).
  build-test:
    name: Build & Test (JDK 25)
    needs: [ build, test-app, test-modules, openapi-gate, graphql-schema-gate, coverage, android-graphql ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert every gate passed
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "Gate results: $RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled|skipped'; then
            echo "::error::One or more required gates did not pass — see the failed jobs in this run."
            exit 1
          fi
          echo "All gates green: build, 8 app shards, modules suite, OpenAPI gate, GraphQL schema gate, Android GraphQL contract gate, coverage gate."

name: OpenRewrite inventory and recommendations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inventory is read-only; recommendations generates source/POM suggestions for review."
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - recommendations
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - 'pom.xml'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.properties'
      - 'rewrite.yml'
      - '.github/workflows/openrewrite.yml'
      - 'docs/governance/framework-maven-guard.md'
      - 'scripts/verify-framework-guard-policy.py'
      - 'scripts/summarize-openrewrite-report.py'
      - 'scripts/verify-openrewrite-bom-alignment.py'
      - 'scripts/export-openrewrite-recipe-inventory.py'

permissions:
  contents: read

concurrency:
  group: openrewrite-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'inventory' }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: OpenRewrite inventory/review (Java 25, Apache recipes)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check free Code Genome credentials
        id: credentials
        shell: bash
        env:
          CODEGENOME_USERNAME: ${{ secrets.CODEGENOME_USERNAME }}
          CODEGENOME_TOKEN: ${{ secrets.CODEGENOME_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CODEGENOME_USERNAME}" || -z "${CODEGENOME_TOKEN}" ]]; then
            {
              echo "### OpenRewrite did not run"
              echo
              echo "Code Genome credentials were not available. Add CODEGENOME_USERNAME and CODEGENOME_TOKEN repository Actions secrets. This workflow will not report green if OpenRewrite did not execute."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CODEGENOME_USERNAME and CODEGENOME_TOKEN are required; OpenRewrite must not be silently skipped."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Write temporary Maven credentials
        if: steps.credentials.outputs.enabled == 'true'
        shell: bash
        env:
          CODEGENOME_USERNAME: ${{ secrets.CODEGENOME_USERNAME }}
          CODEGENOME_TOKEN: ${{ secrets.CODEGENOME_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          settings = ET.Element("settings")
          servers = ET.SubElement(settings, "servers")
          server = ET.SubElement(servers, "server")
          ET.SubElement(server, "id").text = "codegenome"
          ET.SubElement(server, "username").text = os.environ["CODEGENOME_USERNAME"]
          ET.SubElement(server, "password").text = os.environ["CODEGENOME_TOKEN"]
          path = Path.home() / ".m2" / "settings.xml"
          ET.indent(settings, space="  ")
          ET.ElementTree(settings).write(path, encoding="utf-8", xml_declaration=True)
          path.chmod(0o600)
          PY

      - name: Install reactor for dependency-resolution validation
        if: steps.credentials.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # DependencyList's validateResolvable check uses Maven's local repository.
          # Install this reactor first so com.marketplace:* artifacts are resolved locally
          # instead of being incorrectly requested from Code Genome/Maven Central.
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmaven.test.skip=true -DskipITs install

      - name: Generate effective POM with official BOM imports
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p target/rewrite
          ./mvnw --batch-mode --no-transfer-progress -Popenrewrite -N \
            org.apache.maven.plugins:maven-help-plugin:3.5.1:effective-pom \
            -Doutput=target/rewrite/openrewrite-effective-pom.xml

      - name: Verify plugin recipe versions against imported BOMs
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          python3 scripts/verify-openrewrite-bom-alignment.py \
            --project-pom pom.xml --effective-pom target/rewrite/openrewrite-effective-pom.xml

      - name: Discover current recipes
        if: steps.credentials.outputs.enabled == 'true'
        env:
          REWRITE_MODE: ${{ inputs.mode || 'inventory' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/rewrite
          if [[ "$REWRITE_MODE" == "recommendations" ]]; then
            ACTIVE_RECIPE="com.marketplace.governance.OpenRewriteRecommendations"
          else
            ACTIVE_RECIPE="com.marketplace.governance.OpenRewriteBaseline"
          fi
          ./mvnw --batch-mode --no-transfer-progress -Popenrewrite \
            -Drewrite.activeRecipes="$ACTIVE_RECIPE" \
            -Drewrite.failOnInvalidActiveRecipes=true \
            -Ddetail=true rewrite:discover 2>&1 | tee target/rewrite/recipe-discovery.txt
          python3 scripts/export-openrewrite-recipe-inventory.py --input target/rewrite/recipe-discovery.txt --output target/rewrite/recipe-catalog.csv --maven-repo "$HOME/.m2/repository" --strict-attribution

      - name: Preview selected recipes without modifying source
        if: steps.credentials.outputs.enabled == 'true'
        env:
          REWRITE_MODE: ${{ inputs.mode || 'inventory' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REWRITE_MODE" == "recommendations" ]]; then
            ACTIVE_RECIPE="com.marketplace.governance.OpenRewriteRecommendations"
          else
            ACTIVE_RECIPE="com.marketplace.governance.OpenRewriteBaseline"
          fi
          ./mvnw --batch-mode --no-transfer-progress -Popenrewrite \
            -Drewrite.activeRecipes="$ACTIVE_RECIPE" \
            -Drewrite.failOnInvalidActiveRecipes=true \
            -Drewrite.exportDatatables=true rewrite:dryRun

      - name: Generate human-readable report
        if: always() && steps.credentials.outputs.enabled == 'true'
        env:
          REWRITE_MODE: ${{ inputs.mode || 'inventory' }}
          REWRITE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p target/rewrite
          python3 scripts/summarize-openrewrite-report.py \
            --mode "$REWRITE_MODE" --commit "$REWRITE_COMMIT" \
            --report-root target/rewrite --output target/rewrite/openrewrite-summary.md
          cat target/rewrite/openrewrite-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Assert dry run left tracked files untouched
        if: steps.credentials.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::OpenRewrite dryRun changed tracked files; only preview output is permitted."
            git diff --stat
            exit 1
          fi

      - name: Upload OpenRewrite report, discovery catalog, and patches
        if: always() && steps.credentials.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openrewrite-${{ inputs.mode || 'inventory' }}-${{ github.sha }}
          path: |
            target/rewrite/**
            **/target/rewrite/**
            **/target/site/rewrite/**
            **/target/rewrite*.patch
          if-no-files-found: warn
          retention-days: 14

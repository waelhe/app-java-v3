name: Integration Test

on:
  workflow_dispatch:
  push:
    branches: [ main, feat/product-variants ]
  pull_request:
    # Parallel plan §4.1: the four gates run on pull_request for the wave's
    # integrative PRs. The official GitHub docs are explicit that the
    # pull_request branches filter matches the PR's BASE branch ("only run on
    # pull requests that target specific branches" — Events that trigger
    # workflows), so each part's stacked base was listed here to gate its
    # pushes during the flow. Both stacked waves have since merged — #510
    # the foundation, #517 track-b part 1 — so both entries retired with
    # their waves (the inertness the comment itself documents). Additive
    # only: PRs targeting main and push events are unaffected; the
    # remaining open PRs target main directly and gate through the
    # pull_request event.
    # GraphQL DGS wave (2026-10-16): #585/#584/#586 all merged and
    # published; the stacked base (feat/graphql-p0-bounded-foundation)
    # is a deleted branch, so the entry retired with the wave in the
    # post-merge truth-sync exactly as its own comment prescribed —
    # inert weight otherwise. PRs targeting main gate through the
    # pull_request event as before.
        # Temporary stacked Saleor PR target pattern; retire after #677-#681 are reconciled.
    branches: [ main, feat/saleor-commerce-product-keyset-pagination, 'feat/saleor-*' ]


# One test round per ref: a newer push supersedes the older round and
# cancels it in place (GitHub's documented concurrency discipline — the
# 2026-10-11 measured flood: an iterating sibling branch's pushes parked
# ~75 superseded runs in the queue while the account's 20-runner ceiling
# starved every live gate). The merge ruleset reads the LATEST head's
# check-runs, so only superseded rounds are ever cancelled — never the
# round a gate is waiting on.
concurrency:
  # CodeRabbit's final round on the #544 slice: the event TYPE rides the
  # group key — a workflow_dispatch run and a push run on the same ref are
  # DIFFERENT gates (the deploy gate reads push results; a manual dispatch
  # must never cancel an in-flight push check, and a scheduled sweep must
  # never cancel either). Cancellation stays exactly where it belongs:
  # between older and newer runs of the SAME event type on the same ref.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

# The 2026-10-14 measured redesign: this workflow's OLD flow ran `clean
# verify` (a full second copy of the entire 160.4-minute suite — the same
# tests the CI workflow already runs on the same events) and then ANOTHER
# full `install -DskipTests` compile before ever booting the app. Three
# full compiles per PR round, two full test passes, one 185-minute wall.
# The suite itself now lives exactly once, sharded eight ways in the CI
# workflow; what only THIS workflow ever measured — the real application
# booting against real service containers and the composed five-leg
# visitor journey — is what it now runs: install (no tests), boot, smoke.
# The job name (a merge-ruleset required context) is preserved byte-for-
# byte.
jobs:
  integration:
    name: Full Integration Test (JDK 25)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Verify Environment
        run: |
          echo "=== Java ==="
          java -version 2>&1
          echo ""
          echo "=== Maven Wrapper ==="
          ./mvnw --version 2>&1
          echo ""
          echo "=== Docker ==="
          docker --version 2>&1
          echo ""
          echo "=== PostgreSQL ==="
          pg_isready -h localhost -p 5432 -U test 2>&1 || echo "Checking via health check..."
          echo ""
          echo "=== Redis ==="
          redis-cli -h localhost -p 6379 ping 2>&1 || echo "Checking via health check..."

      # ONE compile for the boot (the old flow compiled three times: clean
      # verify, install, then the test-run below). -DskipTests keeps test
      # COMPILATION (a broken test source still fails here) while skipping
      # execution — the documented skipTests semantics; the suite itself
      # runs once, sharded, in the CI workflow.
      - name: Build Application (install, tests skipped)
        run: ./mvnw install -DskipTests --batch-mode
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

      - name: Start Application
        run: |
          ./mvnw spring-boot:test-run -pl marketplace-app --batch-mode \
            -Dspring-boot.run.profiles=test \
            -Dspring-boot.run.jvmArguments="-Dserver.port=8080 -Duser.language=en -Duser.country=US" &
          echo "Waiting for application to start..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Application started successfully!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Application failed to start within 5 minutes"
              exit 1
            fi
            echo "Attempt $i/60..."
            sleep 5
          done
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: false
          MANAGEMENT_HEALTH_MAIL_ENABLED: false
          MANAGEMENT_TRACING_ENABLED: false

      # Plan item 4.4 (comprehensive-reverification-repair-plan-2026-09-26,
      # PR #400): ONE composed smoke scenario instead of three disconnected
      # curl probes. The three old steps each asserted one URL in isolation
      # (health / Data REST / GraphQL) — none of them ever exercised the
      # security boundary, so the most important production property (an
      # anonymous visitor reads the public surface but is rejected by the
      # resource-server chain on protected surfaces, RFC 7807 problem+json)
      # had NO smoke coverage at all. This is the composed journey, five
      # legs in one narrative, zero dependencies beyond curl+jq (both
      # already used below), every leg asserting status AND body contract:
      #   1. the aggregate health verdict is UP (the platform's own statement);
      #   2. a visitor browses the public listing surface -> 200 + the
      #      PagedResponse contract (content/totalElements);
      #   3. the SAME visitor attempts a protected write without a token ->
      #      401 + AUTHN-001 problem+json with the taxonomy type URI (the
      #      measured contract of problemDetailAuthenticationEntryPoint);
      #   4. the GraphQL surface is a PROTECTED surface: anonymous introspection
      #      answers the same 401 AUTHN-001 problem contract (measured on CI —
      #      the old probe's curl -sf | jq . masked the 401);
      #   5. the API chain's catch-all: an unrouted anonymous GET (bare /api)
      #      answers the same 401 AUTHN-001 problem contract — the old soft
      #      Data REST check ("No repositories exposed yet") was masking it.
      - name: Composed Smoke Scenario (visitor journey)
        run: |
          set -euo pipefail
          BASE=http://localhost:8080

          fail() { echo "::error::SMOKE FAIL — $1"; exit 1; }

          echo "=== [1/5] The aggregate health verdict is UP ==="
          code=$(curl -s -o /tmp/smoke-health.json -w '%{http_code}' "$BASE/actuator/health")
          echo "GET /actuator/health -> $code"
          [ "$code" = "200" ] || fail "aggregate health answered $code (expected 200 — the platform's own verdict)"
          jq -e '.status == "UP"' /tmp/smoke-health.json > /dev/null \
            || fail "health body: status is not UP ($(cat /tmp/smoke-health.json))"

          echo "=== [2/5] A visitor browses the public listing surface ==="
          code=$(curl -s -o /tmp/smoke-listings.json -w '%{http_code}' "$BASE/api/v1/listings?page=0&size=1")
          echo "GET /api/v1/listings -> $code"
          [ "$code" = "200" ] || fail "the public browse surface answered $code (expected 200)"
          jq -e 'has("content") and has("totalElements")' /tmp/smoke-listings.json > /dev/null \
            || fail "the browse answer is not the PagedResponse contract ($(cat /tmp/smoke-listings.json))"

          echo "=== [3/5] The same visitor attempts a protected write without a token ==="
          answer=$(curl -s -o /tmp/smoke-write.json -w '%{http_code} %{content_type}' \
            -X POST "$BASE/api/v1/listings" \
            -H 'Content-Type: application/json' \
            -d '{"title":"smoke probe","category":"stay","priceCents":1}')
          echo "POST /api/v1/listings (anonymous) -> $answer"
          code=${answer%% *}
          ctype=${answer#* }
          [ "$code" = "401" ] || fail "the resource-server chain answered $code (expected 401 — the boundary IS the contract)"
          case "$ctype" in application/problem+json*) ;; *) fail "the 401 content type is $ctype (expected application/problem+json)";; esac
          jq -e '.errorCode == "AUTHN-001" and .type == "https://marketplace.com/errors/unauthorized"' /tmp/smoke-write.json > /dev/null \
            || fail "the 401 body is not the AUTHN-001 problem contract ($(cat /tmp/smoke-write.json))"

          echo "=== [4/5] The GraphQL surface is walled by the pre-login gate: anonymous introspection is refused before dispatch ==="
          # The reopened contract (A0's landing of the Saleor campaign's
          # handoff-a0-prelogin-graphql-security.md): the anonymous POST
          # passes the security chain (the register/password-reset
          # public-POST precedent family) and PreLoginGraphQlGate — the
          # WebGraphQlInterceptor the app module ships — is the wall: it
          # parses the ACTUAL document and lets an anonymous caller reach
          # execution ONLY for the enumerated pre-login family. Introspection
          # is NOT in the family, so the gate answers the classified
          # AUTHN-001 GraphQL error envelope (HTTP 200 + application/json,
          # the error before dispatch) — the same taxonomy pair every other
          # classified GraphQL failure carries. The surface is exactly as
          # wide as the Saleor authentication contract, not one operation
          # wider.
          answer=$(curl -s -o /tmp/smoke-graphql.json -w '%{http_code} %{content_type}' -X POST "$BASE/graphql" \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ __schema { queryType { name } } }"}')
          echo "POST /graphql (introspection, anonymous) -> $answer"
          code=${answer%% *}
          ctype=${answer#* }
          [ "$code" = "200" ] || fail "anonymous GraphQL introspection answered $code (expected the gate's 200 + classified error envelope)"
          case "$ctype" in application/json*) ;; *) fail "the GraphQL gate answer's content type is $ctype (expected application/json)";; esac
          jq -e '.errors[0].extensions.errorCode == "AUTHN-001"' /tmp/smoke-graphql.json > /dev/null \
            || fail "the GraphQL gate answer is not the AUTHN-001 GraphQL error envelope ($(cat /tmp/smoke-graphql.json))"


          echo "=== [5/5] The API chain's catch-all rejects an unrouted anonymous path ==="
          # Measured fact: Spring Data REST is not on the classpath, so /api is
          # an unrouted path — but it still matches the resource-server chain's
          # /api/** matcher, and none of the permitAll lines matches a bare /api,
          # so anyRequest().authenticated() applies: an anonymous GET answers
          # 401 AUTHN-001 problem+json. The old soft check ("No repositories
          # exposed yet") was masking exactly this 401. This leg pins the
          # catch-all property (leg 3 passed a specific protected route; this
          # proves the chain's default posture), first-match-wins included.
          answer=$(curl -s -o /tmp/smoke-catchall.json -w '%{http_code} %{content_type}' "$BASE/api")
          echo "GET /api (anonymous, unrouted) -> $answer"
          code=${answer%% *}
          ctype=${answer#* }
          [ "$code" = "401" ] || fail "the unrouted anonymous path answered $code (expected the catch-all 401)"
          case "$ctype" in application/problem+json*) ;; *) fail "the catch-all 401 content type is $ctype (expected application/problem+json)";; esac
          jq -e '.errorCode == "AUTHN-001"' /tmp/smoke-catchall.json > /dev/null \
            || fail "the catch-all 401 body is not the AUTHN-001 problem contract ($(cat /tmp/smoke-catchall.json))"

          echo ""
          echo "SMOKE PASS — the composed visitor journey held: public read 200, protected write 401 AUTHN-001 problem+json, discovery surfaces alive."

      - name: Stop Application
        if: always()
        run: pkill -f "spring-boot" || true

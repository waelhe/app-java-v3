name: Android client

on:
  pull_request:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:
    inputs:
      buildSignedRelease:
        description: "Build a release-signed APK/AAB using configured release keystore secrets"
        type: boolean
        required: true
        default: false
      apiBaseUrl:
        description: "HTTPS API base URL used by the signed release"
        type: string
        required: true
        default: "https://app-java-v3-production-59bf.up.railway.app/"
      oidcIssuer:
        description: "Exact HTTPS OIDC issuer used by the signed release"
        type: string
        required: true
        default: "https://app-java-v3-production-59bf.up.railway.app"
      passkeyRpId:
        description: "DNS relying-party ID serving /.well-known/assetlinks.json (hostname only)"
        type: string
        required: true
        default: "app-java-v3-production-59bf.up.railway.app"

permissions:
  contents: read

jobs:
  android:
    name: Native Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up stable Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"

      - name: Validate release preflight script syntax
        run: bash -n android/scripts/verify-passkey-release.sh

      - name: Run JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        env:
          # Public OAuth client ID only; never pass an OAuth client secret to an Android build.
          OAUTH_PUBLIC_CLIENT_ID: android-community-native
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PoidcClientId="${OAUTH_PUBLIC_CLIENT_ID}" -PoidcRedirectUri=com.marketplace.android:/oauth2redirect

      - name: Run Android auth-entry instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            ./gradlew :app:connectedDebugAndroidTest -PoidcClientId=android-community-native -PoidcRedirectUri=com.marketplace.android:/oauth2redirect

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: community-platform-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  release:
    name: Sign Android release (manual, opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.buildSignedRelease
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up stable Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?Missing secret ANDROID_RELEASE_KEYSTORE_BASE64}"
          keystore="$RUNNER_TEMP/android-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          printf 'ANDROID_RELEASE_KEYSTORE_PATH=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          OAUTH_PUBLIC_CLIENT_ID: android-community-native
          OIDC_REDIRECT_URI: com.marketplace.android:/oauth2redirect
          API_BASE_URL: ${{ inputs.apiBaseUrl }}
          OIDC_ISSUER: ${{ inputs.oidcIssuer }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$API_BASE_URL" == https://* ]] || { echo "apiBaseUrl must use HTTPS." >&2; exit 1; }
          [[ "$OIDC_ISSUER" == https://* ]] || { echo "oidcIssuer must use HTTPS." >&2; exit 1; }
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PapiBaseUrl="$API_BASE_URL" \
            -PoidcIssuer="$OIDC_ISSUER" \
            -PoidcClientId="$OAUTH_PUBLIC_CLIENT_ID" \
            -PoidcRedirectUri="$OIDC_REDIRECT_URI"
      - name: Derive signing identity for Digital Asset Links
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$ANDROID_RELEASE_KEYSTORE_PATH"
          cert="$RUNNER_TEMP/android-release-cert.der"
          keytool -exportcert -keystore "$keystore" -storepass:env ANDROID_RELEASE_KEYSTORE_PASSWORD \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" -file "$cert" >/dev/null
          fingerprint="$(keytool -list -v -keystore "$keystore" -storepass:env ANDROID_RELEASE_KEYSTORE_PASSWORD \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          origin="$(openssl dgst -sha256 -binary "$cert" | openssl base64 -A | tr '/+' '_-' | tr -d '=')"
          test -n "$fingerprint"
          test -n "$origin"
          {
            echo "## Release signing identity"
            echo
            printf '%s\n' '- Android package: `com.marketplace.android`'
            printf '%s\n' "- SHA-256 certificate fingerprint: $fingerprint"
            printf '%s\n' "- WebAuthn Android origin: android:apk-key-hash:$origin"
            echo
            echo "If the app is distributed through Google Play App Signing, use the **App signing key certificate** fingerprint from Play Console instead of this upload-key fingerprint."
            echo "Configure the RP ID, allowed origin and fingerprint on the matching non-production or production Railway environment only after validating the intended signing identity. This workflow does not modify Railway."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$cert"

      - name: Verify signed artifacts and deployed passkey prerequisites
        env:
          API_BASE_URL: ${{ inputs.apiBaseUrl }}
          OIDC_ISSUER: ${{ inputs.oidcIssuer }}
          PASSKEY_RP_ID: ${{ inputs.passkeyRpId }}
          ANDROID_PACKAGE_NAME: com.marketplace.android
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        shell: bash
        run: bash android/scripts/verify-passkey-release.sh
      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v6
        with:
          name: community-platform-android-release-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

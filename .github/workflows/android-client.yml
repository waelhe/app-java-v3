name: Android client

on:
  pull_request:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"

# Signed releases are produced automatically by pushing an `android-v*` tag
# (see .github/workflows/android-release.yml) — no manual dispatch lever.

permissions:
  contents: read

jobs:
  android:
    name: Native Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up stable Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 platforms;android-36 build-tools;36.0.0"

      - name: Validate release preflight script syntax
        run: bash -n android/scripts/verify-passkey-release.sh

      - name: Run JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        env:
          # Public OAuth client ID only; never pass an OAuth client secret to an Android build.
          OAUTH_PUBLIC_CLIENT_ID: android-community-native
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PoidcClientId="${OAUTH_PUBLIC_CLIENT_ID}" -PoidcRedirectUri=com.marketplace.android:/oauth2redirect

      - name: Prepare Android CI diagnostics
        if: always()
        run: mkdir -p android/android-ci-diagnostics

      # API 35 is retained for now; collect evidence before changing emulator configuration again.
      # The EXIT trap runs inside the emulator action, while ADB can still reach the device.
      - name: Run Android auth-entry instrumentation test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            cd android
            diagnostics_dir="$GITHUB_WORKSPACE/android/android-ci-diagnostics"
            mkdir -p "$diagnostics_dir"

            capture_android_diagnostics() {
              exit_code=$?
              trap - EXIT
              set +e

              printf '%s\n' "$exit_code" > "$diagnostics_dir/exit-status.txt"
              {
                echo "Captured at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                echo "Gradle command: :app:connectedDebugAndroidTest"
                echo "Emulator API requested: 35"
              } > "$diagnostics_dir/environment.txt"

              timeout 30s adb devices -l > "$diagnostics_dir/adb-devices.txt" 2>&1
              for property in ro.build.version.sdk ro.build.fingerprint sys.boot_completed init.svc.bootanim; do
                {
                  printf '\n[%s]\n' "$property"
                  timeout 10s adb shell getprop "$property"
                } >> "$diagnostics_dir/device-properties.txt" 2>&1
              done
              timeout 30s adb shell pm list instrumentation > "$diagnostics_dir/instrumentation-packages.txt" 2>&1
              timeout 30s adb shell dumpsys activity instrumentation > "$diagnostics_dir/activity-instrumentation.txt" 2>&1
              timeout 60s adb logcat -d -b all -v threadtime > "$diagnostics_dir/logcat-all.txt" 2>&1

              mkdir -p "$diagnostics_dir/test-reports"
              for report_path in app/build/reports/androidTests/connected app/build/outputs/androidTest-results/connected app/build/reports/tests/connectedDebugAndroidTest; do
                if [ -e "$report_path" ]; then
                  report_name="$(printf '%s' "$report_path" | tr '/ ' '__')"
                  rm -rf "$diagnostics_dir/test-reports/$report_name"
                  cp -R "$report_path" "$diagnostics_dir/test-reports/$report_name"
                fi
              done

              if [ -s "$diagnostics_dir/logcat-all.txt" ]; then
                grep -Ein 'FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION_FAILED|Process: .*\(pid|ANR in|am_crash|am_anr|Exception|AssertionError' "$diagnostics_dir/logcat-all.txt" > "$diagnostics_dir/logcat-suspects.txt" || true
              fi
              exit "$exit_code"
            }
            trap capture_android_diagnostics EXIT

            if ./gradlew :app:connectedDebugAndroidTest -PoidcClientId=android-community-native -PoidcRedirectUri=com.marketplace.android:/oauth2redirect --stacktrace --console=plain > "$diagnostics_dir/connectedDebugAndroidTest.log" 2>&1; then
  gradle_status=0
else
  gradle_status=$?
fi
cat "$diagnostics_dir/connectedDebugAndroidTest.log"
exit "$gradle_status"

      # Fallback for failures before the emulator action reaches its script.
      # Do not overwrite evidence captured by the EXIT trap.
      - name: Collect Android diagnostics fallback
        if: always()
        shell: bash
        run: |
          set +e
          diagnostics_dir="android/android-ci-diagnostics"
          mkdir -p "$diagnostics_dir"
          if [ ! -f "$diagnostics_dir/adb-devices.txt" ]; then
            timeout 30s adb devices -l > "$diagnostics_dir/adb-devices.txt" 2>&1
          fi
          if [ ! -f "$diagnostics_dir/logcat-all.txt" ]; then
            timeout 60s adb logcat -d -b all -v threadtime > "$diagnostics_dir/logcat-all.txt" 2>&1
          fi
          for report_path in android/app/build/reports/androidTests/connected android/app/build/outputs/androidTest-results/connected android/app/build/reports/tests/connectedDebugAndroidTest; do
            if [ -e "$report_path" ]; then
              report_name="$(printf '%s' "$report_path" | tr '/ ' '__')"
              mkdir -p "$diagnostics_dir/test-reports"
              if [ ! -e "$diagnostics_dir/test-reports/$report_name" ]; then
                cp -R "$report_path" "$diagnostics_dir/test-reports/$report_name"
              fi
            fi
          done
          if [ -f "$diagnostics_dir/logcat-all.txt" ] && [ ! -f "$diagnostics_dir/logcat-suspects.txt" ]; then
            grep -Ein 'FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION_FAILED|Process: .*\(pid|ANR in|am_crash|am_anr|Exception|AssertionError' "$diagnostics_dir/logcat-all.txt" > "$diagnostics_dir/logcat-suspects.txt" || true
          fi

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: community-platform-android-ci-diagnostics
          path: android/android-ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: community-platform-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

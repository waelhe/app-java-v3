name: Android client

on:
  pull_request:
    branches: [ main ]
    paths:
      - "android/**"
      # A server-side SDL change changes the Apollo codegen inputs: the
      # full Android build must validate against the published contract
      # (CI's android-graphql job already validated the PR's own runtime
      # dump; this run builds the actual APK against the published one).
      - "marketplace-app/src/main/resources/graphql/**"
      - ".github/workflows/android-client.yml"
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "marketplace-app/src/main/resources/graphql/**"
      - ".github/workflows/android-client.yml"

# Signed releases are produced automatically by pushing an `android-v*` tag
# (see .github/workflows/android-release.yml) — no manual dispatch lever.

permissions:
  contents: read

jobs:
  android:
    name: Native Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up stable Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # GraphQL Phase 5 (docs/api/graphql-target-architecture.md
      # §11-Phase-5 item 3/4): stage the CI-published contract SDL for
      # Apollo codegen. The graphql-contract branch is machine-written by
      # .github/workflows/graphql-contract.yml from the schema CI booted
      # and gated — fetching the PUBLISHED contract, never the production
      # server, never a hand copy (the file is gitignored in the tree).
      # Deliberate design (CodeRabbit round-1, rejected-with-measurement):
      # this workflow builds against the PUBLISHED contract, not the PR's
      # own dump — the per-PR schema validation lives in the REQUIRED
      # "Android GraphQL Contract Gate" (CI's android-graphql job, same-run
      # dump); this workflow is not a required check, so enforcement must
      # not move here. Known signal: a PR adding an SDL field + updated
      # operations reds here while the required gate stays green (the APK
      # cannot embed an operation the published contract does not carry
      # yet) — it resolves when the merge advances the contract. See
      # android/README.md — GraphQL contract consumption.
      - name: Fetch the published GraphQL contract schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/graphql
          if ! curl -fsSL "https://raw.githubusercontent.com/waelhe/app-java-v3/graphql-contract/schema.graphqls" \
              -o android/app/src/main/graphql/schema.graphqls; then
            echo "::error::The GraphQL contract branch 'graphql-contract' is not published yet. It is created by .github/workflows/graphql-contract.yml after the first successful CI run on main that carries that workflow (the Phase-5 bootstrap)."
            exit 1
          fi
          echo "Staged published GraphQL contract SDL ($(wc -c < android/app/src/main/graphql/schema.graphqls) bytes)."

      - name: Validate Android CI scripts syntax
        run: |
          bash -n android/scripts/verify-passkey-release.sh
          bash -n android/scripts/run-android-instrumentation-with-diagnostics.sh

      - name: Run JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        env:
          # Public OAuth client ID only; never pass an OAuth client secret to an Android build.
          OAUTH_PUBLIC_CLIENT_ID: android-community-native
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PoidcClientId="${OAUTH_PUBLIC_CLIENT_ID}" -PoidcRedirectUri=com.marketplace.android:/oauth2redirect

      # Official android-emulator-runner guidance: allow the runner user to access KVM.
      # Without this permission the action falls back to software emulation, which has caused
      # very slow boots followed by adb PropertyFetcher timeouts in the current CI logs.
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "Runner identity:"
          id
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable; this runner cannot launch a hardware-accelerated Android emulator."
            exit 1
          fi
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::Runner user still lacks read/write access to /dev/kvm after applying the documented udev rule."
            exit 1
          fi

      - name: Prepare Android CI diagnostics
        if: always()
        run: mkdir -p android/android-ci-diagnostics

      # Run the instrumentation smoke test on API 36, matching the app target SDK.
      # The EXIT trap runs inside the emulator action, while ADB can still reach the device.
      - name: Run Android auth-entry instrumentation test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash android/scripts/run-android-instrumentation-with-diagnostics.sh

      # Fallback for failures before the emulator action reaches its script.
      # Do not overwrite evidence captured by the EXIT trap.
      - name: Collect Android diagnostics fallback
        if: always()
        shell: bash
        run: |
          set +e
          diagnostics_dir="android/android-ci-diagnostics"
          mkdir -p "$diagnostics_dir"
          if [ ! -f "$diagnostics_dir/adb-devices.txt" ]; then
            timeout 30s adb devices -l > "$diagnostics_dir/adb-devices.txt" 2>&1
          fi
          if [ ! -f "$diagnostics_dir/logcat-all.txt" ]; then
            timeout 60s adb logcat -d -b all -v threadtime > "$diagnostics_dir/logcat-all.txt" 2>&1
          fi
          for report_path in android/app/build/reports/androidTests/connected android/app/build/outputs/androidTest-results/connected android/app/build/reports/tests/connectedDebugAndroidTest; do
            if [ -e "$report_path" ]; then
              report_name="$(printf '%s' "$report_path" | tr '/ ' '__')"
              mkdir -p "$diagnostics_dir/test-reports"
              if [ ! -e "$diagnostics_dir/test-reports/$report_name" ]; then
                cp -R "$report_path" "$diagnostics_dir/test-reports/$report_name"
              fi
            fi
          done
          if [ -f "$diagnostics_dir/logcat-all.txt" ] && [ ! -f "$diagnostics_dir/logcat-suspects.txt" ]; then
            grep -Ein 'FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION_FAILED|Process: .*\(pid|ANR in|am_crash|am_anr|Exception|AssertionError' "$diagnostics_dir/logcat-all.txt" > "$diagnostics_dir/logcat-suspects.txt" || true
          fi

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: community-platform-android-ci-diagnostics
          path: android/android-ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: community-platform-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

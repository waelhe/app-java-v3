name: Android client

on:
  pull_request:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Native Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required SDK platforms
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run JVM tests
        run: gradle -p android :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: dayf-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

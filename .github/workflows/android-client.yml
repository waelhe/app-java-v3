name: Android client

on:
  pull_request:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Native Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools"

      # Android 17 / API 37 is a preview SDK. Use Google's current Android CLI
      # and its documented canary channel rather than the deprecated sdkmanager.
      - name: Install Android CLI
        shell: bash
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          android_bin="$(command -v android || true)"
          if [[ -z "$android_bin" ]]; then
            android_bin="$(find -L "$HOME" -type f -name android -perm -u+x -print -quit)"
          fi
          if [[ -z "$android_bin" ]]; then
            echo "Android CLI was installed but could not be located." >&2
            exit 1
          fi
          echo "$(dirname "$android_bin")" >> "$GITHUB_PATH"
          "$android_bin" --sdk="$ANDROID_SDK_ROOT" sdk install --canary platforms/android-37 build-tools/36.0.0

      - name: Run JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        env:
          # Public OAuth client ID only; never pass an OAuth client secret to an Android build.
          OAUTH_PUBLIC_CLIENT_ID: android-community-native
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PoidcClientId="${OAUTH_PUBLIC_CLIENT_ID}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: community-platform-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Android client

on:
  pull_request:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"

# Signed releases are produced automatically by pushing an `android-v*` tag
# (see .github/workflows/android-release.yml) — no manual dispatch lever.

permissions:
  contents: read

jobs:
  android:
    name: Native Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up stable Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Validate Android CI scripts syntax
        run: |
          bash -n android/scripts/verify-passkey-release.sh
          bash -n android/scripts/run-android-instrumentation-with-diagnostics.sh

      - name: Run JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        env:
          # Public OAuth client ID only; never pass an OAuth client secret to an Android build.
          OAUTH_PUBLIC_CLIENT_ID: android-community-native
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PoidcClientId="${OAUTH_PUBLIC_CLIENT_ID}" -PoidcRedirectUri=com.marketplace.android:/oauth2redirect

      # Official android-emulator-runner guidance: allow the runner user to access KVM.
      # Without this permission the action falls back to software emulation, which has caused
      # very slow boots followed by adb PropertyFetcher timeouts in the current CI logs.
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "Runner identity:"
          id
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable; this runner cannot launch a hardware-accelerated Android emulator."
            exit 1
          fi
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::Runner user still lacks read/write access to /dev/kvm after applying the documented udev rule."
            exit 1
          fi

      - name: Prepare Android CI diagnostics
        if: always()
        run: mkdir -p android/android-ci-diagnostics

      # Run the instrumentation smoke test on API 36, matching the app target SDK.
      # The EXIT trap runs inside the emulator action, while ADB can still reach the device.
      - name: Run Android auth-entry instrumentation test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash android/scripts/run-android-instrumentation-with-diagnostics.sh

      # Fallback for failures before the emulator action reaches its script.
      # Do not overwrite evidence captured by the EXIT trap.
      - name: Collect Android diagnostics fallback
        if: always()
        shell: bash
        run: |
          set +e
          diagnostics_dir="android/android-ci-diagnostics"
          mkdir -p "$diagnostics_dir"
          if [ ! -f "$diagnostics_dir/adb-devices.txt" ]; then
            timeout 30s adb devices -l > "$diagnostics_dir/adb-devices.txt" 2>&1
          fi
          if [ ! -f "$diagnostics_dir/logcat-all.txt" ]; then
            timeout 60s adb logcat -d -b all -v threadtime > "$diagnostics_dir/logcat-all.txt" 2>&1
          fi
          for report_path in android/app/build/reports/androidTests/connected android/app/build/outputs/androidTest-results/connected android/app/build/reports/tests/connectedDebugAndroidTest; do
            if [ -e "$report_path" ]; then
              report_name="$(printf '%s' "$report_path" | tr '/ ' '__')"
              mkdir -p "$diagnostics_dir/test-reports"
              if [ ! -e "$diagnostics_dir/test-reports/$report_name" ]; then
                cp -R "$report_path" "$diagnostics_dir/test-reports/$report_name"
              fi
            fi
          done
          if [ -f "$diagnostics_dir/logcat-all.txt" ] && [ ! -f "$diagnostics_dir/logcat-suspects.txt" ]; then
            grep -Ein 'FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION_FAILED|Process: .*\(pid|ANR in|am_crash|am_anr|Exception|AssertionError' "$diagnostics_dir/logcat-all.txt" > "$diagnostics_dir/logcat-suspects.txt" || true
          fi

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: community-platform-android-ci-diagnostics
          path: android/android-ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: community-platform-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

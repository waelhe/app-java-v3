name: Android client

on:
  pull_request:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:
    inputs:
      buildSignedRelease:
        description: "Build a release-signed APK/AAB using configured release keystore secrets"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  android:
    name: Native Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools"

      # API 37 is distributed on Android's canary SDK channel; the stable-only
      # sdkmanager in setup-android cannot resolve platforms;android-37.
      - name: Install Android 17 SDK
        shell: bash
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          android_bin="$(command -v android || true)"
          if [[ -z "$android_bin" ]]; then
            android_bin="$(find -L "$HOME" -type f -name android -perm -u+x -print -quit)"
          fi
          if [[ -z "$android_bin" ]]; then
            echo "Android CLI was installed but could not be located." >&2
            exit 1
          fi
          echo "$(dirname "$android_bin")" >> "$GITHUB_PATH"
          "$android_bin" --sdk="$ANDROID_SDK_ROOT" sdk install --canary platforms/android-37 build-tools/36.0.0

      - name: Run JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        env:
          # Public OAuth client ID only; never pass an OAuth client secret to an Android build.
          OAUTH_PUBLIC_CLIENT_ID: android-community-native
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PoidcClientId="${OAUTH_PUBLIC_CLIENT_ID}" -PoidcRedirectUri=com.marketplace.android:/oauth2redirect

      - name: Run Android auth-entry instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            ./gradlew :app:connectedDebugAndroidTest -PoidcClientId=android-community-native -PoidcRedirectUri=com.marketplace.android:/oauth2redirect

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: community-platform-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  release:
    name: Sign Android release (manual, opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.buildSignedRelease
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools"

      - name: Install Android 17 SDK
        shell: bash
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          android_bin="$(command -v android || true)"
          if [[ -z "$android_bin" ]]; then
            android_bin="$(find -L "$HOME" -type f -name android -perm -u+x -print -quit)"
          fi
          if [[ -z "$android_bin" ]]; then
            echo "Android CLI was installed but could not be located." >&2
            exit 1
          fi
          echo "$(dirname "$android_bin")" >> "$GITHUB_PATH"
          "$android_bin" --sdk="$ANDROID_SDK_ROOT" sdk install --canary platforms/android-37 build-tools/36.0.0

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?Missing secret ANDROID_RELEASE_KEYSTORE_BASE64}"
          keystore="$RUNNER_TEMP/android-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          printf 'ANDROID_RELEASE_KEYSTORE_PATH=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          OAUTH_PUBLIC_CLIENT_ID: android-community-native
          OIDC_REDIRECT_URI: com.marketplace.android:/oauth2redirect
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PoidcClientId="${OAUTH_PUBLIC_CLIENT_ID}" \
            -PoidcRedirectUri="${OIDC_REDIRECT_URI}"

      - name: Derive signing identity for Digital Asset Links
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$ANDROID_RELEASE_KEYSTORE_PATH"
          cert="$RUNNER_TEMP/android-release-cert.der"
          keytool -exportcert -keystore "$keystore" -storepass:env ANDROID_RELEASE_KEYSTORE_PASSWORD \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" -file "$cert" >/dev/null
          fingerprint="$(keytool -list -v -keystore "$keystore" -storepass:env ANDROID_RELEASE_KEYSTORE_PASSWORD \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          origin="$(openssl dgst -sha256 -binary "$cert" | openssl base64 -A | tr '/+' '_-' | tr -d '=')"
          test -n "$fingerprint"
          test -n "$origin"
          {
            echo "## Release signing identity"
            echo
            echo "- Android package: `com.marketplace.android`"
            echo "- SHA-256 certificate fingerprint: `$fingerprint`"
            echo "- WebAuthn Android origin: `android:apk-key-hash:$origin`"
            echo
            echo "If the app is distributed through Google Play App Signing, use the **App signing key certificate** fingerprint from Play Console instead of this upload-key fingerprint."
            echo "Configure the RP ID, allowed origin and fingerprint on the matching non-production or production Railway environment only after validating the intended signing identity. This workflow does not modify Railway."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$cert"

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v6
        with:
          name: community-platform-android-release-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

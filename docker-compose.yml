services:
  postgres:
    image: postgres:17-alpine
    container_name: marketplace-db
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: marketplace-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/marketplace
      DB_USERNAME: marketplace
      DB_PASSWORD: marketplace
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_SERVER_ISSUER: http://localhost:8080
      MANAGEMENT_SERVER_PORT: "8081"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - logs:/var/log/marketplace

volumes:
  pgdata:
  uploads:
  logs:

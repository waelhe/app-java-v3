services:
  postgres:
    # P1 (postgis integration plan §D-P7): the one image family across
    # environments — postgis/postgis:18-3.6-alpine here (CI/compose/
    # Testcontainers ride alpine as before; production rides the Debian
    # 18-3.6 tag — the difference is the base OS alone, the schema and
    # migrations are one). postgres:18-alpine moved the cluster to
    # /var/lib/postgresql/18/docker and declares /var/lib/postgresql as its
    # volume (CodeRabbit #241): the named volume covers the versioned data
    # root. The postgis image keeps the same layout.
    # NOTE: the image's initdb-postgis creates the extension in
    # POSTGRES_DB only on FIRST initialization ("Initialize Only on Empty
    # Data Directory") — an existing pgdata18 volume from the plain
    # postgres image carries no extension, and recreating the local volume
    # (docker compose down -v) starts a fresh init that carries it. V50's
    # CREATE EXTENSION IF NOT EXISTS covers both shapes either way.
    image: postgis/postgis:18-3.6-alpine
    container_name: marketplace-db
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: marketplace-redis
    # Official durability posture (redis.io persistence): AOF everysec (<=1s
    # loss window, suggested default) + RDB snapshots retained — the
    # "PostgreSQL-comparable safety" recipe. Same posture as production
    # (RDB + /data); local/dev parity included. Pure flags + volume: first-run
    # behavior unchanged, restarts keep sessions.
    command: redis-server --appendonly yes --appendfsync everysec --save "60 1000"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata18:
  redisdata:

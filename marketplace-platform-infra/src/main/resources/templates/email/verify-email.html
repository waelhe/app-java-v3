<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Verify Your Email</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto;">
<h1 style="color: #2d6a4f;">Verify Your Email Address</h1>
<p th:text="'Hello, ' + ${name} + '!'">Hello, User!</p>
<p>Thank you for registering. Please verify your email address to activate your account:</p>
<p style="margin: 20px 0;">
    <a th:href="${verificationLink}"
       style="background-color: #2d6a4f; color: #fff; padding: 12px 24px; text-decoration: none; border-radius: 4px;">
        Verify Email
    </a>
</p>
<p style="font-size: 14px; color: #666;">This link will expire in 24 hours.</p>
<hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;" />
<p style="font-size: 12px; color: #999;">If you did not create this account, please ignore this email.</p>
</body>
</html>
